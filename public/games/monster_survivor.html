<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>怪獸生存戰</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: #2b2340; background: #a9dc79;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; cursor: pointer; border: 0; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; }
  .hidden { display: none !important; }

  /* 搖桿（沿用舊版：左右固定搖桿＋拖曳畫面） */
  .joystick { position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); width: 92px; height: 92px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7); background: rgba(255,255,255,.22); z-index: 5; pointer-events: none; display: none; }
  .joystick.right { left: auto; right: max(14px, env(safe-area-inset-right)); }
  .joystick .stick { position: absolute; width: 40px; height: 40px; left: 23px; top: 23px; border-radius: 50%; background: rgba(255,255,255,.8); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  body.touch.playing .joystick { display: block; }

  #pauseBtn { position: fixed; top: max(32px, calc(env(safe-area-inset-top) + 32px)); right: max(10px, env(safe-area-inset-right)); width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,.9); border: 2px solid #fff; font-size: 20px; z-index: 6; box-shadow: 0 3px 0 rgba(0,0,0,.12); }

  /* 選單與面板 */
  .screen { position: fixed; inset: 0; z-index: 10; overflow-y: auto; touch-action: pan-y; background: linear-gradient(#bfe6f7, #fff6dc 70%); }
  .menu { min-height: 100%; padding: 20px 16px 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .menu h1 { margin: 0; font-size: 30px; font-weight: 900; color: #3b2a6b; text-shadow: 0 3px 0 #fff; text-align: center; }
  .menu h1 small { display: block; font-size: 12px; color: #7a6aa8; letter-spacing: .25em; }
  .modes { display: flex; gap: 8px; background: rgba(255,255,255,.55); padding: 6px; border-radius: 18px; width: min(460px, 100%); }
  .mode { flex: 1; padding: 10px 8px; border-radius: 14px; font-weight: 900; font-size: 16px; color: #6b5b95; background: transparent; }
  .mode small { display: block; font-weight: 700; font-size: 11px; opacity: .85; margin-top: 2px; }
  .mode.on { background: linear-gradient(#ffe08a, #ffb347); color: #5a3200; box-shadow: 0 4px 0 #d98a1e; }
  .sec { width: min(920px, 100%); }
  .sec h2 { margin: 0 0 8px; font-size: 15px; color: #5b4a8a; }
  .maps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .map { aspect-ratio: 1 / 1.02; border-radius: 16px; padding: 8px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; color: #fff; font-weight: 900; font-size: 13px; position: relative; border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.14); text-align: left; text-shadow: 0 1px 2px rgba(0,0,0,.35); overflow: hidden; }
  .map small { font-weight: 700; font-size: 11px; }
  .map .ic { position: absolute; top: 18%; left: 0; right: 0; text-align: center; font-size: 32px; text-shadow: none; }
  .map.on { border-color: #ffd166; box-shadow: 0 0 0 3px #ffd166, 0 5px 0 rgba(0,0,0,.14); }
  .map.lock { filter: grayscale(.85) brightness(.8); }
  .map .stars { position: absolute; top: 5px; left: 8px; font-size: 13px; letter-spacing: 1px; color: #ffe27a; }
  .pals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pal { background: #fff; border-radius: 20px; padding: 10px 12px; border: 3px solid #eadff7; display: flex; gap: 10px; align-items: center; text-align: left; color: inherit; }
  .pal.on { border-color: #ffd166; box-shadow: 0 0 0 3px #ffe9a8; }
  .pal canvas { width: 72px; height: 72px; flex: none; }
  .pal b { font-size: 17px; }
  .pal p { margin: 3px 0 0; font-size: 12px; color: #6b5b80; line-height: 1.45; }
  .pal .tag { display: inline-block; margin-top: 5px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: #f3ecff; color: #6d4bc4; }
  .go { width: min(360px, 100%); height: 62px; border-radius: 20px; font-size: 22px; font-weight: 900; color: #5a3200; background: linear-gradient(#ffe08a, #ffb347); box-shadow: 0 6px 0 #d98a1e; }
  .go:active { transform: translateY(3px); box-shadow: 0 3px 0 #d98a1e; }
  .note { font-size: 12px; color: #7a6a90; margin: 0; text-align: center; line-height: 1.6; }

  .overlay { position: fixed; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(40, 25, 70, .45); }
  .panel { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: #fffaf0; border: 4px solid #fff; border-radius: 26px; padding: 18px 16px; box-shadow: 0 10px 0 rgba(0,0,0,.15); text-align: center; touch-action: pan-y; }
  .panel h2 { margin: 0 0 4px; font-size: 26px; font-weight: 900; color: #3b2a6b; }
  .panel p { margin: 4px 0; color: #6b5b80; font-weight: 700; }
  .cards { display: grid; gap: 10px; margin-top: 12px; }
  .card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #fff; border: 3px solid #f0e3c4; text-align: left; color: inherit; box-shadow: 0 4px 0 #ecdcb5; min-height: 74px; }
  .card:active { transform: translateY(2px); box-shadow: 0 2px 0 #ecdcb5; }
  .card .ci { font-size: 34px; width: 48px; text-align: center; flex: none; }
  .card b { font-size: 18px; }
  .card .lv { font-size: 12px; font-weight: 900; color: #c47f00; margin-left: 6px; }
  .card .new { font-size: 11px; font-weight: 900; color: #fff; background: #ff7a59; padding: 1px 7px; border-radius: 99px; margin-left: 6px; }
  .card .evo { font-size: 11px; font-weight: 900; color: #fff; background: linear-gradient(90deg, #ff6b9a, #ffb347, #4fd2ff); padding: 1px 7px; border-radius: 99px; margin-left: 6px; }
  .card small { display: block; font-size: 13px; color: #6b5b80; margin-top: 2px; font-weight: 700; }
  .btns { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .btn { min-width: 130px; height: 52px; padding: 0 18px; border-radius: 16px; font-size: 17px; font-weight: 900; color: #5a3200; background: linear-gradient(#ffe08a, #ffb347); box-shadow: 0 5px 0 #d98a1e; }
  .btn.sub { background: #efe7fb; color: #5b4a8a; box-shadow: 0 5px 0 #d6c8ee; }
  .bigstars { font-size: 40px; letter-spacing: 4px; color: #ffc533; text-shadow: 0 3px 0 #d98a1e; margin: 4px 0; }
  .earn { display: inline-block; margin-top: 8px; padding: 6px 16px; border-radius: 99px; background: #fff3c4; border: 2px solid #ffd166; font-weight: 900; color: #a06a00; }

  @media (max-width: 640px) {
    .maps { grid-template-columns: repeat(3, 1fr); }
    .pals { grid-template-columns: 1fr; }
    .menu h1 { font-size: 26px; }
  }
</style>
</head>
<body>

const persist = () => store.set(SAVE_KEY, save);

// 舊版 Safari 沒有 roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    const rr = Math.min(Array.isArray(r) ? r[0] : r || 0, w / 2, h / 2);
    this.moveTo(x + rr, y); this.arcTo(x + w, y, x + w, y + h, rr); this.arcTo(x + w, y + h, x, y + h, rr);
    this.arcTo(x, y + h, x, y, rr); this.arcTo(x, y, x + w, y, rr); this.closePath();
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => Math.random() * (b - a) + a;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const hypot = Math.hypot;
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
const fmt = (s) => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

    foes: [['ghost', '#ffc4e1', '#ff7ab8'], ['spike', '#c79cff', '#7a4fd9'], ['blob', '#ffe08a', '#f0a23c']],

    lv: [{ n: 1, dmg: 12, cd: 0.85 }, { n: 2, dmg: 12, cd: 0.8 }, { n: 2, dmg: 16, cd: 0.7 }, { n: 3, dmg: 18, cd: 0.62 }, { n: 4, dmg: 24, cd: 0.5, pierce: 2, size: 1.5 }] },

    lv: [{ n: 1, dmg: 10, r: 68 }, { n: 2, dmg: 11, r: 72 }, { n: 3, dmg: 13, r: 78 }, { n: 3, dmg: 17, r: 84 }, { n: 5, dmg: 24, r: 96, size: 1.5 }] },
  thunder: { name: '落雷', evo: '雷神之怒', icon: '⚡',
    desc: ['每隔一下就打雷劈 2 隻怪', '一次劈 3 隻', '一次劈 4 隻', '劈 5 隻、更快', '進化！雷神之怒會連鎖'],
    lv: [{ n: 2, dmg: 24, cd: 1.5 }, { n: 3, dmg: 26, cd: 1.4 }, { n: 4, dmg: 30, cd: 1.3 }, { n: 5, dmg: 36, cd: 1.2 }, { n: 7, dmg: 48, cd: 1.0, chain: true }] },

    lv: [{ n: 1, dmg: 12, cd: 1.6 }, { n: 1, dmg: 15, cd: 1.4 }, { n: 2, dmg: 16, cd: 1.35 }, { n: 2, dmg: 20, cd: 1.2 }, { n: 3, dmg: 26, cd: 1.0, size: 1.5 }] },

/* =========================================================
   畫圖小工具：可愛怪獸
   ========================================================= */
function eyes(c, x, y, s, look = 0, angry = false) {
  for (const dx of [-1, 1]) {
    const ex = x + dx * s * 0.2;
    c.fillStyle = '#fff'; c.beginPath(); c.ellipse(ex, y, s * 0.13, s * 0.15, 0, 0, 7); c.fill();
    c.fillStyle = '#1d1630'; c.beginPath(); c.arc(ex + look * s * 0.04, y + s * 0.02, s * 0.075, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + look * s * 0.04 - s * 0.03, y - s * 0.03, s * 0.028, 0, 7); c.fill();
    if (angry) { c.strokeStyle = '#1d1630'; c.lineWidth = s * 0.05; c.lineCap = 'round'; c.beginPath(); c.moveTo(ex - dx * s * 0.13, y - s * 0.2); c.lineTo(ex + dx * s * 0.08, y - s * 0.13); c.stroke(); }
  }
}
function mouth(c, x, y, s, angry) {
  c.strokeStyle = '#1d1630'; c.lineWidth = Math.max(1.5, s * 0.04); c.lineCap = 'round'; c.beginPath();
  if (angry) { c.moveTo(x - s * 0.08, y); c.lineTo(x + s * 0.08, y); } else c.arc(x, y - s * 0.07, s * 0.08, 0.15 * Math.PI, 0.85 * Math.PI);
  c.stroke();
}
function shadow(c, x, y, w, h) { c.fillStyle = 'rgba(0,0,0,.16)'; c.beginPath(); c.ellipse(x, y, w, h, 0, 0, 7); c.fill(); }
function blob(c, x, y, s, c1, c2, opt = {}) {
  if (opt.shadow !== false) shadow(c, x, y + s * 0.42, s * 0.42, s * 0.11);
  const g = c.createLinearGradient(x, y - s * 0.5, x, y + s * 0.45); g.addColorStop(0, c1); g.addColorStop(1, c2);
  c.fillStyle = g; c.strokeStyle = 'rgba(40,20,60,.55)'; c.lineWidth = Math.max(2, s * 0.05);
  c.beginPath();
  c.moveTo(x - s * 0.46, y + s * 0.38);
  c.bezierCurveTo(x - s * 0.56, y - s * 0.1, x - s * 0.3, y - s * 0.52, x, y - s * 0.5);
  c.bezierCurveTo(x + s * 0.3, y - s * 0.52, x + s * 0.56, y - s * 0.1, x + s * 0.46, y + s * 0.38);
  c.quadraticCurveTo(x, y + s * 0.5, x - s * 0.46, y + s * 0.38);
  c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(x - s * 0.2, y - s * 0.3, s * 0.1, s * 0.06, -0.5, 0, 7); c.fill();
  eyes(c, x, y - s * 0.05, s, opt.look || 0, opt.angry);
  mouth(c, x, y + s * 0.2, s, opt.angry);
  if (opt.blush !== false) { c.fillStyle = 'rgba(255,120,150,.45)'; for (const dx of [-1, 1]) { c.beginPath(); c.ellipse(x + dx * s * 0.33, y + s * 0.1, s * 0.07, s * 0.04, 0, 0, 7); c.fill(); } }
}
function mushroom(c, x, y, s, c1, c2) {

  const k = Math.floor(Math.random() * unlocked);
  const p = edgePoint();
  if (r.zone.foes[k][0] === 'bat' && Math.random() < 0.5) {
    for (let i = 0; i < 4; i++) enemies.push(makeFoe(k, p.x + rand(-40, 40), p.y + rand(-40, 40), { speedMul: 1.1 }));
  } else enemies.push(makeFoe(k, p.x, p.y));
}
function spawnRing() {
  const { hw, hh } = viewHalf();
  const R = Math.hypot(hw, hh) + 30;
  const n = 18 + S.run.map * 2;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    enemies.push(makeFoe(i % 2, P.x + Math.cos(a) * R, P.y + Math.sin(a) * R, { speedMul: 0.8 }));
  }
  banner('⚠️ 怪物把你包圍了！', 2);
}
function spawnElite() {
  const p = edgePoint(80);
  enemies.push(makeFoe(0, p.x, p.y, { elite: true }));
  banner('💪 菁英怪出現了！打倒牠有寶箱', 2.2);
}
function spawnBoss() {
  const r = S.run;
  const zi = r.mode === 'stage' ? r.map : (r.map + r.bossCount) % ZONES.length;
  const zb = ZONES[zi].boss;
  const p = edgePoint(120);
  const hp = zb.hp * (r.mode === 'endless' ? 1 + r.bossCount * 0.45 : 1);
  r.boss = { x: p.x, y: p.y, r: 56, hp, maxHp: hp, name: zb.name, img: zb.img, zi, phase: 1, atkT: 2.4, dashT: 6, dash: null, flash: 0, t: 0, alt: 0, bullet: ZONES[zi].bullet };
  r.bossCount++;
  r.bossLog = (r.bossLog || []).concat([{ spawn: Math.round(r.t) }]);
  banner(`👑 ${zb.name}來了！`, 2.6);
  cam.shake = 0.5;
}

/* =========================================================
   更新
   ========================================================= */
function update(dt) {
  const r = S.run;
  r.t += dt;
  if (r.banner) { r.banner.t -= dt; if (r.banner.t <= 0) r.banner = null; }

  // 每撐過 1 分鐘發 1 顆星星
  const minutes = Math.floor(r.t / 60);
  while (r.minutesPaid < minutes) {
    r.minutesPaid++;
    payStars(1, `撐過 ${r.minutesPaid} 分鐘`);
    banner(`⭐ 撐過 ${r.minutesPaid} 分鐘！+1 星星`, 2.2, 'star');
  }

  // 過關後慢慢收尾
  if (r.clearT >= 0) {
    r.clearT += dt;
    for (const g of pickups) if (g.kind === 'gem') g.vac = true;
    if (r.clearT > 2) { stageClear(); return; }
  }

  // 出怪
  const bossAlive = !!r.boss;
  if (r.clearT < 0) {
    const rate = Math.min(r.mode === 'endless' ? 5 : 3.2, 0.9 + r.t * 0.018) * (bossAlive ? 0.3 : 1);
    const maxAlive = bossAlive ? 40 : Math.min(r.mode === 'endless' ? 170 : 110, 30 + r.t * 0.45);
    r.spawnAcc += rate * dt;
    while (r.spawnAcc >= 1) { r.spawnAcc -= 1; if (enemies.length < maxAlive) spawnFoe(); }
    if (r.t >= r.nextElite) { spawnElite(); r.nextElite += r.mode === 'endless' ? 40 : 40; }
    if (r.t >= r.nextRing) { spawnRing(); r.nextRing += r.mode === 'endless' ? 75 : 1e9; }
    if (!bossAlive && !r.bossDone && r.t >= r.nextBoss) spawnBoss();
  }

  // 玩家移動
  const mv = controlVector();
  const sp = speedOf();
  P.x += mv.x * sp * dt; P.y += mv.y * sp * dt;
  if (Math.abs(mv.x) > 0.1) P.face = mv.x > 0 ? 1 : -1;
  if (mv.x || mv.y) { const m = hypot(mv.x, mv.y); P.dirX = mv.x / m; P.dirY = mv.y / m; }
  P.hurtT = Math.max(0, P.hurtT - dt);
  P.inv = Math.max(0, P.inv - dt);
  P.bulletInv = Math.max(0, P.bulletInv - dt);
  if (pv('clover')) { P.hp = Math.min(P.maxHp, P.hp + 0.5 * pv('clover') * dt); }

  updateWeapons(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updateEBullets(dt);
  updatePickups(dt);
  updateFx(dt);

  // 鏡頭
  const { hw, hh } = viewHalf();
  cam.x += (P.x - hw - cam.x) * Math.min(1, dt * 10);
  cam.y += (P.y - hh - cam.y) * Math.min(1, dt * 10);
  cam.shake = Math.max(0, cam.shake - dt);

  if (P.hp <= 0) { P.hp = 0; gameOver(); }
}

function nearestFoes(n, range) {
  const list = [];
  const all = S.run.boss ? enemies.concat([S.run.boss]) : enemies;
  for (const e of all) { const d = hypot(e.x - P.x, e.y - P.y); if (d <= range) list.push({ e, d }); }
  list.sort((a, b) => a.d - b.d);
  return list.slice(0, n).map((o) => o.e);
}
function hurtFoe(e, dmg, kx = 0, ky = 0, crit = false) {
  dmg *= dmgMul();
  e.hp -= dmg; e.flash = 0.1;
  if (e !== S.run.boss) { e.kb.x += kx; e.kb.y += ky; }
  if (floaters.length < 70) floaters.push({ x: e.x + rand(-6, 6), y: e.y - (e.size || 90) * 0.45, text: String(Math.round(dmg)), color: crit ? '#ffd23f' : '#fff', size: crit ? 22 : 16, t: 0.7 });
}

function updateWeapons(dt) {
  const W_ = P.weapons;
  const T = P.timers;
  // 泡泡彈
  if (W_.bubble) {
    const L = WEAPONS.bubble.lv[W_.bubble - 1];
    T.bubble = (T.bubble ?? 0) - dt;
    if (T.bubble <= 0) {
      // 魔王在射程內時一半的泡泡優先打魔王
      const boss = S.run.boss;
      const aimBoss = boss && hypot(boss.x - P.x, boss.y - P.y) < 560 && (T.bubbleAlt = !T.bubbleAlt);
      const target = aimBoss ? boss : nearestFoes(1, 560)[0];
      if (target) {
        const base = Math.atan2(target.y - P.y, target.x - P.x);
        for (let i = 0; i < L.n; i++) {
          const a = base + (i - (L.n - 1) / 2) * 0.17;
          // 射向魔王的泡泡會穿過小怪，只打魔王
          bullets.push({ x: P.x, y: P.y, vx: Math.cos(a) * 470, vy: Math.sin(a) * 470, r: 9 * (L.size || 1), dmg: L.dmg, pierce: L.pierce || 0, ttl: 1.3, rainbow: W_.bubble >= 5, hit: new Set(), bossOnly: !!aimBoss });
        }
        T.bubble = L.cd * cdMul();
      } else T.bubble = 0.1;
    }
  }
  // 火焰環
  if (W_.fire) {
    const L = WEAPONS.fire.lv[W_.fire - 1];
    P.orbitA += dt * 3.2;
    const br = 11 * (L.size || 1);
    // 火焰環也會朝最近的怪丟火球，邊躲邊打也打得到
    T.fireShot = (T.fireShot ?? 0.8) - dt;
    if (T.fireShot <= 0) {
      const target = nearestFoes(1, 460)[0];
      if (target) {
        const base = Math.atan2(target.y - P.y, target.x - P.x), n = Math.ceil(W_.fire / 2);
        for (let i = 0; i < n; i++) { const a = base + (i - (n - 1) / 2) * 0.25; bullets.push({ x: P.x, y: P.y, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, r: 8 * (L.size || 1), dmg: L.dmg * 1.2, pierce: 0, ttl: 1.2, fire: true, hit: new Set() }); }
        T.fireShot = 0.9 * cdMul();
      } else T.fireShot = 0.2;
    }
    for (let i = 0; i < L.n; i++) {
      const a = P.orbitA + (i / L.n) * Math.PI * 2;
      const fx = P.x + Math.cos(a) * L.r, fy = P.y + Math.sin(a) * L.r;
      for (const e of allFoes()) {
        if (e.orbitHit > 0) continue;
        const er = e === S.run.boss ? e.r : e.size * 0.42;
        // 主角到火球整條都算（貼在身邊的怪也燒得到）
        if (segDist(e.x, e.y, P.x, P.y, fx, fy) < br + er) { hurtFoe(e, L.dmg, Math.cos(a) * 60, Math.sin(a) * 60); e.orbitHit = 0.4; }
      }
    }
  }
  // 落雷
  if (W_.thunder) {
    const L = WEAPONS.thunder.lv[W_.thunder - 1];
    T.thunder = (T.thunder ?? 0.6) - dt;
    if (T.thunder <= 0) {
      const { hw, hh } = viewHalf();
      let cand = nearestFoes(40, Math.hypot(hw, hh)).filter((e) => e !== S.run.boss).sort(() => Math.random() - 0.5);
      // 魔王在畫面上時第一道雷一定打魔王
      if (S.run.boss && hypot(S.run.boss.x - P.x, S.run.boss.y - P.y) < Math.hypot(hw, hh)) cand.unshift(S.run.boss);
      cand = cand.slice(0, L.n);
      for (const e of cand) {
        hurtFoe(e, L.dmg, 0, 0, true);
        strikes.push({ x: e.x, y: e.y, t: 0.25 });
        if (L.chain) for (const o of nearestFoesFrom(e, 2, 140)) { hurtFoe(o, L.dmg * 0.6); strikes.push({ x: o.x, y: o.y, t: 0.2, from: { x: e.x, y: e.y } }); }
      }
      T.thunder = cand.length ? L.cd * cdMul() : 0.3;
    }
  }
  // 迴旋葉
  if (W_.leaf) {
    const L = WEAPONS.leaf.lv[W_.leaf - 1];
    T.leaf = (T.leaf ?? 0.3) - dt;
    if (T.leaf <= 0) {
      const target = S.run.boss && hypot(S.run.boss.x - P.x, S.run.boss.y - P.y) < 420 ? S.run.boss : nearestFoes(1, 400)[0];
      const base = target ? Math.atan2(target.y - P.y, target.x - P.x) : Math.atan2(P.dirY, P.dirX);
      for (let i = 0; i < L.n; i++) {
        const a = base + (i - (L.n - 1) / 2) * 0.6;
        leaves.push({ x: P.x, y: P.y, a, d: 0, out: true, dmg: L.dmg, r: 14 * (L.size || 1), spin: 0, ttl: 3 });
      }
      T.leaf = L.cd * cdMul();
    }
    for (let i = leaves.length - 1; i >= 0; i--) {
      const lf = leaves[i];
      lf.spin += dt * 14; lf.ttl -= dt;
      if (lf.out) { lf.d += 380 * dt; lf.x = P.x + Math.cos(lf.a) * lf.d; lf.y = P.y + Math.sin(lf.a) * lf.d; if (lf.d >= 240) lf.out = false; }
      else { const dx = P.x - lf.x, dy = P.y - lf.y, d = hypot(dx, dy) || 1; lf.x += (dx / d) * 430 * dt; lf.y += (dy / d) * 430 * dt; if (d < 20 || lf.ttl <= 0) { leaves.splice(i, 1); continue; } }
      for (const e of allFoes()) {
        if (e.leafHit > 0) continue;
        const er = e === S.run.boss ? e.r : e.size * 0.42;
        if (hypot(e.x - lf.x, e.y - lf.y) < lf.r + er) { hurtFoe(e, lf.dmg); e.leafHit = 0.3; }
      }
    }
  } else leaves.length = 0;
  // 冰霜光環
  if (W_.frost) {
    const L = WEAPONS.frost.lv[W_.frost - 1];
    P.frostTick -= dt;
    const tick = P.frostTick <= 0;
    if (tick) P.frostTick = 0.5;
    for (const e of allFoes()) {
      const er = e === S.run.boss ? e.r : e.size * 0.4;
      if (hypot(e.x - P.x, e.y - P.y) < L.r + er) { e.slow = W_.frost >= 5 ? 0.5 : 0.35; if (tick) hurtFoe(e, L.dmg); }
    }
  }
  // 子彈
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.ttl -= dt;
    if (b.ttl <= 0) { bullets.splice(i, 1); continue; }
    for (const e of b.bossOnly ? (S.run.boss ? [S.run.boss] : []) : allFoes()) {
      if (b.hit.has(e)) continue;
      const er = e === S.run.boss ? e.r : e.size * 0.42;
      if (hypot(e.x - b.x, e.y - b.y) < b.r + er) {
        const crit = Math.random() < 0.08;
        hurtFoe(e, b.dmg * (crit ? 1.8 : 1), b.vx * 0.06, b.vy * 0.06, crit);
        b.hit.add(e);
        burst(b.x, b.y, b.rainbow ? '#ffb3e6' : '#bff3ff', 4);
        if (b.pierce-- <= 0) { bullets.splice(i, 1); break; }
      }
    }
  }
}
function allFoes() { return S.run.boss ? enemies.concat([S.run.boss]) : enemies; }
function nearestFoesFrom(src, n, range) {
  const out = [];
  for (const e of enemies) { if (e === src) continue; const d = hypot(e.x - src.x, e.y - src.y); if (d < range) out.push({ e, d }); }
  return out.sort((a, b) => a.d - b.d).slice(0, n).map((o) => o.e);
}

function updateEnemies(dt) {
  for (const e of enemies) {
    const dx = P.x - e.x, dy = P.y - e.y, d = hypot(dx, dy) || 1;
    const slow = e.slow > 0 ? 1 - e.slow : 1;
    e.slow = 0;
    e.wob += dt * 6;
    const sp = e.speed * slow;
    e.x += (dx / d) * sp * dt + e.kb.x * dt * 6;
    e.y += (dy / d) * sp * dt + e.kb.y * dt * 6;
    e.kb.x *= 0.85; e.kb.y *= 0.85;
    e.hitCd -= dt; e.flash -= dt; e.orbitHit -= dt; e.leafHit -= dt;
    if (d < P.r + e.size * 0.36 && P.inv <= 0) hurtPlayer(e.dmg);
    // 太遠的怪移到畫面另一邊（不讓怪物落在後面）
    if (d > 1400) { const p = edgePoint(); e.x = p.x; e.y = p.y; }
  }
  // 簡單推開，避免疊成一團
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    for (let j = i + 1; j < Math.min(enemies.length, i + 12); j++) {
      const b = enemies[j]; const dx = b.x - a.x, dy = b.y - a.y, d = hypot(dx, dy), min = (a.size + b.size) * 0.32;
      if (d > 0 && d < min) { const push = (min - d) * 0.5; a.x -= (dx / d) * push; a.y -= (dy / d) * push; b.x += (dx / d) * push; b.y += (dy / d) * push; }
    }
  }
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hp > 0) continue;
    enemies.splice(i, 1);
    S.run.kills++;
    burst(e.x, e.y, e.c1, e.elite ? 24 : 8);
    if (e.elite) {
      pickups.push({ x: e.x, y: e.y, kind: 'chest' });
      for (let k = 0; k < 4; k++) pickups.push({ x: e.x + rand(-30, 30), y: e.y + rand(-30, 30), kind: 'gem', v: 5 });
    } else {
      pickups.push({ x: e.x, y: e.y, kind: 'gem', v: e.exp });
      const roll = Math.random();
      if (roll < 0.012) pickups.push({ x: e.x + 10, y: e.y, kind: 'chicken' });
      else if (roll < 0.018) pickups.push({ x: e.x + 10, y: e.y, kind: 'magnet' });
      else if (roll < 0.022) pickups.push({ x: e.x + 10, y: e.y, kind: 'bomb' });
    }
  }
  // 寶石太多時合併，避免畫面卡
  const gems = pickups.filter((p) => p.kind === 'gem');
  if (gems.length > 260) { const far = gems.sort((a, b) => hypot(b.x - P.x, b.y - P.y) - hypot(a.x - P.x, a.y - P.y)).slice(0, 60); let v = 0; for (const g of far) { v += g.v; pickups.splice(pickups.indexOf(g), 1); } pickups.push({ x: P.x + rand(-200, 200), y: P.y + rand(-200, 200), kind: 'gem', v }); }
}

function hurtPlayer(dmg) {
  if (S.god) return;
  // 被打到後 0.5 秒無敵：被包圍時也不會一下子被扣光
  P.hp -= dmg; P.hurtT = 0.25; P.inv = 0.5; cam.shake = Math.max(cam.shake, 0.18);
  burst(P.x, P.y, '#ff6b81', 6);
}

function updateBoss(dt) {
  const r = S.run, b = r.boss;
  if (!b) return;
  b.t += dt; b.flash -= dt; b.orbitHit -= dt; b.leafHit -= dt;
  const slow = b.slow > 0 ? 1 - b.slow * 0.5 : 1; b.slow = 0;
  if (b.phase === 1 && b.hp < b.maxHp * 0.5) {
    b.phase = 2; ebullets.length = 0; banner(`😡 ${b.name}生氣了！小心衝撞`, 2.4); cam.shake = 0.4;
  }
  const dx = P.x - b.x, dy = P.y - b.y, d = hypot(dx, dy) || 1;
  if (b.dash) {
    b.dash.t -= dt;
    if (b.dash.t > 0.6) { /* 預告中，站著不動 */ }
    else { b.x += b.dash.vx * dt; b.y += b.dash.vy * dt; }
    if (b.dash.t <= 0) b.dash = null;
  } else {
    const sp = (b.phase === 2 ? 76 : 62) * slow;
    b.x += (dx / d) * sp * dt; b.y += (dy / d) * sp * dt;
    b.atkT -= dt;
    if (b.atkT <= 0) {
      const z = b.zi, spd = 112 + z * 8;
      if (b.phase === 2 && b.alt++ % 2) {
        const a0 = Math.atan2(dy, dx);
        for (let i = -2; i <= 2; i++) ebullets.push({ x: b.x, y: b.y, vx: Math.cos(a0 + i * 0.22) * (spd + 40), vy: Math.sin(a0 + i * 0.22) * (spd + 40), r: 8, ttl: 6, col: b.bullet });
      } else {
        const n = 10 + Math.floor(z * 1.5) + (b.phase === 2 ? 6 : 0), off = Math.random() * 6;
        for (let i = 0; i < n; i++) { const a = off + (i / n) * Math.PI * 2; ebullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 8, ttl: 6, col: b.bullet }); }
      }
      b.atkT = b.phase === 2 ? 2.1 : 2.9;
    }
    if (b.phase === 2) {
      b.dashT -= dt;
      if (b.dashT <= 0) { const a = Math.atan2(dy, dx); b.dash = { t: 1.25, vx: Math.cos(a) * 430, vy: Math.sin(a) * 430, a }; b.dashT = 6; }
    }
  }
  if (d < P.r + b.r * 0.8 && P.inv <= 0) hurtPlayer(14 + b.zi * 2);
  if (d > 1300) { const p = edgePoint(120); b.x = p.x; b.y = p.y; }
  if (b.hp <= 0) bossDefeated();
}
function bossDefeated() {
  const r = S.run, b = r.boss;
  r.boss = null; ebullets.length = 0;
  if (r.bossLog) r.bossLog[r.bossLog.length - 1].dead = Math.round(r.t);
  burst(b.x, b.y, '#ffd23f', 40); burst(b.x, b.y, '#ff8ab8', 30); cam.shake = 0.6;
  const stars = r.mode === 'stage' ? ZONES[b.zi].boss.stars : 3;
  payStars(stars, `打倒${b.name}`);
  banner(`🎉 打倒${b.name}！+${stars} 星星`, 3, 'star');
  for (let k = 0; k < 10; k++) pickups.push({ x: b.x + rand(-60, 60), y: b.y + rand(-60, 60), kind: 'gem', v: 6 });
  if (r.mode === 'stage') { r.bossDone = true; r.clearT = 0; for (const e of enemies) { burst(e.x, e.y, e.c1, 4); } enemies.length = 0; }
  else { pickups.push({ x: b.x, y: b.y, kind: 'chest' }); r.nextBoss = r.t + ENDLESS_BOSS_GAP; }
}
function updateEBullets(dt) {
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.ttl -= dt;
    if (b.ttl <= 0) { ebullets.splice(i, 1); continue; }
    if (P.bulletInv <= 0 && hypot(b.x - P.x, b.y - P.y) < b.r + P.r * 0.7) { hurtPlayer(9 + S.run.map); P.bulletInv = 0.7; ebullets.splice(i, 1); }
  }
}
function updatePickups(dt) {
  const mag = magnetOf();
  for (let i = pickups.length - 1; i >= 0; i--) {
    const g = pickups[i];
    const dx = P.x - g.x, dy = P.y - g.y, d = hypot(dx, dy) || 1;
    const pullR = g.kind === 'gem' ? mag : 40;
    // 畫面內的寶石會慢慢飄向玩家，小朋友不用一顆顆去撿
    if (g.kind === 'gem' && !g.vac && d >= pullR && d < 520) { g.x += (dx / d) * 55 * dt; g.y += (dy / d) * 55 * dt; }
    if (g.vac || d < pullR) { const sp = (g.vac ? 700 : 560) * (1 - Math.min(0.6, d / 2000)); g.x += (dx / d) * sp * dt; g.y += (dy / d) * sp * dt; }
    if (d < P.r + 10) {
      pickups.splice(i, 1);
      if (g.kind === 'gem') gainExp(g.v);
      else if (g.kind === 'chicken') { P.hp = Math.min(P.maxHp, P.hp + 30); floatText(P.x, P.y - 30, '+30 ❤', '#ff5d7a'); }
      else if (g.kind === 'magnet') { for (const o of pickups) if (o.kind === 'gem') o.vac = true; banner('🧲 寶石全部吸過來！', 1.5); }
      else if (g.kind === 'bomb') { for (const e of enemies) if (!e.elite) { e.hp = 0; } cam.shake = 0.4; banner('💣 轟！', 1.2); }
      else if (g.kind === 'chest') { S.run.pendingLevels++; S.run.chest = true; }
    }
  }
}
function gainExp(v) {
  P.exp += v;
  while (P.exp >= P.need) { P.exp -= P.need; P.level++; P.need = expNeed(P.level); S.run.pendingLevels++; }
}
function floatText(x, y, text, color) { floaters.push({ x, y, text, color, size: 18, t: 1 }); }
function burst(x, y, color, n) {
  for (let i = 0; i < n && particles.length < 320; i++) { const a = Math.random() * 6.28, s = rand(60, 220); particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: rand(0.3, 0.6), max: 0.6, color, r: rand(2, 5) }); }
}
function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.t -= dt; if (p.t <= 0) particles.splice(i, 1); }
  for (let i = floaters.length - 1; i >= 0; i--) { const f = floaters[i]; f.y -= 40 * dt; f.t -= dt; if (f.t <= 0) floaters.splice(i, 1); }
  for (let i = strikes.length - 1; i >= 0; i--) { strikes[i].t -= dt; if (strikes[i].t <= 0) strikes.splice(i, 1); }
}
function banner(text, t = 2, kind = '') { if (S.run) S.run.banner = { text, t, max: t, kind }; }

/* =========================================================
   升級選卡
   ========================================================= */
function upgradeOptions() {
  const opts = [];
  const wOwned = Object.keys(P.weapons), pOwned = Object.keys(P.passives);
  for (const k of wOwned) if (P.weapons[k] < MAX_LV) opts.push({ type: 'w', k, w: 1.4 });
  for (const k of pOwned) if (P.passives[k] < MAX_LV) opts.push({ type: 'p', k, w: 1.1 });
  if (wOwned.length < WEAPON_SLOTS) for (const k of Object.keys(WEAPONS)) if (!P.weapons[k]) opts.push({ type: 'w', k, w: 1.2 });
  if (pOwned.length < PASSIVE_SLOTS) for (const k of Object.keys(PASSIVES)) if (!P.passives[k]) opts.push({ type: 'p', k, w: 1 });
  const out = [];
  while (out.length < 3 && opts.length) {
    const total = opts.reduce((s, o) => s + o.w, 0);
    let x = Math.random() * total, idx = 0;
    while (x > opts[idx].w) { x -= opts[idx].w; idx++; }
    out.push(opts.splice(idx, 1)[0]);
  }
  if (!out.length) out.push({ type: 'heal', k: 'heal' });
  return out;
}
function applyUpgrade(o) {
  if (o.type === 'w') P.weapons[o.k] = (P.weapons[o.k] || 0) + 1;
  else if (o.type === 'p') {
    P.passives[o.k] = (P.passives[o.k] || 0) + 1;
    if (o.k === 'heart') { P.maxHp += 20; P.hp = Math.min(P.maxHp, P.hp + 20); }
  } else { P.hp = Math.min(P.maxHp, P.hp + 40); }
}
let luOptions = [];
function openLevelUp() {
  const r = S.run;
  r.pendingLevels--;
  const chest = r.chest; r.chest = false;
  S.mode = 'levelup';
  luOptions = upgradeOptions();
  document.getElementById('luTitle').textContent = chest ? '🎁 寶箱！' : `⬆️ 升級！Lv.${P.level}`;
  document.getElementById('luSub').textContent = '選一個強化（鍵盤可按 1、2、3）';
  const box = document.getElementById('luCards');
  box.innerHTML = '';
  luOptions.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'card';
    b.dataset.testid = 'upgrade';
    let icon, name, tag, desc;
    if (o.type === 'w') {
      const def = WEAPONS[o.k], cur = P.weapons[o.k] || 0, next = cur + 1;
      icon = def.icon; name = next >= MAX_LV ? def.evo : def.name;
      tag = cur === 0 ? '<span class="new">新武器</span>' : next >= MAX_LV ? '<span class="evo">進化</span>' : `<span class="lv">Lv.${cur} → ${next}</span>`;
      desc = def.desc[next - 1];
    } else if (o.type === 'p') {
      const def = PASSIVES[o.k], cur = P.passives[o.k] || 0;
      icon = def.icon; name = def.name; tag = cur === 0 ? '<span class="new">新道具</span>' : `<span class="lv">Lv.${cur} → ${cur + 1}</span>`; desc = def.desc;
    } else { icon = '🍗'; name = '大雞腿'; tag = ''; desc = '回復 40 生命'; }
    b.innerHTML = `<span class="ci">${icon}</span><span><b>${name}</b>${tag}<small>${desc}</small></span>`;
    b.addEventListener('click', () => chooseUpgrade(i));
    box.appendChild(b);
  });
  show('levelup');
}
function chooseUpgrade(i) {
  if (S.mode !== 'levelup' || !luOptions[i]) return;
  applyUpgrade(luOptions[i]);
  luOptions = [];
  hide('levelup');
  S.mode = 'play';
}

/* =========================================================
   過關、結束
   ========================================================= */
function finishRun() {
  document.body.classList.remove('playing');
  hide('pauseBtn'); hide('levelup'); hide('pause');
  resetInputs();
}
function stageClear() {
  const r = S.run;
  S.mode = 'clear';
  finishRun();
  const ratio = P.hp / P.maxHp;
  const rating = ratio >= 0.6 ? 3 : ratio >= 0.3 ? 2 : 1;
  const prev = save.best[r.map] || 0;
  save.best[r.map] = Math.max(prev, rating);
  const unlockedNew = r.map + 2 > save.unlocked && r.map + 1 < ZONES.length;
  save.unlocked = Math.max(save.unlocked, Math.min(ZONES.length, r.map + 2));
  if (r.map + 1 < ZONES.length) save.map = r.map + 1;
  persist();
  const hasNext = r.map + 1 < ZONES.length;
  showResult(`
    <h2>🎉 過關！</h2>
    <p>${r.zone.icon} ${r.zone.name}</p>
    <div class="bigstars">${'★'.repeat(rating)}${'☆'.repeat(3 - rating)}</div>
    <p>剩下生命 ${Math.ceil(P.hp)} / ${P.maxHp}（生命越多星星越多）</p>
    <p>擊倒 ${r.kills} 隻 ・ 等級 ${P.level}</p>
    <span class="earn">這一關拿到 ⭐ ${r.starsPaid} 顆星星</span>
    ${unlockedNew ? `<p style="color:#c47f00">🔓 新地圖「${ZONES[r.map + 1].name}」開放了！</p>` : ''}
    <div class="btns">
      <button class="btn sub" data-act="menu">回選單</button>
      <button class="btn sub" data-act="retry">再玩一次</button>
      ${hasNext ? '<button class="btn" data-act="next">下一關 ▶</button>' : ''}
    </div>`);
}
function gameOver() {
  const r = S.run;
  S.mode = 'over';
  finishRun();
  let extra = '';
  if (r.mode === 'endless') {
    const prev = save.endlessBest[r.map] || 0;
    if (r.t > prev) { save.endlessBest[r.map] = Math.floor(r.t); persist(); extra = '<p style="color:#c47f00">🏆 新紀錄！</p>'; }
    else extra = `<p>最佳紀錄 ${fmt(prev)}</p>`;
  }
  showResult(`
    <h2>${r.mode === 'endless' ? '♾️ 無盡挑戰結束' : '💫 差一點點！'}</h2>
    <p>${r.zone.icon} ${r.zone.name} ・ 撐了 ${fmt(r.t)}</p>
    ${extra}
    <p>擊倒 ${r.kills} 隻 ・ 等級 ${P.level}</p>
    <span class="earn">這次拿到 ⭐ ${r.starsPaid} 顆星星</span>
    ${r.mode === 'stage' ? '<p>升級時多選「大愛心」「幸運草」會更耐打喔！</p>' : ''}
    <div class="btns">
      <button class="btn sub" data-act="menu">回選單</button>
      <button class="btn" data-act="retry">再試一次</button>
    </div>`);
}
function showResult(html) {
  const box = document.getElementById('resultBody');
  box.innerHTML = html;
  box.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
    const act = b.dataset.act, r = S.run;
    hide('result');
    if (act === 'menu') openMenu();
    else if (act === 'retry') startRun(r.map, P.pal, r.mode);
    else if (act === 'next') startRun(r.map + 1, P.pal, 'stage');
  }));
  show('result');
}

/* =========================================================
   選單
   ========================================================= */
let menuSel = { mode: save.mode === 'endless' ? 'endless' : 'stage', map: Math.min(save.map || 0, save.unlocked - 1), pal: PALS[save.pal] ? save.pal : 'slime' };
function openMenu() {
  S.mode = 'menu';
  document.body.classList.remove('playing');
  hide('pauseBtn');
  renderMenu();
  show('menu');
}
function renderMenu() {
  const m = menuSel;
  const maps = ZONES.map((z, i) => {
    const lock = i >= save.unlocked;
    const best = save.best[i] || 0;
    const sub = lock ? '過前一關解鎖' : m.mode === 'endless' ? (save.endlessBest[i] ? `最佳 ${fmt(save.endlessBest[i])}` : '還沒挑戰') : best ? `最佳 ${'★'.repeat(best)}` : '還沒過關';
    return `<button class="map ${m.map === i ? 'on' : ''} ${lock ? 'lock' : ''}" data-map="${i}" style="background:linear-gradient(160deg, ${z.card[0]}, ${z.card[1]})">
      ${best && m.mode === 'stage' ? `<span class="stars">${'★'.repeat(best)}${'☆'.repeat(3 - best)}</span>` : ''}
      <span class="ic">${lock ? '🔒' : z.icon}</span><span>${i + 1}. ${z.name}</span><small>${sub}</small></button>`;
  }).join('');
  const pals = Object.entries(PALS).map(([id, p]) => `
    <button class="pal ${m.pal === id ? 'on' : ''}" data-pal="${id}"><canvas width="144" height="144" data-draw="${id}"></canvas>
      <span><b>${p.name}</b><p>${p.desc}</p><span class="tag">${p.tag}</span></span></button>`).join('');
  document.getElementById('menuBody').innerHTML = `
    <h1><small>MONSTER SURVIVORS</small>怪獸生存戰</h1>
    <div class="modes">
      <button class="mode ${m.mode === 'stage' ? 'on' : ''}" data-mode="stage">🗺️ 關卡模式<small>撐 2 分鐘・打倒魔王過關</small></button>
      <button class="mode ${m.mode === 'endless' ? 'on' : ''}" data-mode="endless">♾️ 無盡模式<small>越撐越強，挑戰最久紀錄</small></button>
    </div>
    <div class="sec"><h2>選擇地圖</h2><div class="maps">${maps}</div></div>
    <div class="sec"><h2>選擇夥伴</h2><div class="pals">${pals}</div></div>
    <button class="go" id="goBtn" data-testid="go">⚔️ 出發！</button>
    <p class="note">每撐過 1 分鐘 +1 ⭐・打倒魔王 +3～5 ⭐<br>${isTouch() ? '用搖桿或在畫面上拖曳移動，攻擊是自動的' : '用 WASD 或方向鍵移動，攻擊是自動的・P 暫停'}</p>`;
  const body = document.getElementById('menuBody');
  body.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => { menuSel.mode = b.dataset.mode; renderMenu(); }));
  body.querySelectorAll('[data-map]').forEach((b) => b.addEventListener('click', () => { const i = Number(b.dataset.map); if (i < save.unlocked) { menuSel.map = i; renderMenu(); } }));
  body.querySelectorAll('[data-pal]').forEach((b) => b.addEventListener('click', () => { menuSel.pal = b.dataset.pal; renderMenu(); }));
  body.querySelectorAll('canvas[data-draw]').forEach((c) => { const x = c.getContext('2d'); drawPal(x, c.dataset.draw, 72, 66, 96); });
  document.getElementById('goBtn').addEventListener('click', () => startRun(menuSel.map, menuSel.pal, menuSel.mode));
}

/* =========================================================
   繪圖
   ========================================================= */
function draw(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!S.run) { ctx.fillStyle = '#bfe6f7'; ctx.fillRect(0, 0, W, H); return; }
  const r = S.run;
  const sx = cam.shake > 0 ? rand(-6, 6) * cam.shake : 0, sy = cam.shake > 0 ? rand(-6, 6) * cam.shake : 0;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(Z, Z);
  ctx.translate(-cam.x, -cam.y);
  const vw = W / Z, vh = H / Z;
  // 地面
  const tile = groundTile(r.map);
  const tx0 = Math.floor(cam.x / TILE) * TILE, ty0 = Math.floor(cam.y / TILE) * TILE;
  for (let x = tx0; x < cam.x + vw + 1; x += TILE) for (let y = ty0; y < cam.y + vh + 1; y += TILE) ctx.drawImage(tile, x, y, TILE + 1, TILE + 1);
  // 裝飾
  const ci0 = Math.floor((cam.x - 120) / PROP_CELL), ci1 = Math.floor((cam.x + vw + 120) / PROP_CELL);
  const cj0 = Math.floor((cam.y - 120) / PROP_CELL), cj1 = Math.floor((cam.y + vh + 160) / PROP_CELL);
  for (let i = ci0; i <= ci1; i++) for (let j = cj0; j <= cj1; j++) {
    const h = hash2(i, j);
    if (h > 0.55) continue;
    const kind = r.zone.props[Math.floor(hash2(j, i) * r.zone.props.length)];
    const big = kind === 'tree' || kind === 'pine' || kind === 'pillar' || kind === 'crystal';
    drawProp(ctx, kind, i * PROP_CELL + hash2(i + 7, j) * PROP_CELL, j * PROP_CELL + hash2(i, j + 9) * PROP_CELL, (big ? 80 : 46) + h * (big ? 60 : 30));
  }
  // 冰霜光環
  if (P.weapons.frost) {
    const L = WEAPONS.frost.lv[P.weapons.frost - 1];
    ctx.fillStyle = `rgba(160,225,255,${0.16 + Math.sin(now * 0.004) * 0.04})`; ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P.x, P.y, L.r, 0, 7); ctx.fill(); ctx.stroke();
  }
  // 地上物品
  for (const g of pickups) {
    if (g.x < cam.x - 40 || g.x > cam.x + vw + 40 || g.y < cam.y - 40 || g.y > cam.y + vh + 40) continue;
    if (g.kind === 'gem') gemShape(ctx, g.x, g.y, g.v >= 10 ? 11 : g.v >= 3 ? 8.5 : 7, g.v >= 10 ? '#b388ff' : g.v >= 3 ? '#62e08a' : '#4fd2ff');
    else drawPickup(g, now);
  }
  // 魔王衝撞預告
  const b = r.boss;
  if (b && b.dash && b.dash.t > 0.6) {
    ctx.strokeStyle = `rgba(255,60,90,${0.35 + Math.sin(now * 0.03) * 0.25})`; ctx.lineWidth = b.r * 1.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + Math.cos(b.dash.a) * 520, b.y + Math.sin(b.dash.a) * 520); ctx.stroke();
  }
  // 敵人
  const frame = Math.floor(now / 160) % 2;
  for (const e of enemies) {
    if (e.x < cam.x - 80 || e.x > cam.x + vw + 80 || e.y < cam.y - 80 || e.y > cam.y + vh + 80) continue;
    const sp = foeSprite(e, e.shape === 'bat' ? frame : 0);
    const bob = e.shape === 'ghost' ? Math.sin(e.wob) * 3 : e.shape === 'blob' ? Math.abs(Math.sin(e.wob)) * -2 : 0;
    if (e.elite) { ctx.fillStyle = `rgba(255,210,80,${0.22 + Math.sin(now * 0.006) * 0.08})`; ctx.beginPath(); ctx.arc(e.x, e.y, e.size * 0.62, 0, 7); ctx.fill(); }
    const w = sp.width / 2;
    ctx.drawImage(sp, e.x - w / 2, e.y - w / 2 + bob, w, w);
    if (e.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(e.x, e.y + bob, e.size * 0.4, 0, 7); ctx.fill(); }
    if (e.elite || e.hp < e.maxHp) {
      const hw = e.size * 0.7;
      ctx.fillStyle = 'rgba(30,20,50,.55)'; ctx.fillRect(e.x - hw / 2, e.y - e.size * 0.62, hw, 4);
      ctx.fillStyle = e.elite ? '#ffb020' : '#5fdc7a'; ctx.fillRect(e.x - hw / 2, e.y - e.size * 0.62, hw * clamp(e.hp / e.maxHp, 0, 1), 4);
    }
  }
  // 魔王
  if (b) {
    shadow(ctx, b.x, b.y + b.r * 0.9, b.r * 0.9, b.r * 0.22);
    if (b.phase === 2) { ctx.fillStyle = `rgba(255,70,90,${0.18 + Math.sin(now * 0.01) * 0.08})`; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.15, 0, 7); ctx.fill(); }
    const im = bossImgs[b.img], sz = b.r * 2.5;
    if (im && im.complete && im.naturalWidth) ctx.drawImage(im, b.x - sz / 2, b.y - sz / 2 - Math.abs(Math.sin(b.t * 3)) * 6, sz, sz);
    else blob(ctx, b.x, b.y, b.r * 2, '#ffb35c', '#e0482e', { angry: true });
    if (b.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); }
  }
  // 玩家
  drawPlayer(now);
  // 火焰環
  if (P.weapons.fire) {
    const L = WEAPONS.fire.lv[P.weapons.fire - 1], br = 11 * (L.size || 1);
    for (let i = 0; i < L.n; i++) {
      const a = P.orbitA + (i / L.n) * Math.PI * 2, x = P.x + Math.cos(a) * L.r, y = P.y + Math.sin(a) * L.r;
      ctx.strokeStyle = 'rgba(255,150,60,.35)'; ctx.lineWidth = br * 1.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(P.x + Math.cos(a) * 20, P.y + Math.sin(a) * 20); ctx.lineTo(x, y); ctx.stroke();
      const g = ctx.createRadialGradient(x, y, 1, x, y, br * 1.6);
      g.addColorStop(0, '#fff6b0'); g.addColorStop(0.45, P.weapons.fire >= 5 ? '#ffd23f' : '#ff9a3c'); g.addColorStop(1, 'rgba(255,90,40,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, br * 1.6, 0, 7); ctx.fill();
    }
  }
  // 迴旋葉
  for (const lf of leaves) {
    ctx.save(); ctx.translate(lf.x, lf.y); ctx.rotate(lf.spin);
    ctx.fillStyle = P.weapons.leaf >= 5 ? '#7ee8b5' : '#5fc45a'; ctx.strokeStyle = '#2f7f3a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, lf.r, lf.r * 0.5, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-lf.r, 0); ctx.lineTo(lf.r, 0); ctx.stroke();
    ctx.restore();
  }
  // 泡泡彈
  for (const bl of bullets) {
    const g = ctx.createRadialGradient(bl.x - bl.r * 0.3, bl.y - bl.r * 0.3, 1, bl.x, bl.y, bl.r);
    if (bl.fire) { g.addColorStop(0, '#fff6b0'); g.addColorStop(0.5, '#ffb347'); g.addColorStop(1, '#ff5a1f'); }
    else if (bl.rainbow) { g.addColorStop(0, '#fff'); g.addColorStop(0.5, `hsl(${(now * 0.3) % 360},90%,80%)`); g.addColorStop(1, `hsl(${(now * 0.3 + 120) % 360},85%,62%)`); }
    else { g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#bff3ff'); g.addColorStop(1, '#4fc3f7'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  // 魔王子彈（紅紫色＋深色外框，和寶石、泡泡都不像）
  for (const e of ebullets) {
    ctx.fillStyle = 'rgba(40,10,30,.85)'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 2.5, 0, 7); ctx.fill();
    ctx.fillStyle = `rgb(${e.col})`; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.38, 0, 7); ctx.fill();
  }
  // 雷
  for (const s of strikes) {
    const a = s.t / 0.25;
    ctx.strokeStyle = `rgba(255,236,120,${a})`; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    if (s.from) { ctx.moveTo(s.from.x, s.from.y); ctx.lineTo(s.x, s.y); }
    else { let x = s.x + rand(-10, 10), y = s.y - 260; ctx.moveTo(x, y); for (let k = 0; k < 6; k++) { x = s.x + rand(-16, 16); y += 260 / 6; ctx.lineTo(x, y); } }
    ctx.stroke();
    ctx.fillStyle = `rgba(255,250,200,${a * 0.6})`; ctx.beginPath(); ctx.arc(s.x, s.y, 26, 0, 7); ctx.fill();
  }
  // 粒子
  for (const p of particles) { ctx.globalAlpha = clamp(p.t / p.max, 0, 1); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  // 傷害數字
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.t * 2, 0, 1);
    ctx.font = `900 ${f.size}px system-ui, sans-serif`; ctx.lineWidth = 4; ctx.strokeStyle = '#2b1a3a';
    ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // 受傷紅框
  if (P.hurtT > 0) { ctx.fillStyle = `rgba(255,60,80,${P.hurtT * 0.6})`; ctx.fillRect(0, 0, W, 6); ctx.fillRect(0, H - 6, W, 6); ctx.fillRect(0, 0, 6, H); ctx.fillRect(W - 6, 0, 6, H); }
  drawHud(now);
}
function drawPickup(g, now) {
  const bob = Math.sin(now * 0.005 + g.x) * 3;
  const x = g.x, y = g.y + bob;
  if (g.kind === 'chicken') {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.6);
    ctx.fillStyle = '#fff4dc'; ctx.fillRect(-3, 6, 6, 14); ctx.beginPath(); ctx.arc(-4, 21, 4, 0, 7); ctx.arc(4, 21, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#c9762c'; ctx.beginPath(); ctx.ellipse(0, -2, 12, 14, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-4, -7, 4, 3, 0, 0, 7); ctx.fill(); ctx.restore();
  } else if (g.kind === 'chest') {
    shadow(ctx, x, y + 16, 22, 6);
    ctx.fillStyle = '#b5652c'; ctx.beginPath(); ctx.roundRect(x - 20, y - 6, 40, 22, 4); ctx.fill();
    ctx.fillStyle = '#d98a3d'; ctx.beginPath(); ctx.roundRect(x - 20, y - 18, 40, 14, [10, 10, 2, 2]); ctx.fill();
    ctx.fillStyle = '#ffd34d'; ctx.fillRect(x - 20, y - 6, 40, 4); ctx.fillRect(x - 4, y - 10, 8, 12);
    ctx.strokeStyle = `rgba(255,240,150,${0.5 + Math.sin(now * 0.01) * 0.4})`; ctx.lineWidth = 2;
    for (let a = 0; a < 8; a++) { ctx.beginPath(); ctx.moveTo(x + Math.cos(a * 0.8) * 28, y - 4 + Math.sin(a * 0.8) * 28); ctx.lineTo(x + Math.cos(a * 0.8) * 36, y - 4 + Math.sin(a * 0.8) * 36); ctx.stroke(); }
  } else if (g.kind === 'magnet') {
    ctx.strokeStyle = '#e63946'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(x, y, 11, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#e8eef5'; ctx.fillRect(x - 14.5, y - 1, 7, 8); ctx.fillRect(x + 7.5, y - 1, 7, 8);
  } else if (g.kind === 'bomb') {
    ctx.fillStyle = '#3b3550'; ctx.beginPath(); ctx.arc(x, y + 2, 12, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(x - 4, y - 2, 3.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#a07040'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 6, y - 8); ctx.quadraticCurveTo(x + 12, y - 16, x + 8, y - 20); ctx.stroke();
    ctx.fillStyle = Math.floor(now / 120) % 2 ? '#ffd23f' : '#ff7a3c'; ctx.beginPath(); ctx.arc(x + 8, y - 21, 3.5, 0, 7); ctx.fill();
  }
}
function drawPlayer(now) {
  const blink = P.hurtT > 0 && Math.floor(now / 60) % 2;
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(P.x, P.y + 24, 30, 9, 0, 0, 7); ctx.fill();
  ctx.save();
  if (blink) ctx.globalAlpha = 0.5;
  ctx.translate(P.x, P.y); ctx.scale(P.face, 1);
  drawPal(ctx, P.pal, 0, 0, 52, now / 1000);
  ctx.restore();
  ctx.fillStyle = 'rgba(30,20,50,.6)'; ctx.beginPath(); ctx.roundRect(P.x - 24, P.y + 34, 48, 7, 4); ctx.fill();
  ctx.fillStyle = '#ff5d7a'; ctx.beginPath(); ctx.roundRect(P.x - 23, P.y + 35, 46 * clamp(P.hp / P.maxHp, 0, 1), 5, 3); ctx.fill();
}
function hudCard(x, y, w, h) { ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.fill(); ctx.stroke(); }
function bar(x, y, w, h, ratio, bg, fg) { ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill(); if (ratio > 0) { ctx.fillStyle = fg; ctx.beginPath(); ctx.roundRect(x, y, Math.max(h, w * clamp(ratio, 0, 1)), h, h / 2); ctx.fill(); } }
function drawSlots(x, y, size) {
  const items = Object.entries(P.weapons).map(([k, lv]) => [WEAPONS[k].icon, lv, true]);
  while (items.length < WEAPON_SLOTS) items.push(null);
  for (const [k, lv] of Object.entries(P.passives)) items.push([PASSIVES[k].icon, lv, false]);
  while (items.length < WEAPON_SLOTS + PASSIVE_SLOTS) items.push(null);
  items.forEach((it, i) => {
    const sx = x + i * (size + 3) + (i >= WEAPON_SLOTS ? 6 : 0);
    ctx.fillStyle = it ? (it[2] ? '#fff6dc' : '#eef7ff') : '#efe9f6'; ctx.strokeStyle = it ? (it[1] >= MAX_LV ? '#ff7ab8' : it[2] ? '#f2c14e' : '#9cc9f0') : '#ddd3ea'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(sx, y, size, size + 4, 6); ctx.fill(); ctx.stroke();
    if (it) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `${Math.round(size * 0.55)}px system-ui`; ctx.fillText(it[0], sx + size / 2, y + size * 0.45);
      ctx.font = `900 ${Math.max(8, Math.round(size * 0.32))}px system-ui`; ctx.fillStyle = it[1] >= MAX_LV ? '#d6337a' : '#9a6a00'; ctx.fillText(it[1] >= MAX_LV ? 'MAX' : `${it[1]}`, sx + size / 2, y + size * 0.95);
    }
  });
}
function drawHud(now) {
  const r = S.run, pad = 10, top = Math.max(pad, 4);
  ctx.textBaseline = 'middle';
  // 經驗條
  bar(pad, top, W - pad * 2, 14, P.exp / P.need, 'rgba(40,25,70,.5)', '#7fd0ff');
  ctx.font = '900 11px system-ui'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(`Lv.${P.level}`, pad + 8, top + 7.5);
  const narrow = W < 700;
  const y2 = top + 22;
  const rightLimit = W - pad - 54; // 留給暫停鈕
  const timeText = fmt(r.t);
  const bossLine = () => {
    if (r.boss) return null;
    if (r.bossDone) return '魔王打倒了！';
    const left = r.nextBoss - r.t;
    return left > 0 ? `魔王還有 ${Math.ceil(left)} 秒` : '魔王來了！';
  };
  let bannerY;
  if (!narrow) {
    // 左：生命＋道具格
    hudCard(pad, y2, 232, 74);
    ctx.textAlign = 'left'; ctx.font = '900 13px system-ui'; ctx.fillStyle = '#e2445f'; ctx.fillText(`❤ ${Math.ceil(P.hp)} / ${P.maxHp}`, pad + 12, y2 + 16);
    bar(pad + 104, y2 + 11, 116, 10, P.hp / P.maxHp, '#f3dce2', '#ff5d7a');
    drawSlots(pad + 10, y2 + 32, 22);
    // 中：時間＋魔王
    const cw = 270, cx = W / 2 - cw / 2;
    hudCard(cx, y2, cw, 56);
    if (r.boss) {
      ctx.textAlign = 'center'; ctx.font = '900 14px system-ui'; ctx.fillStyle = '#c2304a'; ctx.fillText(`👑 ${r.boss.name}`, W / 2, y2 + 17);
      bar(cx + 14, y2 + 30, cw - 28, 14, r.boss.hp / r.boss.maxHp, '#f6dde3', r.boss.phase === 2 ? '#ff3b5c' : '#ff8a4c');
    } else {
      ctx.textAlign = 'left'; ctx.fillStyle = '#3b2a6b'; ctx.font = '900 26px system-ui'; ctx.fillText(timeText, cx + 16, y2 + 29);
      ctx.font = '800 12px system-ui'; ctx.fillStyle = '#7a6aa8'; ctx.fillText(bossLine(), cx + 112, y2 + 20);
      if (!r.bossDone) bar(cx + 112, y2 + 34, cw - 128, 9, r.mode === 'stage' ? r.t / r.nextBoss : 1 - (r.nextBoss - r.t) / ENDLESS_BOSS_GAP, '#efe9f6', '#ff8a4c');
    }
    // 右：星星＋擊倒
    const rw = 156; hudCard(rightLimit - rw, y2, rw, 56);
    ctx.textAlign = 'left'; ctx.font = '900 19px system-ui'; ctx.fillStyle = '#e8a400'; ctx.fillText(`⭐ ${r.starsPaid}`, rightLimit - rw + 14, y2 + 22);
    ctx.font = '800 11px system-ui'; ctx.fillStyle = '#7a6aa8'; ctx.fillText('已得星星', rightLimit - rw + 14, y2 + 42);
    ctx.font = '900 19px system-ui'; ctx.fillStyle = '#3b2a6b'; ctx.fillText(`👾 ${r.kills}`, rightLimit - rw + 84, y2 + 22);
    ctx.font = '800 11px system-ui'; ctx.fillStyle = '#7a6aa8'; ctx.fillText('擊倒', rightLimit - rw + 86, y2 + 42);
    bannerY = y2 + 92;
  } else {
    // 窄螢幕：第一排 時間｜星星擊倒；第二排 生命＋道具格
    const w1 = rightLimit - pad;
    hudCard(pad, y2, w1, 46);
    ctx.textAlign = 'left';
    if (r.boss) {
      ctx.font = '900 13px system-ui'; ctx.fillStyle = '#c2304a'; ctx.fillText(`👑 ${r.boss.name}`, pad + 12, y2 + 15);
      bar(pad + 12, y2 + 27, w1 - 110, 11, r.boss.hp / r.boss.maxHp, '#f6dde3', r.boss.phase === 2 ? '#ff3b5c' : '#ff8a4c');
    } else {
      ctx.font = '900 22px system-ui'; ctx.fillStyle = '#3b2a6b'; ctx.fillText(timeText, pad + 12, y2 + 24);
      ctx.font = '800 11px system-ui'; ctx.fillStyle = '#7a6aa8'; ctx.fillText(bossLine(), pad + 76, y2 + 24);
    }
    ctx.textAlign = 'right'; ctx.font = '900 15px system-ui'; ctx.fillStyle = '#e8a400'; ctx.fillText(`⭐ ${r.starsPaid}`, pad + w1 - 60, y2 + 24);
    ctx.fillStyle = '#3b2a6b'; ctx.fillText(`👾 ${r.kills}`, pad + w1 - 10, y2 + 24);
    const y3 = y2 + 52;
    const w2 = W - pad * 2;
    hudCard(pad, y3, w2, 40);
    const slot = Math.min(22, (w2 - 120) / 8.5);
    ctx.textAlign = 'left'; ctx.font = '900 12px system-ui'; ctx.fillStyle = '#e2445f'; ctx.fillText(`❤ ${Math.ceil(P.hp)}`, pad + 10, y3 + 14);
    bar(pad + 10, y3 + 25, 70, 8, P.hp / P.maxHp, '#f3dce2', '#ff5d7a');
    drawSlots(pad + 92, y3 + 6, slot);
    bannerY = y3 + 60;
  }
  // 提示橫幅
  if (r.banner) {
    const bn = r.banner;
    const a = clamp(Math.min(bn.t, bn.max - bn.t) * 4, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = '900 15px system-ui';
    const tw = Math.min(W - 24, ctx.measureText(bn.text).width + 36);
    ctx.fillStyle = bn.kind === 'star' ? 'rgba(255,248,220,.96)' : 'rgba(255,255,255,.94)';
    ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2, bannerY, tw, 34, 17); ctx.fill();
    ctx.textAlign = 'center'; ctx.fillStyle = bn.kind === 'star' ? '#b07400' : '#4a3a7a'; ctx.fillText(bn.text, W / 2, bannerY + 17);
    ctx.globalAlpha = 1;
  }
}

/* =========================================================
   操作（沿用舊版：鍵盤、左右固定搖桿、觸控拖曳）
   ========================================================= */
const keys = { up: false, down: false, left: false, right: false };
let joyLState = { active: false, id: null, x: 0, y: 0, updatedAt: 0 };
let joyRState = { active: false, id: null, x: 0, y: 0, updatedAt: 0 };
let dragMove = { active: false, id: null, startX: 0, startY: 0, x: 0, y: 0, updatedAt: 0 };
const joyLEl = document.getElementById('joyL'), joyREl = document.getElementById('joyR');
const stickLEl = document.getElementById('stickL'), stickREl = document.getElementById('stickR');
const isTouch = () => window.matchMedia('(hover: none) and (pointer: coarse)').matches;
document.body.classList.toggle('touch', isTouch());

function controlVector() {
  let x = 0, y = 0;
  if (keys.left) x -= 1; if (keys.right) x += 1; if (keys.up) y -= 1; if (keys.down) y += 1;
  if (S.botMove) { x += S.botMove.x; y += S.botMove.y; }
  const active = [joyLState, joyRState, dragMove].filter((s) => s.active).sort((a, b) => b.updatedAt - a.updatedAt)[0];
  if (active) { x += active.x; y += active.y; }
  const m = Math.hypot(x, y);
  if (m > 1) { x /= m; y /= m; }
  return { x, y };
}
function updateStick(state, el) { el.style.transform = `translate(${state.x * 24}px, ${state.y * 24}px)`; }
function setJoy(el, state, stick, cx0, cy0) {
  const rc = el.getBoundingClientRect();
  const dx = cx0 - (rc.left + rc.width / 2), dy = cy0 - (rc.top + rc.height / 2), d = Math.hypot(dx, dy) || 1, max = 30;
  state.x = clamp(dx / max, -1, 1); state.y = clamp(dy / max, -1, 1);
  if (d > max) { state.x = dx / d; state.y = dy / d; }
  state.updatedAt = performance.now();
  updateStick(state, stick);
}
function setDrag(cx0, cy0) {
  const dx = cx0 - dragMove.startX, dy = cy0 - dragMove.startY, d = Math.hypot(dx, dy) || 1, max = 56;
  dragMove.x = clamp(dx / max, -1, 1); dragMove.y = clamp(dy / max, -1, 1);
  if (d > max) { dragMove.x = dx / d; dragMove.y = dy / d; }
  dragMove.updatedAt = performance.now();
}
function insideJoy(el, x, y) { const rc = el.getBoundingClientRect(); return x >= rc.left - 20 && x <= rc.right + 20 && y >= rc.top - 20 && y <= rc.bottom + 20; }
function resetJoy(state, stick, id) { if (id !== state.id) return; Object.assign(state, { active: false, id: null, x: 0, y: 0, updatedAt: 0 }); updateStick(state, stick); }
function resetDrag(id) { if (id !== dragMove.id) return; Object.assign(dragMove, { active: false, id: null, startX: 0, startY: 0, x: 0, y: 0, updatedAt: 0 }); }
function resetInputs() {
  Object.assign(keys, { up: false, down: false, left: false, right: false });
  joyLState = { active: false, id: null, x: 0, y: 0, updatedAt: 0 }; joyRState = { active: false, id: null, x: 0, y: 0, updatedAt: 0 };
  dragMove = { active: false, id: null, startX: 0, startY: 0, x: 0, y: 0, updatedAt: 0 };
  updateStick(joyLState, stickLEl); updateStick(joyRState, stickREl);
}
const KEYMAP = { arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right' };
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (KEYMAP[k]) { keys[KEYMAP[k]] = true; e.preventDefault(); }
  if ((k === 'p' || k === 'escape') && (S.mode === 'play')) togglePause();
  if (S.mode === 'levelup' && ['1', '2', '3'].includes(k)) chooseUpgrade(Number(k) - 1);
}, { passive: false });
addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (KEYMAP[k]) keys[KEYMAP[k]] = false; });
cv.addEventListener('pointerdown', (e) => {
  if (!isTouch()) return;
  if (insideJoy(joyLEl, e.clientX, e.clientY) && !joyLState.active) { Object.assign(joyLState, { active: true, id: e.pointerId }); setJoy(joyLEl, joyLState, stickLEl, e.clientX, e.clientY); }
  else if (insideJoy(joyREl, e.clientX, e.clientY) && !joyRState.active) { Object.assign(joyRState, { active: true, id: e.pointerId }); setJoy(joyREl, joyRState, stickREl, e.clientX, e.clientY); }
  else if (!joyLState.active && !joyRState.active && !dragMove.active) { Object.assign(dragMove, { active: true, id: e.pointerId, startX: e.clientX, startY: e.clientY, x: 0, y: 0 }); setDrag(e.clientX, e.clientY); }
  else return;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', (e) => {
  if (joyLState.active && e.pointerId === joyLState.id) setJoy(joyLEl, joyLState, stickLEl, e.clientX, e.clientY);
  if (joyRState.active && e.pointerId === joyRState.id) setJoy(joyREl, joyRState, stickREl, e.clientX, e.clientY);
  if (dragMove.active && e.pointerId === dragMove.id) setDrag(e.clientX, e.clientY);
});
const endPointer = (e) => { resetJoy(joyLState, stickLEl, e.pointerId); resetJoy(joyRState, stickREl, e.pointerId); resetDrag(e.pointerId); };
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

/* =========================================================
   暫停：自己的暫停鈕、切走分頁、GameModal 暫停／時間到（見 optimized.md §1.4）
   ========================================================= */
function togglePause(force) {
  const on = force ?? !S.userPaused;
  if (on && S.mode !== 'play' && S.mode !== 'levelup') return;
  S.userPaused = on;
  if (on) { resetInputs(); show('pause'); } else hide('pause');
  lastFrame = performance.now();
}
document.getElementById('pauseBtn').addEventListener('click', () => togglePause(true));
document.getElementById('pauseResume').addEventListener('click', () => togglePause(false));
document.getElementById('pauseMenu').addEventListener('click', () => { togglePause(false); finishRun(); openMenu(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'play' && !S.userPaused) togglePause(true); });
addEventListener('message', (e) => {
  if (e.origin !== window.location.origin || e.source !== window.parent) return;
  const t = e.data && e.data.type;
  if (t === 'QUESTMON_PAUSE') { S.hostPaused = true; resetInputs(); }
  else if (t === 'QUESTMON_RESUME') { S.hostPaused = false; lastFrame = performance.now(); }
});

/* =========================================================
   主迴圈
   ========================================================= */
let lastFrame = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - lastFrame) / 1000) * TS;
  lastFrame = now;
  const running = S.mode === 'play' && !S.userPaused && !S.hostPaused;
  if (running) {
    while (dt > 0 && S.mode === 'play') { const step = Math.min(dt, 1 / 60); update(step); dt -= step; }
    if (S.mode === 'play' && S.run.pendingLevels > 0 && S.run.clearT < 0) openLevelUp();
  }
  draw(now);
  requestAnimationFrame(frame);
}

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

/* 測試掛勾 */
window.__ms = {
  S, ZONES, WEAPONS, PASSIVES, save,
  get P() { return P; }, get enemies() { return enemies; }, get ebullets() { return ebullets; }, get pickups() { return pickups; },
  start: (map = 0, pal = 'slime', mode = 'stage') => startRun(map, pal, mode),
  god: (on = true) => { S.god = on; },
  skipTo: (t) => { if (S.run) { S.run.t = t; } },
  choose: (i = 0) => chooseUpgrade(i),
  bot: (v) => { S.botMove = v; },
};

openMenu();
requestAnimationFrame(frame);
</script>
