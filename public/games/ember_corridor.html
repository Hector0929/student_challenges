<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>銀河守衛</title>
<style>
  :root { --line: rgba(255,255,255,.16); --gold: #ffd166; --sub: #c3c9ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 0%, #2a2f7a, #0b1030 70%); color: #fff;
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .scene { position: fixed; inset: 0; display: none; }
  .scene.on { display: block; }

  /* ---------- 機庫 ---------- */
  #scene-hangar { overflow-y: auto; touch-action: pan-y; background: linear-gradient(180deg, #121a4d, #2a1c5c); }
  .hangar { max-width: 760px; margin: 0 auto; padding: 18px 16px 28px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .04em; }
  .sub { margin: 4px 0 6px; color: var(--sub); font-size: 14px; line-height: 1.5; }
  .icon-btn { width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.08); font-size: 18px; flex: none; }
  .section-title { font-size: 13px; font-weight: 800; color: var(--sub); letter-spacing: .12em; margin: 16px 0 8px; }
  .cards { display: grid; gap: 10px; grid-template-columns: 1fr; }
  .card { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; background: rgba(255,255,255,.07);
    border: 2px solid rgba(255,255,255,.12); border-radius: 18px; padding: 10px; text-align: left; transition: transform .15s, border-color .15s; }
  .card.sel { border-color: var(--gold); background: rgba(255,209,102,.13); transform: translateY(-2px); }
  .card canvas { width: 92px; height: 92px; display: block; }
  .card b { font-size: 18px; }
  .role { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; margin-left: 6px; color: #2b1600; vertical-align: 2px; }
  .card small { display: block; color: var(--sub); font-size: 12.5px; margin: 4px 0 6px; line-height: 1.45; }
  .stats { display: grid; grid-template-columns: auto auto; gap: 3px 8px; font-size: 11px; justify-content: start; align-items: center; }
  .bar { display: flex; gap: 2px; }
  .bar i { width: 14px; height: 6px; border-radius: 2px; background: #7cf0c8; }
  .bar i.off { background: rgba(255,255,255,.18); }
  @media (min-width: 640px) {
    .cards { grid-template-columns: repeat(3, 1fr); }
    .card { grid-template-columns: 1fr; text-align: center; }
    .card canvas { margin: 0 auto; width: 110px; height: 110px; }
    .stats { justify-content: center; }
  }
  .seg { display: flex; gap: 6px; background: rgba(255,255,255,.07); border-radius: 14px; padding: 4px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 10px 0; border-radius: 10px; font-weight: 800; }
  .seg button.on { background: var(--gold); color: #3b1d00; }
  .note { font-size: 12px; color: var(--sub); margin-top: 6px; }
  .stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  @media (min-width: 640px) { .stages { grid-template-columns: repeat(6, 1fr); } }
  .stages button { border: 0; padding: 9px 4px; border-radius: 12px; background: rgba(255,255,255,.08); font-weight: 800; font-size: 13px; }
  .stages button small { display: block; font-size: 10px; font-weight: 600; color: var(--sub); margin-top: 2px; }
  .stages button.on { background: var(--gold); color: #3b1d00; }
  .stages button.on small { color: #6b3d00; }
  .stages button:disabled { opacity: .45; cursor: default; }
  .go { margin-top: 18px; width: 100%; height: 58px; border: 0; border-radius: 18px; font-weight: 900; font-size: 20px; color: #3b1d00;
    background: linear-gradient(180deg, #ffe08a, #ffb347); box-shadow: 0 5px 0 #c2700f; }
  .go:active { transform: translateY(3px); box-shadow: 0 2px 0 #c2700f; }
  .howto { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 14px; font-size: 12px; color: var(--sub); }
  .howto span { background: rgba(255,255,255,.06); border-radius: 10px; padding: 7px 9px; }

  /* ---------- 戰鬥 ---------- */
  #scene-game { background: #05081c; }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; }
  #game { display: block; width: 100%; height: 100%; }
  .hud-btn { position: absolute; border: 0; }
  #btnPause { top: 12px; right: 12px; width: 42px; height: 42px; border-radius: 14px; background: rgba(15,20,60,.72); border: 1px solid var(--line); font-size: 15px; font-weight: 900; }
  #btnBomb { right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); width: 72px; height: 72px; border-radius: 50%; font-weight: 900; font-size: 14px;
    background: radial-gradient(circle at 35% 30%, #ffd166, #ff7b2e 60%, #c2410c); box-shadow: 0 0 0 4px rgba(255,255,255,.2), 0 8px 20px rgba(255,123,46,.45); }
  #btnBomb:disabled { filter: grayscale(1); opacity: .5; }
  #btnBomb .n { position: absolute; top: -6px; right: -4px; background: #fff; color: #c2410c; border-radius: 99px; padding: 1px 7px; font-size: 12px; }

  /* ---------- 浮層 ---------- */
  .ov { position: fixed; inset: 0; display: none; place-items: center; background: rgba(5,8,28,.72); backdrop-filter: blur(3px); z-index: 10; padding: 16px; }
  .ov.on { display: grid; }
  .panel { width: min(360px, 100%); background: linear-gradient(180deg, #1c2466, #2a1c5c); border: 1px solid var(--line); border-radius: 22px; padding: 20px; text-align: center; }
  .panel h2 { margin: 0 0 6px; font-size: 24px; }
  .panel p { margin: 0 0 14px; color: var(--sub); font-size: 13px; line-height: 1.5; }
  .res { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .res div { background: rgba(255,255,255,.07); border-radius: 12px; padding: 8px; }
  .res small { display: block; font-size: 11px; color: var(--sub); }
  .res b { font-size: 17px; }
  .stars { font-size: 30px; font-weight: 900; color: var(--gold); margin: 2px 0 10px; }
  .btn { width: 100%; height: 48px; border-radius: 14px; border: 0; font-weight: 900; font-size: 16px; margin-top: 8px; background: rgba(255,255,255,.12); }
  .btn.primary { background: linear-gradient(180deg, #ffe08a, #ffb347); color: #3b1d00; }
</style>
</head>
<body>

<section class="scene on" id="scene-hangar">
  <div class="hangar">
    <div class="top">
      <h1>🛩️ 銀河守衛</h1>
      <button class="icon-btn" id="muteBtn" aria-label="音效開關">🔊</button>
    </div>
    <p class="sub">選一台主機出擊！撿到「僚」道具，就能帶兩架僚機組成三機編隊，一起打垮怪獸艦隊。</p>

    <div class="section-title">選擇戰機</div>
    <div class="cards" id="cards"></div>

    <div class="section-title">難度</div>
    <div class="seg" id="modeSeg">
      <button data-mode="standard" class="on">標準模式</button>
      <button data-mode="assist">輔助模式</button>
    </div>
    <div class="note" id="modeNote"></div>

    <div class="section-title">出擊星域</div>
    <div class="stages" id="stageSeg"></div>
    <div class="note" id="stageNote"></div>

    <button class="go" id="launch">出擊 ▶</button>

    <div class="howto">
      <span>👆 手指拖曳移動・自動射擊</span>
      <span>💣 炸彈：清光敵人子彈</span>
      <span><b style="color:#ff8cc6">P</b> 火力升級（最多 5 級）</span>
      <span><b style="color:#7cc8f0">僚</b> 僚機加入（最多 2 架）</span>
    </div>
  </div>
</section>

<section class="scene" id="scene-game">
  <div id="stage">
    <canvas id="game"></canvas>
    <button class="hud-btn" id="btnPause" aria-label="暫停">II</button>
    <button class="hud-btn" id="btnBomb">炸彈<span class="n" id="bombN">3</span></button>
  </div>
</section>

<div class="ov" id="ovPause">
  <div class="panel">
    <h2>暫停中</h2>
    <p>休息一下，準備好再出發！</p>
    <button class="btn primary" id="resumeBtn">繼續戰鬥</button>
    <button class="btn" id="muteBtn2">音效：開</button>
    <button class="btn" id="quitBtn">回到機庫（不結算）</button>
  </div>
</div>

<div class="ov" id="ovResult">
  <div class="panel">
    <h2 id="resTitle"></h2>
    <p id="resSub"></p>
    <div class="res">
      <div><small>分數</small><b id="resScore"></b></div>
      <div><small>擊墜</small><b id="resKills"></b></div>
      <div><small>最遠到達</small><b id="resReach"></b></div>
      <div><small>火力</small><b id="resWeap"></b></div>
    </div>
    <div class="stars" id="resStars"></div>
    <button class="btn primary" id="retryBtn">再玩一次</button>
    <button class="btn" id="toHangarBtn">回到機庫</button>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   基本設定：畫面寬固定 480，高度依螢幕比例調整（手機直式填滿）
   ========================================================= */
const params = new URLSearchParams(location.search);
const USER_ID = params.get('userId') || '';
const TIME_SCALE = Math.max(0.1, Math.min(8, parseFloat(params.get('ts')) || 1));
const W = 480;
const TAU = Math.PI * 2;
let H = 800, viewScale = 1, dpr = 1;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const stageBox = document.getElementById('stage');
const el = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

/* =========================================================
   遊戲狀態
   ========================================================= */
const game = {
  state: 'hangar', t: 0, score: 0, kills: 0, coins: 0,
  stage: 0, stageTime: 0, phase: 'waves', phaseT: 0, bossSpawned: false, boss: null,
  shake: 0, flash: 0, flashColor: '255,255,255', banner: null, toast: null,
  diff: 1, itemClock: 0, bombCd: 0, hintT: 0, shotSfx: 0
};
let player = null;
let wingmen = [], enemies = [], ebullets = [], pbullets = [], items = [], parts = [];
let groups = {}, groupSeq = 0, queue = [], delayed = [];
let shipIndex = 0, mode = 'standard', startStage = 0;
let settlementReported = false, godMode = false;
let bgCanvas = null, bgStars = [], decos = [], decoClock = 0;
let moveDX = 0, moveDY = 0;

const MAX_POWER = 5;
const MODES = {
  standard: { lives: 3, bombs: 3, bulletMul: 1.0, rateMul: 1.0, note: '殘機 3・炸彈 3，敵彈速度標準。' },
  assist:   { lives: 5, bombs: 5, bulletMul: 0.78, rateMul: 0.72, note: '殘機 5・炸彈 5，敵彈比較慢，數量也比較少。' }
};

/* =========================================================
   三台主機：各有一種主武器
   ========================================================= */
const SHIPS = [
  { id: 'flare', name: '赤焰號', role: '均衡型', roleColor: '#ffd166', weapon: '散射砲',
    desc: '扇形子彈，升級後越來越寬，最適合新手。',
    body: '#ef4444', wing: '#f8fafc', trim: '#b91c1c', canopy: '#fde68a', flame: '255,160,60', speed: 270, stats: [3, 3, 5] },
  { id: 'gale', name: '疾風號', role: '速度型', roleColor: '#7cf0c8', weapon: '雷射光束',
    desc: '一道光束穿透整排敵人，移動最快。',
    body: '#22c55e', wing: '#ecfdf5', trim: '#15803d', canopy: '#bae6fd', flame: '125,240,200', speed: 330, stats: [5, 3, 2] },
  { id: 'titan', name: '鐵甲號', role: '火力型', roleColor: '#ffb347', weapon: '重砲＋追蹤飛彈',
    desc: '砲彈又大又痛，還會射追蹤飛彈，打魔王最快。',
    body: '#f59e0b', wing: '#fff7e0', trim: '#b45309', canopy: '#fde68a', flame: '255,120,60', speed: 210, stats: [2, 5, 3] }
];
const WINGMAN = { id: 'wing', body: '#4fb3e8', wing: '#e0f2fe', trim: '#2b6fa0', canopy: '#fde68a', flame: '125,240,200' };
const STAT_LABELS = ['速度', '火力', '範圍'];

/* =========================================================
   六個星域的主題：背景、敵機配色、子彈顏色、裝飾
   ========================================================= */
const THEMES = [
  { top: '#0b1030', mid: '#1a1f5c', bot: '#2b1d5e', neb: ['120,80,220', '60,160,230', '230,90,160'], planet: ['#6c5ce7', '#8e7cf0'],
    enemy: [['#6fbf4a', '#3f8f2e'], ['#4fb3e8', '#2b6fa0'], ['#f472b6', '#b83280']], bullet: '255,150,50', deco: 'station' },
  { top: '#121838', mid: '#272d68', bot: '#3d3672', neb: ['250,210,90', '120,140,255', '200,200,255'], planet: ['#f4c542', '#ffe08a'],
    enemy: [['#facc15', '#a16207'], ['#a78bfa', '#6d28d9'], ['#60a5fa', '#1d4ed8']], bullet: '255,210,70', deco: 'cloud' },
  { top: '#2a0f1f', mid: '#5a1a2a', bot: '#7a2c1a', neb: ['255,110,50', '255,60,90', '255,180,80'], planet: ['#ef4444', '#fb923c'],
    enemy: [['#fb923c', '#c2410c'], ['#f87171', '#b91c1c'], ['#facc15', '#b45309']], bullet: '200,130,255', deco: 'rock' },
  { top: '#0a2038', mid: '#14406b', bot: '#2a6e9a', neb: ['120,220,255', '180,200,255', '255,255,255'], planet: ['#7dd3fc', '#e0f2fe'],
    enemy: [['#67e8f9', '#0e7490'], ['#c4b5fd', '#6d28d9'], ['#f0f9ff', '#64748b']], bullet: '255,120,90', deco: 'ice' },
  { top: '#04213a', mid: '#0a3d5c', bot: '#0f5a6e', neb: ['40,200,200', '60,120,255', '120,255,200'], planet: ['#14b8a6', '#5eead4'],
    enemy: [['#2dd4bf', '#0f766e'], ['#38bdf8', '#0369a1'], ['#fb7185', '#be123c']], bullet: '255,170,60', deco: 'bubble' },
  { top: '#1a0b30', mid: '#3b1460', bot: '#5a1a6e', neb: ['255,90,200', '120,90,255', '255,200,90'], planet: ['#e879f9', '#f0abfc'],
    enemy: [['#f472b6', '#9d174d'], ['#a78bfa', '#5b21b6'], ['#fbbf24', '#b45309']], bullet: '255,205,60', deco: 'rainbow' }
];
const theme = () => THEMES[game.stage] || THEMES[0];

/* =========================================================
   魔王圖片（沿用怪獸塔的魔王去背圖）
   ========================================================= */
const SPRITE_DIR = '/images/monsters/cutout/';
const SPRITES = {};
function loadSprite(file) {
  if (SPRITES[file]) return;
  const img = new Image();
  const s = { img, ok: false };
  img.onload = () => { s.ok = true; };
  img.src = SPRITE_DIR + file;
  SPRITES[file] = s;
}

/* =========================================================
   音效（WebAudio 簡易合成器）
   ========================================================= */
const Audio_ = {
  ctx: null, muted: false, master: null, bgmTimer: null, step: 0, bgmOn: false,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.22;
    this.master.connect(this.ctx.destination);
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  blip(freq, dur, type, vol) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (dur || 0.08));
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + (dur || 0.08) + 0.02);
  },
  noise(dur, vol) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime, len = Math.floor(this.ctx.sampleRate * (dur || 0.2));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.25;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  shot() { this.blip(880, 0.04, 'square', 0.04); },
  cannon() { this.blip(180, 0.08, 'square', 0.08); },
  boom(big) { this.noise(big ? 0.55 : 0.18, big ? 0.4 : 0.16); },
  hit() { this.blip(120, 0.4, 'sawtooth', 0.25); },
  bomb() { this.noise(0.9, 0.45); this.blip(70, 0.7, 'sine', 0.3); },
  ui() { this.blip(520, 0.05, 'triangle', 0.12); },
  pickup() { this.blip(880, 0.07, 'triangle', 0.16); setTimeout(() => this.blip(1320, 0.1, 'triangle', 0.14), 60); },
  coin() { this.blip(1500, 0.04, 'triangle', 0.05); },
  warn() { this.blip(220, 0.3, 'sawtooth', 0.18); setTimeout(() => this.blip(180, 0.4, 'sawtooth', 0.18), 320); },
  clear() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => this.blip(f, 0.22, 'triangle', 0.18), i * 130)); },
  startBgm() {
    if (!this.ctx || this.bgmOn) return;
    this.bgmOn = true;
    const bass = [65.41, 65.41, 98, 65.41, 87.31, 87.31, 73.42, 98];
    const lead = [523.25, 0, 659.25, 783.99, 0, 659.25, 587.33, 0];
    this.bgmTimer = setInterval(() => {
      if (this.muted) return;
      const i = this.step % 8;
      this.blip(bass[i], 0.2, 'triangle', 0.15);
      if (this.step % 2 === 0) this.noise(0.03, 0.05);
      if (lead[i]) this.blip(lead[i], 0.14, 'square', 0.04);
      this.step++;
    }, 230);
  },
  stopBgm() { clearInterval(this.bgmTimer); this.bgmOn = false; }
};

/* =========================================================
   繪圖素材快取（光暈、敵機、子彈都先畫好再貼，手機才跑得順）
   ========================================================= */
const glowCache = new Map();
function glowSprite(rgb) {
  let c = glowCache.get(rgb);
  if (!c) {
    c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${rgb},.95)`); gr.addColorStop(0.35, `rgba(${rgb},.4)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    glowCache.set(rgb, c);
  }
  return c;
}
function drawGlow(g, x, y, r, rgb, alpha) {
  if (alpha !== undefined) g.globalAlpha = alpha;
  g.drawImage(glowSprite(rgb), x - r, y - r, r * 2, r * 2);
  if (alpha !== undefined) g.globalAlpha = 1;
}
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
}
function circle(g, x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = fill; g.fill(); }
function poly(g, pts, fill) {
  g.beginPath(); g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.closePath(); g.fillStyle = fill; g.fill();
}
function mirror(pts) { const out = []; for (let i = 0; i < pts.length; i += 2) out.push(-pts[i], pts[i + 1]); return out; }
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

/* 主角戰機：三種造型，左右移動時機身會傾斜 */
function drawFighter(g, x, y, s, sh, bank, t) {
  g.save();
  g.translate(x, y);
  g.scale(1 - Math.abs(bank || 0) * 0.22, 1);
  const fl = 1 + Math.sin((t || 0) * 50) * 0.15;
  const engines = sh.id === 'titan' ? [-0.28, 0.28] : [0];
  for (const ex of engines) {
    drawGlow(g, ex * s, s * 0.85, s * 0.6, sh.flame);

    g.fillStyle = dark; g.fillRect(-s * 0.12, s * 0.4, s * 0.24, s * 0.5);

/* =========================================================
   背景：漸層星空＋星雲（先畫好），星星與裝飾往下捲動
   ========================================================= */
function buildBg() {
  const th = theme();
  bgCanvas = document.createElement('canvas'); bgCanvas.width = W; bgCanvas.height = H;
  const g = bgCanvas.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, th.top); gr.addColorStop(0.55, th.mid); gr.addColorStop(1, th.bot);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const spots = [[0.18, 0.32, 0.75], [0.88, 0.7, 0.62], [0.62, 0.12, 0.5]];
  spots.forEach(([x, y, r], i) => {
    const rg = g.createRadialGradient(W * x, H * y, 0, W * x, H * y, W * r);
    rg.addColorStop(0, `rgba(${th.neb[i]},.32)`); rg.addColorStop(1, `rgba(${th.neb[i]},0)`);
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  });
}
function initStars() {
  bgStars = [];
  for (let i = 0; i < 90; i++) bgStars.push({ x: Math.random() * W, y: Math.random() * H, z: i % 3, tw: Math.random() * TAU });
  decos = [];
  decoClock = 0;
  decos.push(makeDeco('planet', H * 0.25));
}
function makeDeco(kind, y) {
  const th = theme();
  if (kind === 'planet') {
    return { kind, x: rand(W * 0.62, W * 0.92), y: y ?? -120, r: rand(42, 66), vy: 10, ring: Math.random() < 0.6, c: th.planet };
  }
  const d = { kind, x: rand(20, W - 20), y: -80, vy: rand(40, 80), r: rand(14, 40), rot: rand(0, TAU), spin: rand(-0.6, 0.6) };
  if (kind === 'cloud') { d.r = rand(50, 90); d.vy = rand(70, 110); }
  if (kind === 'bubble') { d.r = rand(6, 18); d.vy = rand(25, 50); d.wob = rand(0, TAU); }
  if (kind === 'station') { d.r = rand(22, 32); d.vy = 35; }
  return d;
}
function updateBg(dt) {
  for (const s of bgStars) {
    s.y += (18 + s.z * 34) * dt;
    if (s.y > H) { s.y = -4; s.x = Math.random() * W; }
  }
  decoClock -= dt;
  if (decoClock <= 0) {
    const th = theme();
    decoClock = th.deco === 'cloud' ? rand(1.2, 2.4) : th.deco === 'bubble' ? rand(0.4, 0.9) : rand(2.5, 4.5);
    decos.push(makeDeco(th.deco));
    if (!decos.some(d => d.kind === 'planet') && Math.random() < 0.15) decos.push(makeDeco('planet'));
  }
  for (const d of decos) {
    d.y += d.vy * dt;
    if (d.rot !== undefined) d.rot += d.spin * dt;
    if (d.wob !== undefined) d.wob += dt * 2;
  }
  decos = decos.filter(d => d.y < H + 150);
}
function drawBg() {
  if (!bgCanvas) buildBg();
  ctx.drawImage(bgCanvas, 0, 0);
  for (const s of bgStars) {
    ctx.globalAlpha = 0.35 + s.z * 0.2 + Math.sin(game.t * 3 + s.tw) * 0.15;
    ctx.fillStyle = '#fff';
    const r = 0.7 + s.z * 0.55;
    ctx.fillRect(s.x - r, s.y - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;
  for (const d of decos) drawDeco(d);
}
function drawDeco(d) {
  const g = ctx;
  if (d.kind === 'planet') {
    circle(g, d.x, d.y, d.r, d.c[0]);
    circle(g, d.x - d.r * 0.22, d.y - d.r * 0.22, d.r * 0.78, d.c[1]);
    g.globalAlpha = 0.25; circle(g, d.x + d.r * 0.3, d.y + d.r * 0.25, d.r * 0.25, '#000'); g.globalAlpha = 1;
    if (d.ring) {
      g.strokeStyle = 'rgba(255,225,170,.6)'; g.lineWidth = 3;
      g.beginPath(); g.ellipse(d.x, d.y, d.r * 1.6, d.r * 0.35, -0.3, 0, TAU); g.stroke();
    }
  } else if (d.kind === 'cloud') {
    g.globalAlpha = 0.13;
    circle(g, d.x, d.y, d.r, '#e0e7ff'); circle(g, d.x + d.r * 0.7, d.y + 10, d.r * 0.7, '#e0e7ff'); circle(g, d.x - d.r * 0.7, d.y + 14, d.r * 0.6, '#e0e7ff');
    g.globalAlpha = 1;
  } else if (d.kind === 'rock') {
    g.save(); g.translate(d.x, d.y); g.rotate(d.rot);
    poly(g, [-d.r, -d.r * 0.3, -d.r * 0.4, -d.r, d.r * 0.6, -d.r * 0.8, d.r, 0, d.r * 0.5, d.r * 0.9, -d.r * 0.6, d.r * 0.7], 'rgba(90,40,40,.75)');
    g.strokeStyle = 'rgba(255,140,60,.8)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-d.r * 0.4, -d.r * 0.2); g.lineTo(0, d.r * 0.1); g.lineTo(d.r * 0.4, -d.r * 0.3); g.stroke();
    g.restore();

    poly(g, [0, -d.r * 0.6, d.r * 0.18, 0, 0, d.r * 0.6, -d.r * 0.18, 0], '#fff');
    g.globalAlpha = 1; g.restore();
  } else if (d.kind === 'bubble') {
    g.strokeStyle = 'rgba(190,255,245,.45)'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(d.x + Math.sin(d.wob) * 8, d.y, d.r, 0, TAU); g.stroke();
    circle(g, d.x + Math.sin(d.wob) * 8 - d.r * 0.35, d.y - d.r * 0.35, d.r * 0.2, 'rgba(255,255,255,.5)');
  } else if (d.kind === 'station') {
    g.save(); g.translate(d.x, d.y); g.rotate(d.rot); g.globalAlpha = 0.55;
    g.fillStyle = '#94a3b8'; g.fillRect(-d.r * 1.4, -d.r * 0.12, d.r * 2.8, d.r * 0.24);
    g.fillStyle = '#60a5fa'; g.fillRect(-d.r * 1.4, -d.r * 0.4, d.r * 0.6, d.r * 0.8); g.fillRect(d.r * 0.8, -d.r * 0.4, d.r * 0.6, d.r * 0.8);
    circle(g, 0, 0, d.r * 0.4, '#e2e8f0');
    g.globalAlpha = 1; g.restore();
  } else if (d.kind === 'rainbow') {
    const cols = ['255,110,150', '255,200,90', '120,230,160', '110,170,255', '200,130,255'];
    drawGlow(g, d.x, d.y, d.r * 1.4, cols[Math.floor(d.r) % cols.length], 0.55);
  }
}

/* =========================================================
   輸入：手指／滑鼠拖曳（相對移動，手指不會擋住戰機）、鍵盤
   ========================================================= */
const keys = {};
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };
addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (game.state === 'play' && (e.code === 'Space' || e.code === 'KeyX' || e.code === 'KeyB')) { useBomb(); e.preventDefault(); }
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (game.state === 'hangar' && e.code === 'Enter') startGame();
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });

let dragId = null, dragPrev = null;
stageBox.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  dragId = e.pointerId; dragPrev = { x: e.clientX, y: e.clientY };
  try { stageBox.setPointerCapture(e.pointerId); } catch {}
  Audio_.resume();
});
stageBox.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId || !dragPrev) return;
  const k = 1.25 / viewScale;
  moveDX += (e.clientX - dragPrev.x) * k;
  moveDY += (e.clientY - dragPrev.y) * k;
  dragPrev = { x: e.clientX, y: e.clientY };
});
const endDrag = e => { if (e.pointerId === dragId) { dragId = null; dragPrev = null; } };
stageBox.addEventListener('pointerup', endDrag);
stageBox.addEventListener('pointercancel', endDrag);

/* =========================================================
   出擊與關卡流程：6 關連續，每關「波次 → 魔王 → 過關」
   ========================================================= */
function resetRun() {
  const m = MODES[mode];
  player = { x: W / 2, y: H - 130, r: 4, ship: SHIPS[shipIndex], lives: m.lives, bombs: m.bombs, inv: 2, dead: false, deadT: 0,
    power: 1, fireT: 0, missileT: 0.3, bank: 0, vx: 0 };
  wingmen = []; enemies = []; ebullets = []; pbullets = []; items = []; parts = []; groups = {}; queue = []; delayed = [];
  moveDX = moveDY = 0;
  settlementReported = false;
  Object.assign(game, { t: 0, score: 0, kills: 0, coins: 0, shake: 0, flash: 0, banner: null, toast: null, bombCd: 0, hintT: 4.5, boss: null });
  game.stage = clamp(startStage, 0, STAGES.length - 1);
  // 從中段關卡出擊時給一點補償火力，不然打不動後段魔王
  if (game.stage > 0) {
    player.power = Math.min(MAX_POWER, 1 + Math.ceil(game.stage / 2));
    if (game.stage >= 2) addWingman(true);
  }
  enterStage(game.stage);
  syncHud();
}

function enterStage(i) {
  const st = STAGES[i];
  queue = []; delayed = [];
  game.stageTime = 0;
  game.phase = 'waves';
  game.phaseT = 0;
  game.bossSpawned = false;
  game.boss = null;
  game.diff = 1 + i * 0.14;
  game.itemClock = 14;
  buildBg();
  initStars();
  st.waves((t, fn) => queue.push({ t, fn, done: false }));
  banner(`STAGE ${i + 1}`, st.name, 2.4, '#7cf0c8');
}
function startBossPhase() {
  const b = STAGES[game.stage].boss;
  game.phase = 'boss';
  game.phaseT = 2.2;
  cancelBullets();
  banner('WARNING!', `魔王來襲：${b.name}`, 2.4, '#ff6b6b');
  Audio_.warn();
}
function clearStage() {
  const last = game.stage >= STAGES.length - 1;
  saveProgress(Math.min(STAGES.length - 1, game.stage + 1));
  if (last) { game.phase = 'win'; game.phaseT = 2.6; banner('全部破關！', '銀河恢復和平了！', 2.6, '#ffd166'); return; }
  game.phase = 'clear';
  game.phaseT = 3.2;
  banner('STAGE CLEAR', `${STAGES[game.stage].name} 突破！`, 2.8, '#ffd166');
}
function nextStage() {
  game.stage++;
  player.bombs = Math.min(MODES[mode].bombs, player.bombs + 1);   // 過關補一顆炸彈
  enterStage(game.stage);
  syncHud();
}
function runStagePhase(dt) {
  const st = STAGES[game.stage];
  if (game.phase === 'waves') {
    for (const q of queue) if (!q.done && game.stageTime >= q.t) { q.done = true; q.fn(); }
    if (game.stageTime > st.dur && enemies.length < 2) startBossPhase();
  } else if (game.phase === 'boss') {
    if (game.phaseT > 0) {
      game.phaseT -= dt;
      if (game.phaseT <= 0) spawnBoss();
    } else if (game.bossSpawned && !game.boss) {
      clearStage();
    }
  } else if (game.phase === 'clear') {
    player.inv = Math.max(player.inv, 0.5);
    game.phaseT -= dt;
    if (game.phaseT <= 0) nextStage();
  } else if (game.phase === 'win') {
    player.inv = Math.max(player.inv, 0.5);
    game.phaseT -= dt;
    if (game.phaseT <= 0) endRun(true);
  }
}
function banner(title, sub, dur, color) { game.banner = { title, sub, t: dur, max: dur, color }; }
function toast(text, color) { game.toast = { text, color: color || '#fff', t: 1.3 }; }

/* ---------- 敵機與移動路線 ---------- */
function spawnEnemy(type, move, o) {
  o = o || {};
  const d = game.diff, def = ETYPE[type];

  const e = {

const Move = {
  // 從側邊橫掃過畫面，上下擺動
  sweep(side, y0, speed, amp) {
    return e => {
      const t = e.t;
      e.x = side > 0 ? -30 + t * speed : W + 30 - t * speed;
      e.y = y0 + Math.sin(t * 2.2) * amp + t * 18;
      return t > 0.5 && (e.x < -50 || e.x > W + 50);
    };
  },
  // V 字編隊：飛下來停一下，再往下散開
  vform(ox, oy, cx) {
    return e => {
      const t = e.t;
      e.x = cx + ox; e.y = -60 + oy + 230 * easeOut(t / 1.8);
      if (t > 5) { const k = t - 5; e.y += k * k * 90; e.x += Math.sign(ox || 1) * k * k * 30; }
      return e.y > H + 50;
    };
  },
  // 一列火車從上方進場，繞一圈後往下離開
  loop(side, cx, cy, R, spd) {
    return e => {
      const t = e.t, tA = 1.1, tB = tA + TAU / spd;
      if (t < tA) { e.x = cx + side * R; e.y = -40 + (cy + 40) * (t / tA); }
      else if (t < tB) { const th = (t - tA) * spd; e.x = cx + side * R * Math.cos(th); e.y = cy + R * Math.sin(th); }
      else { e.x = cx + side * R; e.y = cy + (t - tB) * R * spd; }
      return e.y > H + 40;
    };
  },
  // 飛下來停一下，瞄準玩家俯衝
  dive(x, stopY) {
    return (e, dt) => {
      const t = e.t;
      if (t < 1) { e.x = x; e.y = -30 + (stopY + 30) * easeOut(t); }
      else if (t < 1.6) { e.x = x + Math.sin(t * 30) * 2; }
      else {
        if (!e.dv) {
          const a = Math.atan2(Math.max(80, player.y - e.y), player.x - e.x);
          e.dv = { x: Math.cos(a) * 360, y: Math.sin(a) * 360 };
        }
        e.x += e.dv.x * dt; e.y += e.dv.y * dt;
      }
      return e.y > H + 40 || e.x < -40 || e.x > W + 40;
    };
  },
  // 飛到定點停留一段時間射擊，然後往下離開
  park(x, stopY, stay) {
    return (e, dt) => {
      const t = e.t, tin = 1.4;
      if (t < tin) { e.x = x; e.y = -40 + (stopY + 40) * easeOut(t / tin); e.holding = false; }
      else if (t < tin + stay) { e.y = stopY + Math.sin((t - tin) * 1.6) * 8; e.x = x + Math.sin((t - tin) * 0.9) * 24; e.holding = true; }
      else { e.holding = false; e.y += 170 * dt; }
      return e.y > H + 50;
    };
  },
  // 補給艦：慢慢橫越畫面
  cross(side, y) {
    return e => {
      const t = e.t;
      e.x = side > 0 ? -40 + t * 90 : W + 40 - t * 90;
      e.y = y + Math.sin(t * 2) * 16;
      return t > 1 && (e.x < -60 || e.x > W + 60);
    };
  },
  // 砲台：跟著背景慢慢往下飄
  drift(x, speed) {
    return (e, dt) => {
      if (!e.init) { e.init = true; e.y = -40; }
      e.y += speed * dt; e.x = x + Math.sin(e.t * 0.7) * 30;
      return e.y > H + 60;
    };
  }
};

function lineSweep(n, side, y0, o) {
  o = o || {};

  for (let i = 0; i < n; i++) spawnEnemy('drone', Move.sweep(side, y0, o.speed || 170, o.amp ?? 40), { delay: i * 0.24, group: g, fire: o.fire });
}
function vWing(n, cx, o) {
  o = o || {};
  const g = newGroup(n, o.bonus);

    const k = i === 0 ? 0 : Math.ceil(i / 2) * (i % 2 ? -1 : 1);

function loopTrain(n, side, o) {

function ebullet(x, y, ang, speed, kind) {

  ebullets.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: kind === 'big' ? 7.5 : 5, kind: kind || 'orb' });

function aimAngle(x, y) { return Math.atan2(player.y - y, player.x - x); }
function aimed(x, y, n, speed, spread, kind) {
  const a0 = aimAngle(x, y);
  for (let i = 0; i < n; i++) ebullet(x, y, n === 1 ? a0 : a0 - spread / 2 + spread * i / (n - 1), speed, kind);
}
function ring(x, y, n, speed, off, kind) { for (let i = 0; i < n; i++) ebullet(x, y, (off || 0) + TAU * i / n, speed, kind); }

function spawnBoss() {
  const b = STAGES[game.stage].boss;
  const e = { type: 'boss', def: b, x: W / 2, y: -170, t: 0, hp: b.hp, maxHp: b.hp, r: 60, score: 6000 + game.stage * 2200, coins: 0,
    hitFlash: 0, entering: true, phase: 0, prog: null, progIdx: 0, pause: 1.0, inv: 0, homeY: clamp(H * 0.25, 175, 215), t0: 0 };
  enemies.push(e);
  game.boss = e;
  game.bossSpawned = true;
}
function updateBoss(e, dt) {
  const m = MODES[mode];
  if (e.entering) {
    e.y += 110 * dt;
    if (e.y >= e.homeY) { e.y = e.homeY; e.entering = false; e.t0 = e.t; }
    return;
  }
  const tt = e.t - e.t0;
  e.x = W / 2 + Math.sin(tt * 0.55) * Math.min(120, W / 2 - 110);
  e.y = e.homeY + Math.sin(tt * 1.3) * 10;
  e.inv = Math.max(0, e.inv - dt);
  const ph = e.hp > e.maxHp * 0.66 ? 0 : e.hp > e.maxHp * 0.33 ? 1 : 2;
  if (ph !== e.phase) {
    e.phase = ph; e.prog = null; e.pause = 1.3; e.inv = 1.0;
    cancelBullets();
    banner('魔王發怒了！', ph === 1 ? '彈幕變多了，小心閃避' : '最後階段，加油！', 1.6, '#ff6b6b');
    game.flash = 0.5; game.flashColor = '255,120,120';
    Audio_.warn();
  }
  if (e.prog) {
    const p = e.prog;
    p.next -= dt;
    while (p.next <= 0 && p.k < p.def.count) { p.def.fire(e, p.k); p.k++; p.next += p.def.every / m.rateMul; }
    if (p.k >= p.def.count) { e.prog = null; e.pause = 0.75 / m.rateMul; }
  } else {
    e.pause -= dt;
    if (e.pause <= 0) {
      const list = e.def.atk[e.phase];
      e.prog = { def: BOSS_ATK[list[e.progIdx % list.length]], k: 0, next: 0 };
      e.progIdx++;
    }
  }
}

/* =========================================================
   每一幀的更新
   ========================================================= */
function onScreen(e) { return e.t >= 0 && e.y > -e.r && e.y < H + e.r && e.x > -e.r && e.x < W + e.r; }

function updateEnemies(dt) {
  const m = MODES[mode];
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += dt;
    e.hitFlash = Math.max(0, e.hitFlash - dt * 6);
    if (e.t < 0) continue;
    if (e.type === 'boss') { updateBoss(e, dt); continue; }
    if (e.move(e, dt)) { e.gone = true; if (e.group && groups[e.group]) groups[e.group].gone++; continue; }
    // 太靠近玩家就不開火，避免貼臉子彈
    if (e.fire && e.y > 30 && e.y < player.y - 140 && e.x > 10 && e.x < W - 10) {
      e.fireT -= dt * m.rateMul * (0.85 + game.diff * 0.15);
      if (e.fireT <= 0) {
        if (e.fire === 'aim') { aimed(e.x, e.y + 8, 1, 170, 0); e.fireT = rand(1.8, 2.8); }
        else if (e.fire === 'fan3') { if (e.holding) aimed(e.x, e.y + 12, 3, 190, 0.34); e.fireT = 1.7; }
        else if (e.fire === 'ring') { ring(e.x, e.y, cnt(10), 130, e.t); e.fireT = 2.4; }
        else if (e.fire === 'spin') { e.ang += 0.5; for (let a = 0; a < 3; a++) ebullet(e.x, e.y, e.ang + a * TAU / 3, 140, 'rice'); e.fireT = 0.3; }
      }
    }
  }
}

function addWingman(silent) {
  if (wingmen.length >= 2) return false;
  const side = wingmen.length === 0 ? -1 : -wingmen[0].side;
  const w = { side, x: player.x + side * 46, y: player.y + 24, fireT: 0.2, missileT: 0.4 };
  wingmen.push(w);
  if (!silent) for (let i = 0; i < 16; i++) spark(w.x, w.y, '125,220,255', 160);
  return true;
}

function updatePlayer(dt) {
  if (player.dead) {
    player.deadT -= dt;
    if (player.deadT <= 0) {
      if (player.lives < 0) { endRun(false); return; }
      player.dead = false; player.inv = 2.6;
      player.x = W / 2; player.y = H - 130;
      moveDX = moveDY = 0;
      cancelBullets();
    }
    return;
  }
  const s = player.ship;
  let dx = 0, dy = 0;
  if (keys.left) dx--; if (keys.right) dx++;
  if (keys.up) dy--; if (keys.down) dy++;
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }
  const ox = player.x;
  player.x += dx * s.speed * dt + moveDX;
  player.y += dy * s.speed * dt + moveDY;
  moveDX = moveDY = 0;
  player.x = clamp(player.x, 18, W - 18);
  player.y = clamp(player.y, 60, H - 34);
  player.vx = (player.x - ox) / Math.max(dt, 1e-4);
  player.bank += (clamp(player.vx / 420, -1, 1) - player.bank) * Math.min(1, dt * 10);
  player.inv = Math.max(0, player.inv - dt);

  // 僚機跟在左右兩側
  const k = 1 - Math.exp(-dt * 14);
  for (const w of wingmen) {
    w.x += (clamp(player.x + w.side * 46, 12, W - 12) - w.x) * k;
    w.y += (player.y + 22 - w.y) * k;
  }

  if (player.inv <= 0 && !godMode) {
    for (const b of ebullets) {
      if (d2(b.x, b.y, player.x, player.y) < (b.r * 0.8 + player.r) ** 2) { killPlayer(); return; }
    }
    for (const e of enemies) {
      if (e.dead || !onScreen(e)) continue;
      const rr = e.type === 'boss' ? 55 : e.r * 0.7;
      if (d2(e.x, e.y, player.x, player.y) < (rr + player.r) ** 2) { killPlayer(); return; }
    }
  }
}
function killPlayer() {
  player.lives--;
  player.dead = true; player.deadT = 1.2;
  game.shake = 18; game.flash = 0.6; game.flashColor = '255,120,90';
  explode(player.x, player.y, 1.6, '255,120,80');
  // 掉一級火力和一架僚機，都會吐成道具，撿得回來
  if (player.power > 1) { player.power--; dropItem(player.x - 20, player.y - 50, 'P'); }
  if (wingmen.length) { wingmen.pop(); dropItem(player.x + 24, player.y - 70, 'W'); }
  Audio_.hit();
  syncHud();
}

function updateShooting(dt) {
  if (player.dead) return;
  const s = player.ship, p = player.power;
  player.fireT -= dt; player.missileT -= dt;
  if (player.fireT < -0.2) player.fireT = 0;
  game.shotSfx -= dt;
  if (s.id === 'flare') {
    while (player.fireT <= 0) {
      player.fireT += 0.085;
      const ways = [3, 5, 5, 7, 9][p - 1], spread = [0.24, 0.4, 0.46, 0.6, 0.76][p - 1];
      for (let i = 0; i < ways; i++) {
        const a = -spread / 2 + spread * i / (ways - 1);
        const center = Math.abs(i - (ways - 1) / 2) < 1.01;
        pbullets.push({ x: player.x + a * 30, y: player.y - 26, vx: Math.sin(a) * 820, vy: -Math.cos(a) * 820, dmg: center && p >= 3 ? 1.5 : 1.15, r: 5, kind: 'pink', a });
      }
      if (game.shotSfx <= 0) { Audio_.shot(); game.shotSfx = 0.17; }
    }
  } else if (s.id === 'gale') {
    if (p >= 3) {
      while (player.fireT <= 0) {
        player.fireT += 0.12;
        for (const sx of [-18, 18]) pbullets.push({ x: player.x + sx, y: player.y - 10, vx: sx * 3, vy: -900, dmg: 0.9, r: 4, kind: 'needle' });
      }
    }
    if (game.shotSfx <= 0) { Audio_.blip(300 + Math.random() * 40, 0.12, 'sawtooth', 0.03); game.shotSfx = 0.12; }
  } else {
    while (player.fireT <= 0) {
      player.fireT += 0.17;
      const n = [1, 2, 2, 3, 3][p - 1];
      for (let i = 0; i < n; i++) {
        const ox = (i - (n - 1) / 2) * 16;
        pbullets.push({ x: player.x + ox, y: player.y - 26, vx: ox * 2, vy: -640, dmg: 4.5, r: 8, kind: 'shell' });
      }
      if (game.shotSfx <= 0) { Audio_.cannon(); game.shotSfx = 0.17; }
    }
    const mc = [0, 2, 2, 4, 4][p - 1], me = [0, 0.5, 0.4, 0.45, 0.36][p - 1];
    if (mc && player.missileT <= 0) {
      player.missileT = me;
      for (let i = 0; i < mc; i++) {
        const side = i % 2 ? 1 : -1;
        pbullets.push({ x: player.x + side * 22, y: player.y, vx: side * (160 + (i >> 1) * 90), vy: -120, dmg: 2.2, r: 5, kind: 'missile', homing: true, t: 0 });
      }
    }
  }
  for (const w of wingmen) {
    w.fireT -= dt; w.missileT -= dt;
    if (w.fireT <= 0) { w.fireT = 0.14; pbullets.push({ x: w.x, y: w.y - 14, vx: 0, vy: -860, dmg: 0.7, r: 4, kind: 'needle' }); }
    if (w.missileT <= 0) { w.missileT = 0.7; pbullets.push({ x: w.x, y: w.y - 8, vx: w.side * 120, vy: -200, dmg: 2, r: 5, kind: 'missile', homing: true, t: 0 }); }
  }
}

/* 疾風號的雷射光束：穿透同一直線上所有敵機 */
function beamWidth() { return 10 + player.power * 4; }
function updateBeam(dt) {
  if (player.ship.id !== 'gale' || player.dead) return;
  const half = beamWidth() / 2, dps = 24 + player.power * 8;
  for (const e of enemies) {
    if (e.dead || !onScreen(e) || e.y > player.y) continue;
    const rr = e.type === 'boss' ? 62 : e.r * 0.85;
    if (Math.abs(e.x - player.x) < half + rr) {
      damage(e, dps * dt);
      if (Math.random() < dt * 14) spark(player.x + rand(-half, half), e.y + (e.type === 'boss' ? 40 : e.r * 0.6), '170,255,220', 120);
    }
  }
}

function nearestEnemy(x, y) {
  let best = null, bd = Infinity;
  for (const e of enemies) {
    if (e.dead || !onScreen(e) || e.y > y + 40) continue;
    const dd = d2(x, y, e.x, e.y);
    if (dd < bd) { bd = dd; best = e; }
  }
  return best;
}
function updatePBullets(dt) {
  for (const b of pbullets) {
    if (b.homing) {
      b.t += dt;
      if (!b.target || b.target.dead || b.target.gone) b.target = nearestEnemy(b.x, b.y);
      const sp = Math.min(620, Math.hypot(b.vx, b.vy) + 900 * dt);
      let a = Math.atan2(b.vy, b.vx);
      if (b.target && b.t > 0.12) {
        const want = Math.atan2(b.target.y - b.y, b.target.x - b.x);
        let diff = ((want - a + Math.PI * 3) % TAU) - Math.PI;
        a += clamp(diff, -7 * dt, 7 * dt);
      } else if (b.t > 0.12) {
        a += clamp(((-Math.PI / 2 - a + Math.PI * 3) % TAU) - Math.PI, -4 * dt, 4 * dt);
      }
      b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
      if (b.t > 3) b.dead = true;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30) { b.dead = true; continue; }
    for (const e of enemies) {
      if (e.dead || !onScreen(e)) continue;
      const rr = e.type === 'boss' ? 62 : e.r;
      if (d2(b.x, b.y, e.x, e.y) < (rr + b.r) ** 2) {
        damage(e, b.dmg);
        if (Math.random() < 0.4) spark(b.x, b.y, b.kind === 'shell' ? '255,190,90' : '255,200,230', 90);
        b.dead = true;
        break;
      }
    }
  }
  pbullets = pbullets.filter(b => !b.dead);
}

function updateEBullets(dt) {
  for (const b of ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -40 || b.y > H + 40 || b.x < -40 || b.x > W + 40) b.dead = true;
  }
  ebullets = ebullets.filter(b => !b.dead);
}

function damage(e, dmg) {
  if (e.dead) return;
  if (e.type === 'boss' && (e.entering || e.inv > 0)) { e.hitFlash = 0.3; return; }
  e.hp -= dmg;
  e.hitFlash = 1;
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  e.dead = true;
  game.kills++;
  game.score += e.score;
  const boss = e.type === 'boss';
  const big = boss || e.type === 'turret';
  explode(e.x, e.y, boss ? 3 : big ? 1.5 : e.type === 'fighter' || e.type === 'carrier' ? 1 : 0.7, boss ? e.def.glow : hexToRgb(e.pal[0]));
  Audio_.boom(big);
  game.shake = Math.max(game.shake, boss ? 26 : big ? 10 : 3);
  for (let i = 0; i < e.coins; i++) dropItem(e.x + rand(-10, 10), e.y + rand(-10, 10), 'coin');
  if (e.group && groups[e.group]) {
    const g = groups[e.group];
    g.killed++;
    if (g.bonus && g.killed === g.n) {
      game.score += 500;
      dropItem(e.x, e.y, 'P');
      floatText(e.x, e.y - 20, '編隊全滅 +500', '#ffd166');
    }
  }
  if (e.drop === 'carrier') dropItem(e.x, e.y, wingmen.length < 2 ? 'W' : player.power < MAX_POWER ? 'P' : 'B');
  else if (e.drop === 'fighter' && Math.random() < 0.25) dropItem(e.x, e.y, 'P');
  else if (e.drop === 'turret') dropItem(e.x, e.y, Math.random() < 0.7 ? 'P' : 'B');
  if (boss) {
    game.boss = null;
    cancelBullets();
    game.flash = 1; game.flashColor = '255,255,255';
    for (let i = 0; i < 7; i++) {
      parts.push({ kind: 'delayBoom', x: e.x + rand(-90, 90), y: e.y + rand(-50, 50), d: i * 0.18, rgb: e.def.glow });
    }
    for (let i = 0; i < 14; i++) dropItem(e.x + rand(-70, 70), e.y + rand(-30, 30), 'coin');
    Audio_.clear();
  }
}

/* 炸彈：清掉全部敵彈（變成金幣），所有敵機受傷 */
function useBomb() {
  if (game.state !== 'play' || !player || player.dead || player.bombs <= 0 || game.bombCd > 0) return;
  player.bombs--;
  game.bombCd = 1.2;
  player.inv = Math.max(player.inv, 2.4);
  cancelBullets();
  game.flash = 0.9; game.flashColor = '255,220,150'; game.shake = 16;
  parts.push({ kind: 'ring', x: player.x, y: player.y, r: 20, vr: 900, life: 0.8, max: 0.8, rgb: '255,210,120', w: 14 });
  parts.push({ kind: 'ring', x: player.x, y: player.y, r: 10, vr: 600, life: 0.9, max: 0.9, rgb: '255,255,255', w: 6 });
  for (const e of enemies) if (!e.dead && onScreen(e)) damage(e, e.type === 'boss' ? 50 : 40);
  Audio_.bomb();
  syncHud();
}
function cancelBullets() {
  let n = 0;
  for (const b of ebullets) {
    if (n < 50 && b.y > 0 && b.y < H) { items.push({ x: b.x, y: b.y, kind: 'mini', vx: 0, vy: 0, t: 0, magnet: true }); n++; }
    else if (Math.random() < 0.3) spark(b.x, b.y, theme().bullet, 60);
  }
  ebullets = [];
}

/* ---------- 道具 ---------- */
function dropItem(x, y, kind) {
  const it = { x, y, kind, t: 0, vx: rand(-40, 40), vy: kind === 'coin' ? rand(-160, -60) : -70 };
  if (kind === 'coin') it.vx = rand(-70, 70);
  items.push(it);
}
function updateItems(dt) {
  for (const it of items) {
    it.t += dt;
    const near = !player.dead && d2(it.x, it.y, player.x, player.y);
    if (it.kind === 'coin' || it.kind === 'mini') {
      if (it.magnet || (near !== false && near < 110 * 110 && it.t > 0.3)) {
        it.magnet = true;
        if (!player.dead) {
          const a = Math.atan2(player.y - it.y, player.x - it.x), sp = 520 + it.t * 300;
          it.x += Math.cos(a) * sp * dt; it.y += Math.sin(a) * sp * dt;
        }
      } else {
        it.vy = Math.min(150, it.vy + 380 * dt); it.vx *= 0.98;
        it.x += it.vx * dt; it.y += it.vy * dt;
      }
    } else {
      // 能量道具：慢慢飄下，碰到牆會彈回來，靠近時被吸過去
      if (near !== false && near < 80 * 80) {
        const a = Math.atan2(player.y - it.y, player.x - it.x);
        it.x += Math.cos(a) * 400 * dt; it.y += Math.sin(a) * 400 * dt;
      } else {
        it.vy = Math.min(70, it.vy + 120 * dt);
        it.x += it.vx * dt; it.y += it.vy * dt;
        if (it.x < 20 || it.x > W - 20) { it.vx *= -1; it.x = clamp(it.x, 20, W - 20); }
      }
    }
    if (it.y > H + 30) { it.dead = true; continue; }
    if (near !== false && d2(it.x, it.y, player.x, player.y) < 30 * 30) { collectItem(it); it.dead = true; }
  }
  items = items.filter(i => !i.dead);
}
function collectItem(it) {
  if (it.kind === 'coin') { game.score += 10; game.coins++; Audio_.coin(); return; }
  if (it.kind === 'mini') { game.score += 2; return; }
  Audio_.pickup();
  if (it.kind === 'P') {
    if (player.power < MAX_POWER) { player.power++; toast(`火力升級！Lv.${player.power}`, '#ff8cc6'); }
    else { game.score += 1000; toast('火力全滿 +1000', '#ff8cc6'); }
  } else if (it.kind === 'W') {
    if (addWingman()) toast(wingmen.length === 2 ? '三機編隊完成！' : '僚機加入！', '#7cc8f0');
    else { game.score += 1000; toast('僚機全滿 +1000', '#7cc8f0'); }
  } else if (it.kind === 'B') {
    player.bombs = Math.min(9, player.bombs + 1);
    toast('炸彈 +1', '#ffb347');
  }
  syncHud();
}

/* ---------- 粒子特效 ---------- */
function spark(x, y, rgb, spd) {
  if (parts.length > 500) return;
  const a = Math.random() * TAU, v = rand(0.3, 1) * spd;
  parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.25, 0.6), max: 0.6, rgb, s: rand(1.5, 3.2) });
}
function explode(x, y, size, rgb) {
  parts.push({ kind: 'puff', x, y, r: 26 * size, life: 0.45, max: 0.45, rgb });
  parts.push({ kind: 'ring', x, y, r: 6 * size, vr: 220 * size, life: 0.4, max: 0.4, rgb, w: 4 });
  for (let i = 0; i < 10 + size * 10; i++) spark(x, y, i % 3 ? rgb : '255,255,255', 160 * size + 60);
}
function floatText(x, y, text, color) { parts.push({ kind: 'text', x, y, text, color, life: 1.2, max: 1.2 }); }
function updateParts(dt) {
  for (const p of parts) {
    if (p.kind === 'delayBoom') {
      p.d -= dt;
      if (p.d <= 0) { explode(p.x, p.y, 1.6, p.rgb); Audio_.boom(true); game.shake = Math.max(game.shake, 12); p.life = 0; }
      continue;
    }
    p.life -= dt;
    if (p.kind === 'spark') { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; }
    else if (p.kind === 'ring') p.r += p.vr * dt;
    else if (p.kind === 'text') p.y -= 40 * dt;
  }
  parts = parts.filter(p => p.kind === 'delayBoom' ? p.life !== 0 : p.life > 0);
}

/* =========================================================
   主迴圈
   ========================================================= */
function step(dt) {
  game.t += dt; game.stageTime += dt;
  game.shake = Math.max(0, game.shake - dt * 45);
  game.flash = Math.max(0, game.flash - dt * 2.5);
  game.bombCd = Math.max(0, game.bombCd - dt);
  game.hintT = Math.max(0, game.hintT - dt);
  if (game.banner) { game.banner.t -= dt; if (game.banner.t <= 0) game.banner = null; }
  if (game.toast) { game.toast.t -= dt; if (game.toast.t <= 0) game.toast = null; }

  // 保底空投：就算運氣差，也一定撿得到火力或僚機
  if (game.phase === 'waves') {
    game.itemClock -= dt;
    if (game.itemClock <= 0) {
      game.itemClock = rand(20, 26);
      if (player.power < MAX_POWER || wingmen.length < 2) {
        dropItem(rand(60, W - 60), -20, wingmen.length < 2 && (player.power >= 3 || Math.random() < 0.4) ? 'W' : 'P');
      }
    }
  }

  updateBg(dt);
  runStagePhase(dt);
  if (game.state !== 'play') return;
  updatePlayer(dt);
  if (game.state !== 'play') return;
  updateShooting(dt);
  updatePBullets(dt);
  updateBeam(dt);
  updateEnemies(dt);
  updateEBullets(dt);
  updateItems(dt);
  updateParts(dt);
  enemies = enemies.filter(e => !e.dead && !e.gone);
}

let last = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  if (game.state === 'play') {
    let total = dt * TIME_SCALE;
    while (total > 1e-6 && game.state === 'play') { const s = Math.min(total, 1 / 60); step(s); total -= s; }
  }
  if (game.state === 'play' || game.state === 'pause' || game.state === 'result') draw();
}

/* =========================================================
   繪製
   ========================================================= */
function draw() {
  ctx.save();
  if (game.shake > 0) ctx.translate(rand(-1, 1) * game.shake * 0.4, rand(-1, 1) * game.shake * 0.4);
  drawBg();
  drawItems(false);
  drawEnemies();
  drawPBullets();
  drawBeam();
  if (player && !player.dead) {
    const blink = player.inv > 0 && Math.floor(game.t * 14) % 2 === 0;
    for (const w of wingmen) {
      drawGlow(ctx, w.x, w.y, 22, '125,220,255', 0.35);
      drawFighter(ctx, w.x, w.y, 15, WINGMAN, player.bank * 0.6, game.t + w.side);
    }
    if (!blink) {
      drawFighter(ctx, player.x, player.y, 28, player.ship, player.bank, game.t);
      // 判定點：只有中間這一小圈會被打到
      circle(ctx, player.x, player.y, 5.5, 'rgba(255,90,170,.9)');
      circle(ctx, player.x, player.y, 3, '#fff');
    }
  }
  drawItems(true);
  drawEBullets();
  drawParts();
  ctx.restore();
  if (game.flash > 0) {
    ctx.fillStyle = `rgba(${game.flashColor},${Math.min(0.7, game.flash * 0.6)})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawHud();
}

function drawEnemies() {
  for (const e of enemies) {
    if (e.dead || e.t < 0) continue;
    if (e.type === 'boss') { drawBoss(e); continue; }
    const spr = enemySprite(e.type, e.pal);
    const S = spr.size;
    if (e.type === 'carrier') drawGlow(ctx, e.x, e.y, 46, '255,215,110', 0.5 + Math.sin(game.t * 6) * 0.2);
    ctx.drawImage(spr, e.x - S / 2, e.y - S / 2, S, S);
    if (e.hitFlash > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = e.hitFlash * 0.7;
      ctx.drawImage(spr, e.x - S / 2, e.y - S / 2, S, S);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
  }
}

/* 魔王母艦：戰艦外殼＋騎在上面的怪獸塔魔王 */
function drawBoss(e) {
  const b = e.def, s = 52, x = e.x, y = e.y, [main, light, dark] = b.hull;
  drawGlow(ctx, x, y, s * 3.2, b.glow, 0.45);
  poly(ctx, [x - s * 2.3, y - s * 0.2, x - s * 1.2, y + s * 0.75, x + s * 1.2, y + s * 0.75, x + s * 2.3, y - s * 0.2, x + s * 1.3, y - s * 0.65, x - s * 1.3, y - s * 0.65], main);
  poly(ctx, [x - s * 2.0, y - s * 0.25, x + s * 2.0, y - s * 0.25, x + s * 1.75, y + s * 0.05, x - s * 1.75, y + s * 0.05], light);
  for (const dx of [-1.6, -0.85, 0.85, 1.6]) {
    ctx.fillStyle = dark; ctx.fillRect(x + dx * s - s * 0.13, y + s * 0.15, s * 0.26, s * 0.55);
    drawGlow(ctx, x + dx * s, y + s * 0.78, s * 0.35, b.glow, 0.9);
    circle(ctx, x + dx * s, y + s * 0.74, s * 0.1, '#fff8e1');
  }
  drawGlow(ctx, x, y + s * 0.95, s * 0.7, b.glow, 0.8 + Math.sin(game.t * 8) * 0.2);
  const spr = SPRITES[b.sprite];
  const size = H < 760 ? 160 : 196;
  if (spr && spr.ok) {
    ctx.drawImage(spr.img, x - size / 2, y - size * 0.68, size, size);
    if (e.hitFlash > 0) {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = e.hitFlash * 0.45;
      ctx.drawImage(spr.img, x - size / 2, y - size * 0.68, size, size);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
  } else {
    circle(ctx, x, y - s * 0.2, s * 0.85, light);
    ctx.save(); ctx.translate(x, y - s * 0.25); eyes(ctx, s * 1.2, 0); ctx.restore();
  }
  if (e.inv > 0 || e.entering) {
    ctx.strokeStyle = `rgba(255,255,255,${0.25 + Math.sin(game.t * 20) * 0.15})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y - 10, 92, 0, TAU); ctx.stroke();
  }
}

function drawPBullets() {
  for (const b of pbullets) {
    if (b.kind === 'pink') {
      drawGlow(ctx, b.x, b.y, 13, '255,95,174', 0.6);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a || 0);
      ctx.fillStyle = '#ffd1ea'; ctx.beginPath(); ctx.ellipse(0, 0, 3.4, 10, 0, 0, TAU); ctx.fill();
      ctx.restore();
    } else if (b.kind === 'shell') {
      drawGlow(ctx, b.x, b.y, 20, '255,150,60', 0.75);
      circle(ctx, b.x, b.y, 7, '#ffb347'); circle(ctx, b.x, b.y - 1.5, 4, '#fff7e0');
    } else if (b.kind === 'needle') {
      ctx.fillStyle = 'rgba(160,240,255,.95)'; ctx.fillRect(b.x - 1.6, b.y - 9, 3.2, 18);
    } else if (b.kind === 'missile') {
      const a = Math.atan2(b.vy, b.vx);
      ctx.strokeStyle = 'rgba(125,240,200,.45)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - Math.cos(a) * 18, b.y - Math.sin(a) * 18); ctx.stroke();
      circle(ctx, b.x, b.y, 4, '#7cf0c8'); circle(ctx, b.x, b.y, 2, '#fff');
    }
  }
}
function drawBeam() {
  if (!player || player.dead || player.ship.id !== 'gale') return;
  const w = beamWidth(), x = player.x, top = 0, bot = player.y - 28;
  const flick = 1 + Math.sin(game.t * 40) * 0.08;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(60,220,160,.25)'; ctx.fillRect(x - w * 1.3 * flick, top, w * 2.6 * flick, bot - top);
  ctx.fillStyle = 'rgba(125,240,200,.75)'; ctx.fillRect(x - w / 2 * flick, top, w * flick, bot - top);
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(x - w * 0.18, top, w * 0.36, bot - top);
  ctx.globalCompositeOperation = 'source-over';
  drawGlow(ctx, x, bot, w * 1.8, '125,240,200', 0.9);
}
function drawEBullets() {
  const rgb = theme().bullet;
  const orb = bulletSprite('orb', rgb), rice = bulletSprite('rice', rgb);
  for (const b of ebullets) {
    if (b.kind === 'rice') {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx) - Math.PI / 2);
      ctx.drawImage(rice, -9, -15, 18, 30); ctx.restore();
    } else {
      const S = b.r * 4;
      ctx.drawImage(orb, b.x - S / 2, b.y - S / 2, S, S);
    }
  }
}
const ITEM_STYLE = { P: ['#ff5fae', '255,95,174', 'P'], W: ['#4fb3e8', '79,179,232', '僚'], B: ['#ff9f43', '255,159,67', 'B'] };
function drawItems(power) {
  for (const it of items) {
    if (it.kind === 'coin' || it.kind === 'mini') {
      if (power) continue;
      if (it.kind === 'mini') { circle(ctx, it.x, it.y, 3, '#f4c542'); continue; }
      const sq = Math.abs(Math.cos(it.t * 6));
      ctx.save(); ctx.translate(it.x, it.y); ctx.scale(0.35 + sq * 0.65, 1);
      circle(ctx, 0, 0, 7, '#c98a00'); circle(ctx, -0.6, -0.6, 5.8, '#f4c542');
      ctx.fillStyle = '#fff3b0'; ctx.fillRect(-1, -3.5, 2, 7);
      ctx.restore();
    } else {
      if (!power) continue;
      const [fill, rgb, label] = ITEM_STYLE[it.kind];
      const bob = Math.sin(it.t * 5) * 2;
      drawGlow(ctx, it.x, it.y + bob, 30, rgb, 0.55 + Math.sin(it.t * 8) * 0.15);
      circle(ctx, it.x, it.y + bob, 14, '#fff');
      circle(ctx, it.x, it.y + bob, 12, fill);
      ctx.fillStyle = '#fff'; ctx.font = '900 15px system-ui, "PingFang TC", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, it.x, it.y + bob + 1);
    }
  }
}
function drawParts() {
  for (const p of parts) {
    if (p.kind === 'delayBoom') continue;
    const k = clamp(p.life / p.max, 0, 1);
    if (p.kind === 'spark') {
      ctx.globalAlpha = k; ctx.fillStyle = `rgb(${p.rgb})`;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    } else if (p.kind === 'puff') {
      drawGlow(ctx, p.x, p.y, p.r * (1.6 - k * 0.6), p.rgb, k);
    } else if (p.kind === 'ring') {
      ctx.globalAlpha = k; ctx.strokeStyle = `rgb(${p.rgb})`; ctx.lineWidth = p.w * k + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
    } else if (p.kind === 'text') {
      ctx.globalAlpha = k; ctx.fillStyle = p.color; ctx.font = '900 16px system-ui, "PingFang TC", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.text, p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
}

function pill(x, y, w, h) {
  ctx.fillStyle = 'rgba(15,20,60,.72)'; roundRect(ctx, x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.stroke();
}
function drawHud() {
  if (!player) return;
  const font = (w, s) => `${w} ${s}px system-ui, -apple-system, "PingFang TC", sans-serif`;
  ctx.textBaseline = 'alphabetic';
  // 左上：關卡與分數
  pill(12, 12, 176, 54);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#a9b4ff'; ctx.font = font(800, 11);
  ctx.fillText(`STAGE ${game.stage + 1} · ${STAGES[game.stage].name}`, 24, 31);
  ctx.fillStyle = '#fff'; ctx.font = font(900, 21);
  ctx.fillText(game.score.toLocaleString(), 24, 56);
  // 右上：殘機（避開暫停按鈕）
  const right = W - (42 + 12 + 8) / viewScale;
  const lives = Math.max(0, player.lives);
  const lw = lives > 5 ? 74 : 20 + lives * 22;
  pill(right - lw, 12, lw, 42);
  if (lives > 5) {
    drawFighter(ctx, right - lw + 22, 33, 9, player.ship, 0, 0);
    ctx.fillStyle = '#fff'; ctx.font = font(900, 15); ctx.fillText(`×${lives}`, right - lw + 36, 39);
  } else {
    for (let i = 0; i < lives; i++) drawFighter(ctx, right - lw + 21 + i * 22, 33, 9, player.ship, 0, 0);
  }
  // 魔王血條
  const bss = game.boss;
  if (bss) {
    ctx.globalAlpha = 0.7; pill(28, 76, W - 56, 40); ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.font = font(800, 12); ctx.textAlign = 'left';
    ctx.fillText(`👑 BOSS · ${bss.def.name}`, 42, 92);
    ctx.textAlign = 'right';
    ctx.fillText(`${Math.ceil(clamp(bss.hp / bss.maxHp, 0, 1) * 100)}%`, W - 42, 92);
    ctx.fillStyle = 'rgba(255,255,255,.15)'; roundRect(ctx, 42, 99, W - 84, 8, 4); ctx.fill();
    const k = clamp(bss.hp / bss.maxHp, 0, 1);
    if (k > 0) {
      const gr = ctx.createLinearGradient(42, 0, W - 42, 0);
      gr.addColorStop(0, '#ff4d6d'); gr.addColorStop(1, '#ffb347');
      ctx.fillStyle = gr; roundRect(ctx, 42, 99, Math.max(8, (W - 84) * k), 8, 4); ctx.fill();
    }
    for (const m of [0.33, 0.66]) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(42 + (W - 84) * m - 1, 98, 2, 10); }
  }
  // 左下：武器與僚機
  const by = H - 70;
  pill(12, by, 186, 58);
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = font(800, 12.5);
  ctx.fillText(`${player.ship.name} · ${player.ship.weapon} Lv.${player.power}`, 24, by + 20);
  for (let i = 0; i < MAX_POWER; i++) {
    ctx.fillStyle = i < player.power ? '#ff5fae' : 'rgba(255,255,255,.2)';
    roundRect(ctx, 24 + i * 18, by + 27, 15, 6, 3); ctx.fill();
  }
  ctx.fillStyle = '#7cf0c8'; ctx.font = font(800, 12);
  ctx.fillText(`僚機 ${wingmen.length}/2${wingmen.length === 2 ? '・三機編隊！' : ''}`, 24, by + 50);
  // 中央：關卡標題、提示
  ctx.textAlign = 'center';
  if (game.banner) {
    const bn = game.banner, k = bn.t / bn.max;
    const a = Math.min(1, (1 - k) * 6, k * 5);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(10,14,40,.55)'; ctx.fillRect(0, H * 0.4 - 46, W, 92);
    ctx.fillStyle = bn.color; ctx.font = font(900, 36); ctx.fillText(bn.title, W / 2, H * 0.4);
    ctx.fillStyle = '#fff'; ctx.font = font(800, 16); ctx.fillText(bn.sub, W / 2, H * 0.4 + 30);
    ctx.globalAlpha = 1;
  }
  if (game.toast) {
    ctx.globalAlpha = Math.min(1, game.toast.t * 3);
    ctx.fillStyle = game.toast.color; ctx.font = font(900, 20);
    ctx.fillText(game.toast.text, W / 2, H * 0.58);
    ctx.globalAlpha = 1;
  }
  if (game.hintT > 0 && game.state === 'play') {
    ctx.globalAlpha = Math.min(1, game.hintT);
    ctx.fillStyle = 'rgba(255,255,255,.16)'; roundRect(ctx, W / 2 - 112, H - 132, 224, 32, 16); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = font(800, 13); ctx.fillText('👆 手指拖曳移動・自動射擊', W / 2, H - 111);
    ctx.globalAlpha = 1;
  }
}

/* =========================================================
   HUD 按鈕
   ========================================================= */
function syncHud() {
  if (!player) return;
  el('bombN').textContent = player.bombs;
  el('btnBomb').disabled = player.bombs <= 0;
}

/* =========================================================
   關卡解鎖進度（每位小孩分開存；第一次會沿用舊的共用進度）
   ========================================================= */
const LEGACY_PROG_KEY = 'ember_corridor_progress';
const PROG_KEY = USER_ID ? `${LEGACY_PROG_KEY}_${USER_ID}` : LEGACY_PROG_KEY;
const SHIP_KEY = `ember_corridor_ship_${USER_ID || 'guest'}`;
function loadProgress() {
  try {
    let raw = localStorage.getItem(PROG_KEY);
    if (raw === null && PROG_KEY !== LEGACY_PROG_KEY) raw = localStorage.getItem(LEGACY_PROG_KEY);
    const v = parseInt(raw || '0', 10);
    return clamp(Number.isFinite(v) ? v : 0, 0, STAGES.length - 1);
  } catch { return 0; }
}
function saveProgress(v) {
  if (v <= loadProgress()) return;
  try { localStorage.setItem(PROG_KEY, String(clamp(v, 0, STAGES.length - 1))); } catch {}
}

function reportSettlement(stars, score, kills) {
  if (settlementReported || stars <= 0) return;
  settlementReported = true;
  const txId = `ember-corridor-${Date.now()}-${Math.floor(Math.random() * 999999)}`;
  const payload = {
    type: 'QUESTMON_EARN_STARS',
    txId,
    amount: stars,
    gameId: 'ember_corridor',
    description: `銀河守衛結算：得分 ${score.toLocaleString()}，擊墜 ${kills} 架`,
  };
  try { localStorage.setItem('ember_corridor_last_settlement', JSON.stringify(payload)); } catch {}
  try { window.parent?.postMessage(payload, '*'); } catch {}
}

/* =========================================================
   場景切換
   ========================================================= */
function show(id) {
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('on'));
  el(id).classList.add('on');
}
function renderCards() {
  const box = el('cards');
  box.innerHTML = '';
  SHIPS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'card' + (i === shipIndex ? ' sel' : '');
    b.innerHTML = `<canvas width="220" height="220"></canvas><div><b>${s.name}</b><span class="role" style="background:${s.roleColor}">${s.role}</span>` +
      `<small>${s.weapon}：${s.desc}</small><div class="stats">` +
      STAT_LABELS.map((n, k) => `<span>${n}</span><span class="bar">${[0, 1, 2, 3, 4].map(j => `<i class="${j < s.stats[k] ? '' : 'off'}"></i>`).join('')}</span>`).join('') +
      `</div></div>`;
    b.onclick = () => {
      shipIndex = i;
      try { localStorage.setItem(SHIP_KEY, String(i)); } catch {}
      Audio_.init(); Audio_.resume(); Audio_.ui();
      renderCards();
    };
    box.appendChild(b);
    const g = b.querySelector('canvas').getContext('2d');
    drawGlow(g, 110, 110, 90, hexToRgb(s.body), 0.35);
    drawFighter(g, 110, 100, 62, s, 0, 0.3);
  });
}
function renderStagePick() {
  const unlocked = loadProgress();
  startStage = clamp(startStage, 0, unlocked);
  const seg = el('stageSeg');
  seg.innerHTML = '';
  STAGES.forEach((s, i) => {
    const b = document.createElement('button');
    const open = i <= unlocked;
    b.innerHTML = open ? `${i + 1} ${s.name}<small>${s.boss.name}</small>` : `${i + 1} 🔒<small>尚未解鎖</small>`;
    b.disabled = !open;
    if (i === startStage) b.classList.add('on');
    b.onclick = () => { startStage = i; Audio_.ui(); renderStagePick(); };
    seg.appendChild(b);
  });
  el('stageNote').textContent = unlocked >= STAGES.length - 1
    ? `全部星域都解鎖了！從第 ${startStage + 1} 關「${STAGES[startStage].name}」出發：${STAGES[startStage].brief}`
    : `打倒魔王就能解鎖下一關（已解鎖 ${unlocked + 1} / ${STAGES.length}）。${STAGES[startStage].brief}`;
}
function goHangar() {
  game.state = 'hangar';
  Audio_.stopBgm();
  el('ovResult').classList.remove('on'); el('ovPause').classList.remove('on');
  show('scene-hangar');
  renderCards(); renderStagePick();
}
function startGame() {
  Audio_.init(); Audio_.resume(); Audio_.startBgm();
  show('scene-game');
  fit();
  el('ovResult').classList.remove('on');
  el('ovPause').classList.remove('on');
  resetRun();
  game.state = 'play';
  last = performance.now();
}
function togglePause() {
  if (game.state === 'play') { game.state = 'pause'; el('ovPause').classList.add('on'); }
  else if (game.state === 'pause') { game.state = 'play'; el('ovPause').classList.remove('on'); last = performance.now(); }
}
function endRun(win) {
  game.state = 'result';
  Audio_.stopBgm();
  const cleared = win ? STAGES.length : game.stage;   // 全破 = 6 關
  el('resTitle').textContent = win ? '🏆 銀河守衛成功！' : '戰機被擊落了';
  el('resSub').textContent = win
    ? '打倒彩虹龍王，六個星域全部恢復和平！'
    : '別灰心！記得撿「P」升級火力、撿「僚」組成三機編隊，危險時按炸彈。';
  el('resScore').textContent = game.score.toLocaleString();
  el('resKills').textContent = game.kills;
  el('resWeap').textContent = `${player.ship.name} Lv.${player.power}`;
  el('resReach').textContent = win ? '全破！' : `第 ${game.stage + 1} 關`;
  const starsEarned = Math.max(1, Math.min(60,
    Math.floor(game.score / 1600) + cleared * 4 + (win ? 12 : 0) + Math.floor(game.kills / 12)));
  el('resStars').textContent = `+${starsEarned} ⭐`;
  reportSettlement(starsEarned, game.score, game.kills);
  el('ovResult').classList.add('on');
}

function setMuted(m) {
  Audio_.muted = m;
  el('muteBtn').textContent = m ? '🔇' : '🔊';
  el('muteBtn2').textContent = m ? '音效：關' : '音效：開';
}
el('muteBtn').onclick = () => { Audio_.init(); setMuted(!Audio_.muted); };
el('muteBtn2').onclick = () => setMuted(!Audio_.muted);
el('launch').onclick = () => startGame();
el('retryBtn').onclick = () => startGame();
el('toHangarBtn').onclick = () => { Audio_.ui(); goHangar(); };
el('resumeBtn').onclick = () => togglePause();
el('quitBtn').onclick = () => goHangar();
el('btnPause').onclick = () => togglePause();
el('btnBomb').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); useBomb(); });
document.querySelectorAll('#modeSeg button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#modeSeg button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); mode = b.dataset.mode;
    el('modeNote').textContent = MODES[mode].note;
    Audio_.ui();
  };
});
document.addEventListener('visibilitychange', () => { if (document.hidden && game.state === 'play') togglePause(); });

function fit() {
  const vw = innerWidth, vh = innerHeight;
  H = Math.round(clamp(W * vh / vw, 640, 1040));
  viewScale = Math.min(vw / W, vh / H);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  stageBox.style.width = W * viewScale + 'px';
  stageBox.style.height = H * viewScale + 'px';
  cv.width = Math.round(W * viewScale * dpr);
  cv.height = Math.round(H * viewScale * dpr);
  ctx.setTransform(viewScale * dpr, 0, 0, viewScale * dpr, 0, 0);
  bgCanvas = null;
  if (player) player.y = clamp(player.y, 60, H - 34);
}
addEventListener('resize', fit);

/* 測試用掛勾：自動測試可以直接跳關、無敵 */
window.__stg = {
  get state() { return game.state; }, game,
  get player() { return player; }, get enemies() { return enemies; }, get ebullets() { return ebullets; }, get wingmen() { return wingmen; },
  start(stage, ship, md) { startStage = stage || 0; shipIndex = ship || 0; mode = md || 'standard'; startGame(); },
  skipWaves() { queue.forEach(q => { q.done = true; }); game.stageTime = 999; enemies = enemies.filter(e => e.type === 'boss'); },
  god(on) { godMode = !!on; },
  STAGES, SHIPS
};

try { const v = parseInt(localStorage.getItem(SHIP_KEY) || '0', 10); if (v >= 0 && v < SHIPS.length) shipIndex = v; } catch {}
el('modeNote').textContent = MODES[mode].note;
fit();
goHangar();
requestAnimationFrame(loop);
</script>
</body>
</html>
