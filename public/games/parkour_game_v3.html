<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>方塊衝刺 · 怪獸塔大冒險</title>
<style>
  :root {
    --ink: #211d1d; --muted: #6e645d; --paper: rgba(255, 255, 255, 0.94); --line: rgba(33, 29, 29, 0.12);
    --grass: #7cbf4a; --grass-soft: #e6f2d8; --coral: #db3a34; --gold: #f4c542;
    --shadow: 0 8px 22px rgba(33, 29, 29, 0.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6f5; color: var(--ink);
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .pill { position: absolute; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-weight: 800; pointer-events: auto; }
  .hud-tl { top: 12px; left: 12px; }
  .hud-tl b { display: block; font-size: 15px; }
  .hud-tl small { font-size: 11px; color: var(--muted); font-weight: 700; }
  .tag { padding: 2px 6px; border-radius: 6px; background: var(--grass); color: #fff; font-size: 10px; vertical-align: 2px; }
  .hud-tr { top: 12px; right: 12px; gap: 12px; font-size: 15px; }
  .hud-tr span { display: flex; align-items: center; gap: 4px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 10px; background: #f1ece6; display: grid; place-items: center; font-size: 15px; }
  .coin-ico { width: 16px; height: 16px; border-radius: 50%; display: inline-block; flex: none;
    background: radial-gradient(circle at 35% 35%, #ffe58a, #f4c542 55%, #c98a00); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55); }
  .prog { top: 20px; left: 50%; transform: translateX(-50%); width: min(420px, 34vw); height: 14px; padding: 0; border-radius: 999px; background: rgba(255, 255, 255, 0.78); pointer-events: none; }
  .prog .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, #a6d96a, #7cbf4a); }
  .prog .mk { position: absolute; top: -8px; font-size: 15px; transform: translateX(-50%); }
  .prog .me { position: absolute; top: -9px; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: #fff; border: 3px solid var(--coral); display: grid; place-items: center; font-size: 13px; }
  .skill { left: 12px; bottom: 12px; padding: 8px 14px 8px 8px; text-align: left; }
  .skill .ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; border: 3px solid var(--grass); background: var(--grass-soft); position: relative; overflow: hidden; }
  .skill .ico i { position: absolute; inset: auto 0 0 0; background: rgba(33, 29, 29, 0.35); }
  .skill b { display: block; font-size: 13px; }
  .skill small { font-size: 11px; font-weight: 800; color: #2f7d32; }
  .skill.cooling small { color: var(--muted); }
  .touch-hint { position: absolute; bottom: 12px; padding: 8px 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.55); font-weight: 900; font-size: 12px; border: 2px dashed rgba(33, 29, 29, 0.18); pointer-events: none; transition: opacity 0.6s; }
  .touch-hint { left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .banner { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); padding: 8px 18px; border-radius: 999px; font-weight: 900; font-size: 15px; white-space: nowrap; box-shadow: var(--shadow); pointer-events: none; transition: opacity 0.3s, transform 0.3s; }
  .banner.warn { background: var(--coral); color: #fff; }
  .banner.info { background: #fff8d6; color: #7a5a00; }
  .banner.off { opacity: 0; transform: translate(-50%, -8px); }
  #countdown { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: min(22vw, 160px); font-weight: 900; color: #fff; text-shadow: 0 6px 0 rgba(33, 29, 29, 0.2), 0 12px 30px rgba(33, 29, 29, 0.25); }

  /* ---------- 面板 ---------- */
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(33, 29, 29, 0.25); backdrop-filter: blur(4px); z-index: 10; }
  .panel { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: #fffdf7; border-radius: 26px; box-shadow: 0 18px 50px rgba(33, 29, 29, 0.25); padding: 22px; text-align: center; }
  .panel h2 { margin: 4px 0 6px; font-size: 26px; font-weight: 900; }
  .panel p { margin: 0 0 12px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .kicker { font-size: 11px; font-weight: 900; letter-spacing: 0.16em; color: var(--grass); margin: 0; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .btn { min-height: 46px; padding: 0 20px; border-radius: 14px; font-weight: 900; font-size: 15px; background: #f1ece6; }
  .btn.primary { background: linear-gradient(180deg, #ef5a52, #c62e28); color: #fff; box-shadow: 0 5px 0 #8f1f1b; }
  .btn.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #8f1f1b; }
  .btn.green { background: linear-gradient(180deg, #8fd35e, #5fae3a); color: #fff; box-shadow: 0 5px 0 #3f7f2a; }

  /* 選關畫面 */
  #menu .panel { width: min(760px, 100%); text-align: left; padding: 20px 22px 18px; }
  .title { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .title .logo { width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(180deg, #a6d96a, #5fae3a); display: grid; place-items: center; font-size: 30px; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.12); flex: none; }
  .title h1 { margin: 0; font-size: 24px; font-weight: 900; }
  .title small { color: var(--muted); font-weight: 700; }
  .zones { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
  .zone { flex: none; padding: 8px 12px; border-radius: 12px; background: #f1ece6; font-weight: 800; font-size: 13px; color: var(--muted); }
  .zone.on { background: var(--grass); color: #fff; }
  .zone[disabled] { opacity: 0.55; cursor: not-allowed; }
  .stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stage { position: relative; text-align: left; padding: 12px; border-radius: 18px; background: #fff; border: 3px solid #eee6dc; min-height: 108px; transition: transform 0.15s; }
  .stage:hover:not([disabled]) { transform: translateY(-2px); }
  .stage.sel { border-color: var(--grass); background: var(--grass-soft); }
  .stage[disabled] { opacity: 0.55; cursor: not-allowed; }
  .stage .no { font-weight: 900; font-size: 12px; color: var(--grass); }
  .stage b { display: block; font-size: 16px; margin: 2px 0; }
  .stage small { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; }
  .stage .stars { margin-top: 6px; font-size: 16px; letter-spacing: 2px; color: #e0a23a; }
  .stage .lock { position: absolute; top: 10px; right: 10px; font-size: 18px; }
  .sub { font-size: 12px; font-weight: 900; color: var(--muted); letter-spacing: 0.1em; margin: 0 0 6px; }
  .pals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .pal { padding: 8px; border-radius: 16px; background: #fff; border: 3px solid #eee6dc; text-align: center; }
  .pal.sel { border-color: var(--grass); background: var(--grass-soft); }
  .pal canvas { position: static; width: 54px; height: 54px; margin: 0 auto; display: block; }
  .pal b { display: block; font-size: 13px; }
  .pal small { display: block; font-size: 11px; color: var(--muted); line-height: 1.35; }
  .menu-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .menu-foot .hint { font-size: 12px; color: var(--muted); }

  /* 過關 */
  .big-stars { font-size: 46px; letter-spacing: 6px; margin: 4px 0 8px; }
  .big-stars span { display: inline-block; opacity: 0.18; filter: grayscale(1); transform: scale(0.7); transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .big-stars span.on { opacity: 1; filter: none; transform: scale(1); }
  .checks { display: grid; gap: 6px; text-align: left; max-width: 320px; margin: 0 auto 10px; font-size: 14px; font-weight: 800; }
  .checks div { padding: 8px 12px; border-radius: 12px; background: #f6f1ea; display: flex; justify-content: space-between; }
  .checks .ok { background: var(--grass-soft); color: #2f6a1f; }
  .reward { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: #fff3c4; color: #7a5a00; font-weight: 900; }

  #rotate-tip { position: fixed; left: 12px; right: 12px; bottom: 80px; padding: 10px 14px; border-radius: 14px; background: #fff8d6; color: #7a5a00; font-weight: 800; font-size: 13px; text-align: center; box-shadow: var(--shadow); z-index: 5; }

  @media (max-height: 500px), (max-width: 720px) {
    .pill { padding: 6px 10px; }
    .hud-tl b { font-size: 13px; }
    .hud-tl small { display: none; }
    .hud-tr { gap: 8px; font-size: 13px; }
    .prog { top: 54px; width: 46vw; }
    .skill .ico { width: 38px; height: 38px; font-size: 22px; }
    .banner { top: auto; bottom: 62px; font-size: 12px; padding: 6px 14px; }
    .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stage { min-height: 96px; padding: 10px; }
    .stage b { font-size: 14px; }
    .pals { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .pal small { display: none; }
    .panel { padding: 16px; }
    #menu .panel { padding: 14px 16px; }
    .title .logo { width: 44px; height: 44px; font-size: 24px; }
    .title h1 { font-size: 20px; }
  }
  /* 手機橫放：選關畫面要一頁放得下，開始按鈕固定在底部 */
  @media (max-height: 500px) {
    .overlay { padding: 8px; }
    .panel { max-height: calc(100vh - 16px); }
    .title { margin-bottom: 6px; }
    .title small { display: none; }
    .zones { margin-bottom: 8px; }
    .zone { padding: 6px 10px; font-size: 12px; }
    .stages { gap: 8px; margin-bottom: 8px; }
    .stage { min-height: 0; padding: 8px 10px; border-width: 2px; }
    .stage small { display: none; }
    .stage .stars { margin-top: 2px; font-size: 14px; }
    .sub { margin-bottom: 4px; }
    .pals { gap: 6px; margin-bottom: 6px; }
    .pal { padding: 4px; border-width: 2px; }
    .pal canvas { width: 38px; height: 38px; }
    .pal b { font-size: 12px; }
    .menu-foot { position: sticky; bottom: -14px; background: #fffdf7; padding: 6px 0 2px; }
    .menu-foot .hint { display: none; }
    .menu-foot > span:last-child { width: 100%; }
    .menu-foot .btn.primary { flex: 1; }
    .big-stars { font-size: 34px; margin: 0 0 4px; }
    .checks { gap: 4px; }
    .checks div { padding: 5px 10px; }
    .panel h2 { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="pill hud-tl"><span><b id="hud-title">方塊衝刺</b><small id="hud-sub">🌿 晨霧草原</small></span></div>
  <div class="pill prog" id="prog"></div>
  <div class="pill hud-tr">
    <span id="hud-hearts">❤️❤️❤️</span>
    <span><i class="coin-ico"></i><b id="hud-coins">0/0</b></span>
    <span>🥚<b id="hud-egg">0/1</b></span>
    <button class="icon-btn" id="pause-btn" aria-label="暫停">⏸</button>
  </div>
  <button class="pill skill" id="skill-btn" aria-label="夥伴技能">
    <span class="ico" id="skill-ico"></span>
    <span><b id="skill-name"></b><small id="skill-state"></small></span>
  </button>
  <div class="touch-hint" id="touch-hint">👆 點一下：跳　👆👆 點兩下：跳更高　👇 往下滑：趴下</div>
  <div class="banner off" id="banner"></div>
</div>
<div id="countdown" class="hidden"></div>
<div id="rotate-tip" class="hidden">📱 把手機轉成橫的，玩起來更順喔！</div>

<!-- 選關 -->
<div class="overlay" id="menu">
  <div class="panel">
    <div class="title">
      <div class="logo">🏃</div>
      <div><h1>方塊衝刺 · 怪獸塔大冒險</h1><small>選一個區域和關卡，帶一隻夥伴一起衝！</small></div>
    </div>
    <div class="zones" id="zones"></div>
    <div class="stages" id="stages"></div>
    <p class="sub">選一隻夥伴</p>
    <div class="pals" id="pals"></div>
    <div class="menu-foot">
      <span class="hint" id="menu-hint">⌨️ 空白鍵／↑ 跳（按住更高），↓ 趴下滑行，E 夥伴技能，P 暫停</span>
      <span style="display:flex;gap:8px">
        <button class="btn" id="sound-btn">🔊 音效開</button>
        <button class="btn primary" id="start-btn">開始衝刺 ▶</button>
      </span>
    </div>
  </div>
</div>

<!-- 暫停 -->
<div class="overlay hidden" id="pause">
  <div class="panel">
    <p class="kicker">PAUSED</p>
    <h2>休息一下</h2>
    <div class="btns">
      <button class="btn primary" data-act="resume">繼續 ▶</button>
      <button class="btn" data-act="restart">重新開始</button>
      <button class="btn" data-act="menu">回選關</button>
    </div>
  </div>
</div>

<!-- 失敗 -->
<div class="overlay hidden" id="over">
  <div class="panel">
    <p class="kicker" style="color:var(--coral)">OOPS</p>
    <h2>愛心用完了</h2>
    <p id="over-text">沒關係，從上一個檢查點再試一次！</p>
    <div class="btns">
      <button class="btn green" data-act="checkpoint">🚩 從檢查點再試（愛心補滿）</button>
      <button class="btn" data-act="restart">重新開始</button>
      <button class="btn" data-act="menu">回選關</button>
    </div>
  </div>
</div>

<!-- 過關 -->
<div class="overlay hidden" id="clear">
  <div class="panel">
    <p class="kicker">STAGE CLEAR</p>
    <h2 id="clear-title">過關！</h2>
    <div class="big-stars" id="clear-stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="checks" id="clear-checks"></div>
    <div id="clear-reward"></div>
    <div class="btns">
      <button class="btn primary" data-act="next" id="next-btn">下一關 ▶</button>
      <button class="btn" data-act="restart">再玩一次</button>
      <button class="btn" data-act="menu">回選關</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* =========================================================
 * 方塊衝刺 · 怪獸塔大冒險（第一版：晨霧草原 3 關）
 * 2D 橫向卷軸；畫面風格取自怪獸塔 V4。
 * 關卡用文字地圖拼接（每個字元一格），方便之後增修。
 * ========================================================= */

const params = new URLSearchParams(location.search);
const USER_ID = params.get('userId') || '';
const DEBUG = params.has('debug');
const TIME_SCALE = Math.max(1, Math.min(4, Number(params.get('ts')) || 1));
// 平板、手機（主要靠手指操作）顯示觸控說明
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const userKey = (base) => (USER_ID ? `${base}_${USER_ID}` : base);
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 無法儲存就只在這次有效 */ } },
};

/* ---------- 世界常數（單位：格、秒） ---------- */
const ROWS = 10;          // 地圖高度
const GROUND_ROW = 8;     // 地面頂端所在列
const G = 38;             // 重力
const JUMP_V = 10.5;      // 一段跳
const DJUMP_V = 9.2;      // 二段跳
const HOLD_TIME = 0.22;   // 按住加高的時間
const SPRING_V = 16.5;    // 蘑菇彈跳
const CLIMB_V = 4.4;      // 爬梯速度
const STAND_H = 1.15, SLIDE_H = 0.6, PLAYER_W = 0.6;

/* ---------- 調色盤（怪獸塔 V4 草原區） ---------- */
const PAL = {
  skyTop: '#9fd8f0', skyBot: '#e6f6fb', chaseTop: '#f6cf9a', chaseBot: '#fdeccf',
  tileA: '#a6d96a', tileB: '#7cbf4a', side: '#8f8778', sideDark: '#6f685c', grass: '#5f9e3a',
  stone: '#b9b3a6', stoneDark: '#9b9486', roof: '#b4483a', far: '#cfe8b0', mid: '#9fcf73', mid2: '#86bd5b',
  coin: '#f4c542', coinDark: '#c98a00', wood: '#a8743f', woodLight: '#d9a86a',
};

/* =========================================================
 * 關卡片段：10 列（第 8、9 列是地面）。
 *   #  地面方塊（實心）        =  草地平台（可從下方穿過）
 *   H  梯子（跳起來抓住往上爬） o  金幣        E  怪獸蛋（每關 1 顆）
 *   m  史萊姆（踩頭打倒）       ^  刺刺草叢    L  木頭橫桿（要滑過去）
 *   M  彈跳蘑菇                 C  檢查點      F  終點       P  起點
 *   s / t  蛇頭 / 蛇尾（同一片段內依序配對，碰到蛇頭會滑到蛇尾）
 *   i  教學告示牌（文字在關卡的 signs 依序填入）

const SAVE_KEY = userKey('parkour_v4_save');
function loadSave() {
  const saved = store.get(SAVE_KEY, null);
  if (saved && typeof saved.unlocked === 'number') return { best: {}, companion: 'slime', ...saved };
  // 從舊版（六大主題）換算：舊版解鎖到第 L 關 → 新版解鎖對應關卡
  const oldUnlock = parseInt(localStorage.getItem(userKey('parkour_v3_unlock')) || '1', 10) || 1;
  const unlocked = Math.min(STAGES.length, Math.round((oldUnlock - 1) * 2.5) + 1);
  return { unlocked, best: {}, companion: 'slime' };
}

/* =========================================================
 * 關卡建構：把片段橫向拼起來，再把物件抽出來
 * ========================================================= */
function buildLevel(stage) {
  const rows = Array.from({ length: ROWS }, () => '');
  const colChunk = [];
  for (const name of stage.chunks) {
    const chunk = CHUNKS[name];
    if (!chunk) throw new Error(`unknown chunk ${name}`);
    const w = Math.max(...chunk.map((r) => r.length));
    for (let r = 0; r < ROWS; r++) rows[r] += (chunk[r] || '').padEnd(w, '.');
    for (let i = 0; i < w; i++) colChunk.push(name);
  }
  const grid = rows.map((r) => r.split(''));
  const width = rows[0].length;
  const lv = {
    grid, width, coins: [], eggs: [], slimes: [], bushes: [], logs: [], springs: [], checkpoints: [], signs: [], snakes: [],
    icicles: [], geysers: [], movers: [], fans: [], switches: [], doors: [], crumble: new Map(),
    start: { c: 2, r: 7 }, finishCol: width - 6,
  };
  const heads = [], tails = [], signUsed = new Set();
  const KEEP = '#=H~ckKDnN.';
  for (let c = 0; c < width; c++) {
    for (let r = 0; r < ROWS; r++) {
      const ch = grid[r][c];
      if (KEEP.includes(ch)) continue;
      grid[r][c] = '.';
      if (ch === 'o') lv.coins.push({ x: c + 0.5, y: r + 0.5, taken: false });
      else if (ch === 'E') lv.eggs.push({ x: c + 0.5, y: r + 0.5, taken: false });
      else if (ch === 'm') lv.slimes.push({ home: c + 0.5, x: c + 0.5, y: r + 1, dir: -1, alive: true, squash: 0 });
      else if (ch === '^') lv.bushes.push({ c, r, alive: true });
      else if (ch === 'L') lv.logs.push({ c, r });
      else if (ch === 'M') lv.springs.push({ c, r, boing: 0 });
      else if (ch === 'C') lv.checkpoints.push({ c, r, on: false });
      else if (ch === 'F') lv.finishCol = c;
      else if (ch === 'P') lv.start = { c, r };
      else if (ch === 's') heads.push({ c, r });
      else if (ch === 't') tails.push({ c, r });
      else if (ch === 'v') lv.icicles.push({ c, r, state: 'idle', y: r + 0.15, vy: 0, t: 0 });
      else if (ch === 'g') lv.geysers.push({ c, r, off: (c * 0.37) % 2.2 });
      else if (ch === 'x') lv.switches.push({ c, r, pressed: false });
      else if (ch === 'w') lv.fans.push({ c, r });
      else if (ch === 'b' || ch === 'u') {
        // 連續的 b / u 合成一塊移動平台（只在最左邊那格建立）
        if (rows[r][c - 1] === ch) continue;
        let w = 1; while (rows[r][c + w] === ch) w++;
        lv.movers.push(ch === 'b'
          ? { axis: 'x', x0: c, y0: r, w, amp: 1.2, period: 3.4, phase: c * 0.7, x: c, y: r, dx: 0, dy: 0 }
          : { axis: 'y', x0: c, y0: r, w, amp: 3, period: 3.8, phase: c * 0.5, x: c, y: r, dx: 0, dy: 0 });
      }
      else if (ch === 'i') {
        const name = colChunk[c], sg = stage.signs && stage.signs[name];
        if (sg && !signUsed.has(name)) { signUsed.add(name); lv.signs.push({ c, r, text: IS_TOUCH ? sg.touch : sg.key }); }
      }
    }
  }
  // 石門：同一欄連續的 D 是一道門
  for (let c = 0; c < width; c++) {
    let rs = [];

  const c0 = Math.max(0, Math.floor(cam.x) - 1), c1 = Math.min(level.width - 1, Math.ceil(cam.x + W / T) + 1);
  for (let c = c0; c <= c1; c++) if (!isSolidStatic(c, GROUND_ROW)) drawFluid(c);
  for (let c = c0; c <= c1; c++) {
    for (let r = 0; r < ROWS; r++) {
      const ch = cell(c, r);
      if (ch === '#' || ch === '~' || ch === 'k' || ch === 'K') drawTile(sx(c), sy(r), c, !isSolidStatic(c, r - 1), false, ch);

  }
  for (let c = c0; c <= c1; c++) {
    for (let r = 0; r < ROWS; r++) {

      const x = sx(c) + T * 0.2, y = sy(r), w = T * 0.6;
      ctx.fillStyle = PAL.wood; ctx.fillRect(x, y, T * 0.12, T + 1); ctx.fillRect(x + w - T * 0.12, y, T * 0.12, T + 1);

function slimeBody(x, y, s, color, dark, angry, squash = 0) {

  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(x, y + 2, s * 0.55, s * 0.12, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#7f1d1d'; ctx.beginPath(); ctx.ellipse(x - s * 0.02, ey + s * 0.16, s * 0.14, s * 0.08, 0, 0, Math.PI); ctx.fill();
    tri([x - s * 0.12, ey + s * 0.16], [x - s * 0.06, ey + s * 0.16], [x - s * 0.09, ey + s * 0.23], '#fff');
    tri([x + s * 0.04, ey + s * 0.16], [x + s * 0.1, ey + s * 0.16], [x + s * 0.07, ey + s * 0.23], '#fff');

    for (const dx of [-0.22, 0, 0.22]) tri([x + (dx - 0.12) * T, y], [x + (dx + 0.12) * T, y], [x + dx * T, y - T * (dx === 0 ? 0.65 : 0.45)], '#bfe7f6');
    return;
  }
  tri([x - T * 0.18 + shake, top], [x + T * 0.18 + shake, top], [x + shake, top + T * 0.8], '#bfe7f6');
  tri([x + shake, top], [x + T * 0.18 + shake, top], [x + shake, top + T * 0.8], '#8fd0ea');

    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(x, y, s * 0.4, s * 0.1, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#5b5f75'; ctx.fillRect(x - s * 0.3, by + s * 0.12, s * 0.6, s * 0.1);
    circle(x - s * 0.08, by - s * 0.05, s * 0.07, '#ef4444'); circle(x + s * 0.14, by - s * 0.05, s * 0.07, '#ef4444');
    ctx.strokeStyle = '#5b5f75'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, by - s * 0.4); ctx.lineTo(x, by - s * 0.6); ctx.stroke();
    ctx.save(); ctx.translate(x, by - s * 0.6); ctx.scale(1, 0.25); ctx.rotate(S.time * 20); ctx.fillStyle = '#9ca2ec'; ctx.fillRect(-s * 0.35, -s * 0.05, s * 0.7, s * 0.1); ctx.restore();
    return;
  }
  // ghost
  const gy = y - s * 0.1 + Math.sin(S.time * 3 + sl.home) * 4;
  ctx.fillStyle = 'rgba(255,248,214,.85)'; ctx.beginPath(); ctx.arc(x, gy - s * 0.5, s * 0.38, Math.PI, 0);
  for (let k = 0; k <= 4; k++) ctx.lineTo(x + s * 0.38 - (k * s * 0.76) / 4, gy - s * 0.1 + (k % 2 ? -s * 0.08 : 0));
  ctx.closePath(); ctx.fill();
  circle(x - s * 0.12, gy - s * 0.52, s * 0.07, '#6f5d8a'); circle(x + s * 0.12, gy - s * 0.52, s * 0.07, '#6f5d8a');
  ctx.fillStyle = '#fcd34d'; ctx.font = `${s * 0.3}px system-ui`; ctx.textAlign = 'center'; ctx.fillText('★', x, gy - s * 0.9);
}

function drawChaser() {
  const ch = S.chaser; if (!ch) return;
  const x = sx(ch.x), y = sy(GROUND_ROW) + T * 0.1, cz = Z.chaser;
  if (x < -T * 4) return;

  g.addColorStop(0, 'rgba(219,58,52,.18)'); g.addColorStop(1, 'rgba(219,58,52,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, Math.max(0, x + T * 2), H);
  slimeBody(x, y, T * 4.2, cz.body, cz.dark, true);
  const cy = y - T * 3.35;
  if (cz.hat === 'crown' || cz.hat === 'icecrown') {

    ctx.beginPath(); ctx.moveTo(x - T * 0.8, cy); ctx.lineTo(x - T * 0.8, cy - T * 0.6); ctx.lineTo(x - T * 0.4, cy - T * 0.3); ctx.lineTo(x, cy - T * 0.75); ctx.lineTo(x + T * 0.4, cy - T * 0.3); ctx.lineTo(x + T * 0.8, cy - T * 0.6); ctx.lineTo(x + T * 0.8, cy); ctx.closePath(); ctx.fill();
    circle(x, cy - T * 0.3, T * 0.1, cz.hat === 'crown' ? '#ef4444' : '#4fa8d6');
  } else if (cz.hat === 'horns') {

    tri([x + T * 0.5, cy + T * 0.1], [x + T * 0.9, cy + T * 0.2], [x + T * 1.1, cy - T * 0.7], '#fde68a');
    for (let k = 0; k < 4; k++) circle(x - T * 1.2 + k * T * 0.8, cy + T * 0.3 - Math.abs(Math.sin(S.time * 6 + k)) * T * 0.3, T * 0.14, 'rgba(255,160,60,.8)');
  } else if (cz.hat === 'bolt') {
    for (const dx of [-1, 1]) {

    }
    [[-1.2, 0.2, 0.6], [-0.3, -0.2, 0.75], [0.7, 0.1, 0.62]].forEach(([dx, dy, r]) => circle(x + dx * T, cy + dy * T, r * T, 'rgba(110,115,160,.9)'));
  } else {

    tri([x - T * 1.6, cy + T * 0.6], [x - T * 1.0, cy + T * 0.5], [x - T * 2.3, cy - T * 0.3], 'rgba(214,174,240,.9)');
    tri([x + T * 1.0, cy + T * 0.5], [x + T * 1.6, cy + T * 0.6], [x + T * 2.3, cy - T * 0.3], 'rgba(214,174,240,.9)');
  }
  for (let k = 0; k < 5; k++) circle(x + T * (1.8 + k * 0.4), y - T * 0.2 - (k % 3) * 6, T * (0.32 - k * 0.04), 'rgba(160,130,90,.32)');
}

/* ---------- 主角與夥伴 ---------- */
function drawPlayer() {
  const p = player;
  if (p.inv > 0 && Math.floor(S.time * 14) % 2 === 0 && p.state !== 'finish') return;
  const cx = sx(p.x + p.w / 2), foot = sy(p.y + p.h);
  // 影子
  if (p.state === 'run' || p.state === 'climb') {
    let gy = null;
    for (let r = Math.floor(p.y + p.h); r < ROWS; r++) if (isSolid(Math.floor(p.x + p.w / 2), r) || isPlatform(Math.floor(p.x + p.w / 2), r)) { gy = r; break; }
    if (gy != null) { ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.beginPath(); ctx.ellipse(cx, sy(gy), T * 0.3, T * 0.07, 0, 0, Math.PI * 2); ctx.fill(); }
  }
  const s = T * 0.95;
  ctx.save(); ctx.translate(cx, foot);
  if (S.dashT > 0) { ctx.fillStyle = 'rgba(249,115,22,.35)'; ctx.beginPath(); ctx.ellipse(-T * 0.3, -s * 0.5, T * 0.9, T * 0.55, 0, 0, Math.PI * 2); ctx.fill(); }
  if (p.sliding) {
    // 滑行：整個身體往前趴
    ctx.rotate(-Math.PI / 2 + 0.25); ctx.translate(-s * 0.35, s * 0.1);
  } else if (p.state === 'climb') {
    ctx.translate(0, Math.sin(S.time * 18) * 2);
  } else if (!p.grounded) ctx.rotate(-0.15);
  else ctx.rotate(0.08);
  const run = p.grounded && !p.sliding && p.state === 'run' ? Math.sin(p.runT * 16) : 0;
  ctx.fillStyle = '#7f1d1d'; ctx.fillRect(-s * 0.16 + run * 4, -s * 0.12, s * 0.12, s * 0.12); ctx.fillRect(s * 0.04 - run * 4, -s * 0.12, s * 0.12, s * 0.12);
  tri([-s * 0.3, -s * 0.1], [s * 0.3, -s * 0.1], [0, -s * 0.78], '#db3a34');
  tri([0, -s * 0.1], [s * 0.3, -s * 0.1], [0, -s * 0.78], '#b72d28');
  circle(0, -s * 0.84, s * 0.22, '#ffd9b8');
  if (p.state !== 'climb') { circle(s * 0.09, -s * 0.86, s * 0.03, '#211d1d'); circle(s * 0.12, -s * 0.78, s * 0.035, '#f08b7e'); }
  tri([-s * 0.2, -s * 1.0], [s * 0.2, -s * 1.0], [-s * 0.02, -s * 1.32], '#fcd34d');
  tri([-s * 0.02, -s * 1.0], [s * 0.2, -s * 1.0], [-s * 0.02, -s * 1.32], '#e6b72e');
  ctx.restore();
}

// 夥伴圖：選單卡片和遊戲中共用
function drawPal(c, id, x, y, s, t) {
  if (id === 'slime') {
    const k = 1 + Math.sin(t * 7) * 0.06;
    c.fillStyle = '#5fae3a'; c.beginPath(); c.ellipse(x, y - s * 0.38 / k, s * 0.55 * k, s * 0.42 / k, 0, Math.PI, 0); c.lineTo(x + s * 0.55 * k, y); c.lineTo(x - s * 0.55 * k, y); c.fill();
    c.fillStyle = '#8bd45e'; c.beginPath(); c.ellipse(x - s * 0.04, y - s * 0.42 / k, s * 0.48 * k, s * 0.38 / k, 0, Math.PI, 0); c.lineTo(x + s * 0.44 * k, y - s * 0.06); c.lineTo(x - s * 0.52 * k, y - s * 0.06); c.fill();
  } else if (id === 'drop') {
    c.fillStyle = '#4fb3e8'; c.beginPath(); c.moveTo(x, y - s * 0.95); c.bezierCurveTo(x + s * 0.55, y - s * 0.4, x + s * 0.5, y, x, y); c.bezierCurveTo(x - s * 0.5, y, x - s * 0.55, y - s * 0.4, x, y - s * 0.95); c.fill();
    c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(x - s * 0.18, y - s * 0.45, s * 0.07, s * 0.14, -0.4, 0, Math.PI * 2); c.fill();
  } else if (id === 'bird') {
    c.fillStyle = '#f97316'; c.beginPath(); c.arc(x, y - s * 0.42, s * 0.4, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fbbf24'; c.beginPath(); c.moveTo(x - s * 0.1, y - s * 0.78); c.lineTo(x + s * 0.02, y - s * 1.05 - Math.sin(t * 10) * s * 0.05); c.lineTo(x + s * 0.12, y - s * 0.78); c.fill();
    c.fillStyle = '#ea580c'; c.beginPath(); c.ellipse(x - s * 0.18, y - s * 0.36, s * 0.22, s * 0.13, 0.5 + Math.sin(t * 14) * 0.4, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fde047'; c.beginPath(); c.moveTo(x + s * 0.36, y - s * 0.46); c.lineTo(x + s * 0.56, y - s * 0.4); c.lineTo(x + s * 0.36, y - s * 0.34); c.fill();
  } else {
    c.fillStyle = '#8b7cf6'; [[-0.28, -0.42, 0.26], [0.02, -0.55, 0.32], [0.3, -0.42, 0.25], [0, -0.32, 0.28]].forEach(([dx, dy, r]) => { c.beginPath(); c.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = '#fde047'; c.beginPath(); c.moveTo(x + s * 0.02, y - s * 0.12); c.lineTo(x - s * 0.1, y + s * 0.12); c.lineTo(x + s * 0.02, y + s * 0.1); c.lineTo(x - s * 0.06, y + s * 0.32); c.lineTo(x + s * 0.14, y + s * 0.02); c.lineTo(x + s * 0.03, y + s * 0.04); c.closePath(); c.fill();
  }
  const ey = id === 'drop' ? y - s * 0.32 : id === 'cloud' ? y - s * 0.45 : y - s * 0.42;
  [-0.14, 0.12].forEach((dx) => { c.fillStyle = '#fff'; c.beginPath(); c.arc(x + dx * s, ey, s * 0.09, 0, Math.PI * 2); c.fill(); c.fillStyle = '#111'; c.beginPath(); c.arc(x + dx * s + s * 0.02, ey + s * 0.01, s * 0.045, 0, Math.PI * 2); c.fill(); });
}
const palPos = { x: 0, y: 0 };
function drawCompanion() {
  const p = player;
  const tx = p.x + p.w / 2 - 1.0, ty = p.y + p.h - 1.0 + Math.sin(S.time * 3) * 0.12;
  palPos.x += (tx - palPos.x) * 0.15; palPos.y += (ty - palPos.y) * 0.15;
  const x = sx(palPos.x), y = sy(palPos.y);
  if (S.palId === 'slime' && S.shieldReady) { ctx.strokeStyle = 'rgba(124,191,74,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y - T * 0.2, T * 0.45 + Math.sin(S.time * 4) * 2, 0, Math.PI * 2); ctx.stroke(); }
  if (S.palId === 'drop') { ctx.strokeStyle = 'rgba(79,179,232,.25)'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.arc(sx(p.x + p.w / 2), sy(p.y + p.h / 2), T * 2.6, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
  drawPal(ctx, S.palId, x, y, T * 0.62, S.time);
}

function drawParticles() {
  for (const pt of particles) { ctx.globalAlpha = Math.max(0, pt.life / pt.max); circle(sx(pt.x), sy(pt.y), pt.r * T, pt.color); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const f of floaters) { ctx.globalAlpha = Math.max(0, f.life); ctx.font = `900 ${T * 0.34}px system-ui`; ctx.fillStyle = f.color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeText(f.text, sx(f.x), sy(f.y)); ctx.fillText(f.text, sx(f.x), sy(f.y)); }
  ctx.globalAlpha = 1;
}
function burst(x, y, n, color, speed = 4) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.6); particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, r: 0.05 + Math.random() * 0.06, life: 0.6, max: 0.6, color }); }
}
const floatText = (x, y, text, color = '#c98a00') => floaters.push({ x, y, text, color, life: 1 });

function drawDebug() {
  ctx.strokeStyle = '#f00'; ctx.lineWidth = 1; ctx.strokeRect(sx(player.x), sy(player.y), player.w * T, player.h * T);
  for (const r of hazardRects()) { ctx.strokeStyle = '#00f'; ctx.strokeRect(sx(r.x), sy(r.y), r.w * T, r.h * T); }
}

function render() {
  const chase = !!S.stage.chase;
  Z = zoneOf(S.stage);
  ctx.save();
  if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake * T * 0.3, (Math.random() - 0.5) * S.shake * T * 0.3);
  drawBackground(S.time, chase);
  if (level) {
    drawTerrain();
    level.snakes.forEach(drawSnake);
    level.signs.forEach(drawSign);
    level.checkpoints.forEach(drawFlag);
    drawFinish();
    level.logs.forEach(drawLog);
    level.bushes.filter((b) => b.alive).forEach(drawBush);
    level.springs.forEach(drawSpring);
    level.fans.forEach(drawFan);
    level.geysers.forEach(drawGeyser);
    level.switches.forEach(drawSwitch);
    level.doors.forEach(drawDoor);
    level.movers.forEach(drawMover);
    level.icicles.forEach(drawIcicle);
    level.slimes.forEach(drawEnemy);
    level.eggs.filter((e) => !e.taken).forEach(drawEgg);
    level.coins.filter((c) => !c.taken).forEach(drawCoin);
    drawChaser();
    if (S.mode !== 'menu') { drawPlayer(); drawCompanion(); }
    drawParticles();
    if (DEBUG) drawDebug();
  }
  ctx.restore();
  if (S.slowT > 0) { ctx.fillStyle = 'rgba(139,124,246,.12)'; ctx.fillRect(0, 0, W, H); }
  if (S.flash > 0) { ctx.fillStyle = `rgba(219,58,52,${S.flash * 0.35})`; ctx.fillRect(0, 0, W, H); }
}

/* =========================================================
 * 物理與規則
 * ========================================================= */
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pBox = () => ({ x: player.x, y: player.y, w: player.w, h: player.h });
function hazardRects() {
  const out = [];
  for (const b of level.bushes) if (b.alive) out.push({ x: b.c + 0.18, y: b.r + 0.4, w: 0.64, h: 0.6, ref: b, kind: 'bush' });
  // 橫桿在站立時頭部的高度：站著會撞到，滑行就鑽過去
  for (const l of level.logs) out.push({ x: l.c - 0.1, y: l.r - 0.35, w: 1.2, h: 0.62, kind: 'log' });
  // 噴火口只有噴火的時候危險；火焰高度一般跳就跳得過
  for (const g of level.geysers) if (geyserPhase(g) === 'fire') out.push({ x: g.c + 0.2, y: g.r + 1 - 1.2, w: 0.6, h: 1.2, kind: 'fire' });
  for (const ic of level.icicles) {
    if (ic.state === 'fall') out.push({ x: ic.c + 0.32, y: ic.y, w: 0.36, h: 0.8, ref: ic, kind: 'icicle' });
    else if (ic.state === 'landed') out.push({ x: ic.c + 0.22, y: GROUND_ROW - 0.55, w: 0.56, h: 0.55, ref: ic, kind: 'icicle' });
  }
  return out;
}

function setHeight(h) {
  if (player.h === h) return;
  player.y += player.h - h; player.h = h;
}

function hurt(reason) {
  if (player.inv > 0 || S.dashT > 0 || S.mode !== 'play') return;
  if (S.palId === 'slime' && S.shieldReady) {
    S.shieldReady = false; S.skillCd = 18; player.inv = 1.0;
    banner('🛡️ 小綠球擋下了這一下！', 'info', 1.6); beep('shield');
    burst(player.x + 0.3, player.y + 0.5, 14, '#8bd45e');
    return;
  }
  S.hearts -= 1; player.inv = 1.6; S.flash = 1; S.shake = 0.6; beep('hurt');
  player.vy = -7; player.grounded = false;
  if (reason === 'caught') banner(`被${zoneOf(S.stage).chaser.name}抓到了！快跑！`, 'warn', 1.6);
  if (S.hearts <= 0) gameOver();
}

function fellInPit() {
  S.hearts -= 1; S.flash = 1; beep('hurt');
  if (S.hearts <= 0) return gameOver();
  respawn();
  banner('掉下去了！從檢查點重來', 'warn', 1.6);
}

function respawn() {
  const cp = S.checkpoint;
  player.x = cp.x; player.y = cp.y - STAND_H; player.h = STAND_H; player.vy = 0; player.state = 'run';
  player.sliding = false; player.ride = null; player.inv = 1.6; player.jumps = 0;
  palPos.x = player.x - 1; palPos.y = player.y;
  if (S.chaser) S.chaser.x = player.x - 6.2;
}

function startRide(sn) {
  player.state = 'ride'; player.ride = { sn, t: 0 }; player.sliding = false; setHeight(STAND_H);
  floatText(player.x, player.y - 0.3, '咻～', '#7c3aed'); beep('slide');
}

function useSkill() {
  const pal = PALS[S.palId];
  if (pal.kind !== 'active' || S.skillCd > 0 || S.mode !== 'play') return;
  S.skillCd = pal.cd; beep('skill');
  if (S.palId === 'bird') { S.dashT = pal.dur; banner('🔥 火焰鳥衝刺！', 'info', 1.2); }
  else { S.slowT = pal.dur; banner('⚡ 雷雲君放慢了時間', 'info', 1.2); }
}

function stepPlayer(dt) {
  const p = player, stage = S.stage;
  p.runT += dt;
  if (p.inv > 0) p.inv -= dt;

  if (p.state === 'climb') {
    p.y -= CLIMB_V * dt;
    if (p.y + p.h <= p.ladderTop + 0.001) { p.y = p.ladderTop - p.h; p.vy = 0; p.state = 'run'; p.grounded = true; p.jumps = 0; }
    return;
  }
  if (p.state === 'ride') {
    const rd = p.ride; rd.t += dt / 1.1;
    const pts = rd.sn.pts, idx = Math.min(pts.length - 1, Math.floor(rd.t * (pts.length - 1)));
    p.x = pts[idx].x - p.w / 2; p.y = pts[idx].y - p.h * 0.8;
    if (rd.t >= 1) { p.state = 'run'; p.ride = null; p.y = rd.sn.tailRow + 1 - p.h; p.vy = 0; p.grounded = true; p.jumps = 0; }
    return;
  }
  if (p.state !== 'run') return;

  // 站在移動平台上：跟著平台一起移動
  if (p.onMover && p.grounded) { p.x += p.onMover.dx; p.y = p.onMover.y - p.h; }

  // 跳躍：起跳緩衝 + 土狼時間，小朋友按早一點、晚一點都跳得起來
  if (input.jumpPressed) p.buffer = 0.13;
  p.coyote = p.grounded ? 0.1 : p.coyote - dt;
  if (p.buffer > 0) {
    if (p.coyote > 0) {
      p.vy = -JUMP_V; p.jumps = 1; p.coyote = 0; p.buffer = 0; p.holdT = 0; p.grounded = false; p.onMover = null;
      if (p.sliding) { p.sliding = false; setHeight(STAND_H); }
      beep('jump'); burst(p.x + 0.3, p.y + p.h, 6, '#ffffff', 2);
    } else if (p.jumps < 2) {
      p.vy = -DJUMP_V; p.jumps = 2; p.buffer = 0; p.holdT = HOLD_TIME * 0.5;
      beep('djump'); burst(p.x + 0.3, p.y + p.h, 8, '#fde68a', 3);
    }
  }
  p.buffer -= dt;

  // 滑行（地上按住）；空中按下則快速落地
  if (input.slidePressed && !p.grounded) p.vy = Math.max(p.vy, 14);
  if (input.slideHeld && p.grounded && !p.sliding) { p.sliding = true; p.slideT = 0; beep('slide'); }
  if (p.sliding) {
    p.slideT += dt;
    if ((!input.slideHeld && p.slideT > 0.45) || p.slideT > 1.2 || !p.grounded) p.sliding = false;
  }
  setHeight(p.sliding ? SLIDE_H : STAND_H);

  let g = G;
  if (input.jumpHeld && p.vy < 0 && p.holdT < HOLD_TIME) { g *= 0.45; p.holdT += dt; }
  p.vy = Math.min(20, p.vy + g * dt);
  // 風扇：在風柱裡會被往上吹
  for (const f of level.fans) {
    if (p.x + p.w > f.c && p.x < f.c + 1 && p.y < f.r + 1) { p.vy = Math.max(-8.5, p.vy - 90 * dt); p.grounded = false; p.onMover = null; break; }
  }

  // 水平：自動往右跑，撞到牆就停（要跳上去）；冰面加速、輸送帶加減速
  let speed = stage.speed * (S.dashT > 0 ? 1.5 : 1);
  if (p.grounded) {
    if (p.groundKind === '~') speed *= 1.25;
    else if (p.groundKind === 'k') speed += 1.8;
    else if (p.groundKind === 'K') speed -= 1.8;
  }
  p.x += speed * dt;
  const right = Math.floor(p.x + p.w);
  let blockedDoor = false;
  for (let r = Math.floor(p.y + 0.02); r <= Math.floor(p.y + p.h - 0.02); r++) {
    if (isSolid(right, r)) { p.x = right - p.w - 0.0001; blockedDoor = cell(right, r) === 'D'; break; }
  }
  p.doorBlock = blockedDoor ? p.doorBlock + dt : 0;

  // 垂直
  const prevBottom = p.y + p.h;
  p.y += p.vy * dt;
  p.grounded = false;
  const c0 = Math.floor(p.x + 0.04), c1 = Math.floor(p.x + p.w - 0.04);
  if (p.vy >= 0) {
    const row = Math.floor(p.y + p.h);
    for (let c = c0; c <= c1; c++) {
      if (isSolid(c, row) || (isPlatform(c, row) && prevBottom <= row + 0.02)) {
        p.y = row - p.h; p.vy = 0; p.grounded = true; p.jumps = 0; p.onMover = null; break;
      }
    }
    // 移動平台：從上方落下才站得上去
    if (!p.grounded) {
      for (const m of level.movers) {
        const prevTop = m.y - m.dy;
        if (p.x + p.w > m.x + 0.05 && p.x < m.x + m.w - 0.05 && prevBottom <= prevTop + 0.1 && p.y + p.h >= m.y) {
          p.y = m.y - p.h; p.vy = 0; p.grounded = true; p.jumps = 0; p.onMover = m; break;
        }
      }
    }
  } else {
    const row = Math.floor(p.y);
    for (let c = c0; c <= c1; c++) if (isSolid(c, row)) { p.y = row + 1; p.vy = 0; break; }
  }

  if (!p.grounded) p.onMover = null;
  // 腳下是什麼地面（冰面、輸送帶、碎冰）
  p.groundKind = '#';
  if (p.grounded && !p.onMover) {
    const row = Math.floor(p.y + p.h + 0.01);
    for (let c = c0; c <= c1; c++) {
      const ch = cell(c, row);
      if (ch === 'c') { const key = `${c},${row}`; const cr = level.crumble.get(key) || { t: 0, fallen: false, back: 0, fallY: 0 }; cr.touched = true; level.crumble.set(key, cr); p.groundKind = 'c'; }
      else if (ch === '~' || ch === 'k' || ch === 'K') p.groundKind = ch;
    }
  }

  // 抓梯子：在空中碰到梯子就往上爬
  if (!p.grounded) {
    const mc = Math.floor(p.x + p.w / 2);
    for (let r = Math.floor(p.y); r <= Math.floor(p.y + p.h); r++) {
      if (isLadder(mc, r)) {
        let top = r; while (isLadder(mc, top - 1)) top--;
        if (p.y + p.h > top + 0.05) { p.state = 'climb'; p.ladderTop = top; p.x = mc + 0.5 - p.w / 2; p.vy = 0; p.sliding = false; setHeight(STAND_H); floatText(mc + 0.5, p.y - 0.2, '爬！', '#a8743f'); }
        break;
      }
    }
  }

  if (p.y > ROWS + 1.5) fellInPit();
}

function openDoor(d, msg) {
  if (d.open) return;
  d.open = true; d.t = 0;
  for (const r of d.rows) level.grid[r][d.c] = '.';
  beep('check'); S.shake = 0.25;
  if (msg) banner(msg, 'info', 1.8);
}

function stepWorld(dt) {
  const p = player, box = pBox();
  // 碎冰：被踩到之後 0.45 秒裂開掉下去，3 秒後長回來
  for (const [key, cr] of level.crumble) {
    if (cr.fallen) {
      cr.fallY += dt * 8; cr.back -= dt;
      if (cr.back <= 0) {
        const [c, r] = key.split(',').map(Number);
        if (!overlap(box, { x: c, y: r, w: 1, h: 1 })) { cr.fallen = false; cr.t = 0; cr.fallY = 0; }
      }
    } else if (cr.touched || cr.t > 0) {
      cr.t += dt;
      if (cr.t >= 0.45) { cr.fallen = true; cr.back = 3; cr.fallY = 0; const [c, r] = key.split(',').map(Number); burst(c + 0.5, r + 0.5, 6, '#bfe7f6', 2); }
    }
    cr.touched = false;
  }
  // 冰柱：靠近時搖晃，再靠近就掉下來；掉到地上變成冰刺，2.5 秒後融化
  for (const ic of level.icicles) {
    const dx = ic.c + 0.5 - (p.x + p.w / 2);
    if (ic.state === 'idle' && dx < 5.5 && dx > -1) { ic.state = 'shake'; ic.t = 0; }
    else if (ic.state === 'shake' && dx < 3.3) { ic.state = 'fall'; ic.vy = 0; }
    else if (ic.state === 'fall') {
      ic.vy += 45 * dt; ic.y += ic.vy * dt;
      if (ic.y + 0.8 >= GROUND_ROW) { ic.state = 'landed'; ic.t = 2.5; burst(ic.c + 0.5, GROUND_ROW - 0.2, 10, '#dff5fc', 3); beep('stomp'); }
    } else if (ic.state === 'landed') { ic.t -= dt; if (ic.t <= 0) ic.state = 'gone'; }
  }
  // 機關與石門
  for (const sw of level.switches) {
    if (!sw.pressed && p.state === 'run' && Math.abs(p.x + p.w / 2 - (sw.c + 0.5)) < 0.55 && p.y + p.h > GROUND_ROW - 0.35) {
      sw.pressed = true;
      level.doors.filter((d) => d.c > sw.c && d.c <= sw.c + 30).forEach((d) => openDoor(d));
      banner('🗝️ 機關打開了石門！', 'info', 1.6);
    }
  }
  for (const d of level.doors) if (d.open) d.t += dt;
  // 沒踩到機關、卡在石門前太久：門自己打開，不會卡關
  if (p.doorBlock > 1.2) {
    const d = level.doors.find((dd) => !dd.open && dd.c === Math.floor(p.x + p.w + 0.01));
    if (d) openDoor(d, '石門自己打開了（下次記得踩地上的機關）');
    p.doorBlock = 0;
  }
  // 金幣（水滴精會吸過來）
  const magnet = S.palId === 'drop';
  for (const co of level.coins) {
    if (co.taken) continue;
    const dx = p.x + p.w / 2 - co.x, dy = p.y + p.h / 2 - co.y, d = Math.hypot(dx, dy);
    if (magnet && d < 2.6) { co.x += dx * Math.min(1, dt * 7); co.y += dy * Math.min(1, dt * 7); }
    if (d < 0.6) { co.taken = true; S.coins++; beep('coin'); burst(co.x, co.y, 6, '#f4c542', 2.5); }
  }
  for (const eg of level.eggs) {
    if (!eg.taken && Math.hypot(p.x + p.w / 2 - eg.x, p.y + p.h / 2 - eg.y) < 0.75) {
      eg.taken = true; S.egg = true; beep('egg'); burst(eg.x, eg.y, 22, '#fbbf24', 4);
      banner('🥚 找到隱藏的怪獸蛋！', 'info', 2);
    }
  }
  // 史萊姆：左右巡邏；從上面踩下去打倒，側面碰到會受傷
  for (const sl of level.slimes) {
    if (!sl.alive) { sl.squash = Math.max(0, sl.squash - dt * 2); continue; }
    sl.x += sl.dir * 1.1 * dt;
    if (Math.abs(sl.x - sl.home) > 1.6) sl.dir *= -1;
    const sb = { x: sl.x - 0.38, y: sl.y - 0.62, w: 0.76, h: 0.62 };
    if (p.state === 'run' && overlap(box, sb)) {
      if (S.dashT > 0 || (p.vy > 0 && p.y + p.h - sb.y < 0.42)) {
        sl.alive = false; sl.squash = 1; p.vy = -9.5; p.jumps = 1; S.shake = 0.3;
        beep('stomp'); burst(sl.x, sl.y - 0.3, 14, '#8bd45e', 4); floatText(sl.x, sl.y - 1, '踩扁！', '#2f7d32');
      } else hurt('slime');
    }
  }
  // 蘑菇彈跳
  for (const sp of level.springs) {
    sp.boing = Math.max(0, sp.boing - dt * 3);
    const sb = { x: sp.c + 0.12, y: sp.r + 0.45, w: 0.76, h: 0.55 };
    if (p.state === 'run' && p.vy >= 0 && overlap(box, sb)) {
      p.vy = -SPRING_V; p.jumps = 1; p.holdT = 0; p.grounded = false; p.sliding = false; setHeight(STAND_H);
      sp.boing = 1; beep('spring'); burst(sp.c + 0.5, sp.r + 0.5, 10, '#ffffff', 3); floatText(sp.c + 0.5, sp.r - 0.4, 'BOING!', '#e53935');
    }
  }
  // 障礙
  if (p.state === 'run') {
    for (const hz of hazardRects()) {
      if (!overlap(box, hz)) continue;
      if (S.dashT > 0 && hz.kind === 'bush') { hz.ref.alive = false; burst(hz.x + 0.3, hz.y + 0.3, 12, '#3f7f34', 4); continue; }
      if (S.dashT > 0 && hz.kind === 'icicle') { hz.ref.state = 'gone'; burst(hz.x + 0.3, hz.y + 0.3, 12, '#dff5fc', 4); continue; }
      hurt(hz.kind);
    }
  }
  // 蛇頭：碰到就沿著蛇身滑下去（捷徑，不會受傷）
  if (p.state === 'run') for (const sn of level.snakes) if (Math.hypot(p.x + p.w / 2 - sn.head.x, p.y + p.h / 2 - sn.head.y) < 0.75) { startRide(sn); break; }
  // 檢查點
  for (const cp of level.checkpoints) {
    if (!cp.on && p.x > cp.c) {
      cp.on = true; S.checkpoint = { x: cp.c + 0.2, y: GROUND_ROW }; beep('check');
      banner('🚩 檢查點！掉下去會從這裡重來', 'info', 1.8);
      burst(cp.c + 0.7, cp.r - 0.5, 14, '#fcd34d', 3);
    }
  }
  // 追兵
  if (S.chaser && p.state !== 'finish') {
    const ch = S.chaser;
    if (p.x < level.finishCol - 3) ch.x += S.stage.speed * 0.95 * dt;
    if (ch.x + 1.9 > p.x) { hurt('caught'); ch.x = p.x - 5.5; }
    // 一直貼在畫面左邊看得到；卡在牆前或停下來就會被追上
    ch.x = Math.max(ch.x, p.x - 6.2);
  }
  // 終點
  if (p.x + p.w / 2 >= level.finishCol + 0.5 && S.mode === 'play') stageClear();

  for (const pt of particles) { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 12 * dt; pt.life -= dt; }
  particles = particles.filter((pt) => pt.life > 0);
  for (const f of floaters) { f.y -= dt * 1.2; f.life -= dt * 1.1; }
  floaters = floaters.filter((f) => f.life > 0);
}

function step(rawDt) {
  const dt = rawDt * (S.slowT > 0 ? 0.55 : 1);
  S.time += rawDt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - rawDt * 2);
  if (S.flash > 0) S.flash = Math.max(0, S.flash - rawDt * 3);
  if (S.mode !== 'play') return;
  S.runTime += rawDt;
  if (S.skillCd > 0) { S.skillCd -= rawDt; if (S.skillCd <= 0 && S.palId === 'slime' && !S.shieldReady) { S.shieldReady = true; banner('🛡️ 護盾恢復了', 'info', 1.2); } }
  if (S.dashT > 0) S.dashT -= rawDt;
  if (S.slowT > 0) S.slowT -= rawDt;
  if (input.skillPressed) useSkill();
  // 移動平台先動，主角再跟著算
  for (const m of level.movers) {
    m.clock = (m.clock || 0) + dt;
    const k = (m.clock / m.period) * Math.PI * 2 + m.phase;
    const nx = m.axis === 'x' ? m.x0 + Math.sin(k) * m.amp : m.x0;
    const ny = m.axis === 'y' ? m.y0 + ((1 - Math.cos(k)) / 2) * m.amp : m.y0;
    m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny;
  }
  stepPlayer(dt);
  if (S.mode === 'play') stepWorld(dt);
  input.jumpPressed = input.slidePressed = input.skillPressed = false;
}

function updateCamera(dt) {
  if (!level) return;
  const viewW = W / T, viewH = H / T;
  const tx = Math.max(0, Math.min(level.width - viewW, player.x - viewW * 0.3));
  cam.x += (tx - cam.x) * Math.min(1, dt * 10);
  const bottom = ROWS + 0.6, baseTop = bottom - viewH;
  // 爬高的時候鏡頭跟著往上，平常地面固定在畫面下方
  const want = Math.min(baseTop, player.y - 1.6);
  cam.top += (want - cam.top) * Math.min(1, dt * 6);
}

/* =========================================================
 * 流程：開始、失敗、過關
 * ========================================================= */
let bannerTimer = 0;
function banner(text, kind = 'info', secs = 1.6) {
  const el = document.getElementById('banner');
  el.textContent = text; el.className = `banner ${kind}`; bannerTimer = secs;
}

function startStage(idx, fromCheckpoint = false) {
  const keepCheckpoint = fromCheckpoint && S.checkpoint;
  const cp = keepCheckpoint ? S.checkpoint : null;
  const prevCoins = S.coins, prevEgg = S.egg;
  S.stageIdx = idx; S.stage = STAGES[idx];
  if (!fromCheckpoint) level = buildLevel(S.stage);
  S.hearts = 3; S.settled = false; S.shieldReady = true; S.skillCd = 0; S.dashT = 0; S.slowT = 0;
  if (!fromCheckpoint) { S.coins = 0; S.egg = false; S.runTime = 0; } else { S.coins = prevCoins; S.egg = prevEgg; }
  S.checkpoint = cp || { x: level.start.c + 0.2, y: GROUND_ROW };
  respawn(); player.inv = 0;
  S.chaser = S.stage.chase ? { x: player.x - 6 } : null;
  const viewH = H / T; cam.top = ROWS + 0.6 - viewH; cam.x = Math.max(0, player.x - (W / T) * 0.3);
  particles = []; floaters = [];
  showOnly(null);
  document.getElementById('hud').classList.remove('hidden');
  const zone = zoneOf(S.stage);
  document.getElementById('hud-title').innerHTML = `方塊衝刺 <span class="tag" style="background:${zone.tag}">${S.stage.id}${S.stage.chase ? ' 追逐' : ''}</span>`;
  document.getElementById('hud-sub').textContent = `${zone.icon} ${zone.name} · ${S.stage.name}`;
  buildProgressBar(); updateSkillUI(true);
  const hintsSeen = store.get('parkour_v4_hints', 0);
  const coarse = matchMedia('(pointer: coarse)').matches;
  const hint = document.getElementById('touch-hint');
  hint.classList.toggle('hidden', !coarse); hint.style.opacity = hintsSeen > 2 ? '0' : '1';
  if (coarse) store.set('parkour_v4_hints', hintsSeen + 1);
  countdown(() => {
    S.mode = 'play';
    if (S.stage.chase) banner(`⚠️ ${zoneOf(S.stage).chaser.name}追來了！一路往右逃！`, 'warn', 2.6);
    setTimeout(() => (document.getElementById('touch-hint').style.opacity = '0'), 5000);
  });
  if (rotateTipState === 'pending') {
    rotateTipState = 'showing';
    setTimeout(() => { rotateTipState = 'done'; resize(); }, 2000);
  }
  resize();
}

function countdown(done) {
  S.mode = 'countdown';
  const el = document.getElementById('countdown');
  el.classList.remove('hidden');
  const seq = ['3', '2', '1', 'GO!'];
  let i = 0;
  const tick = () => {
    if (S.mode !== 'countdown') { el.classList.add('hidden'); return; }
    el.textContent = seq[i]; beep(i < 3 ? 'coin' : 'check');
    i++;
    if (i < seq.length) setTimeout(tick, 550);
    else setTimeout(() => { el.classList.add('hidden'); done(); }, 450);
  };
  tick();
}

function gameOver() {
  S.mode = 'over';
  document.getElementById('over-text').textContent = S.checkpoint && level.checkpoints.some((c) => c.on) ? '沒關係，從上一個檢查點再試一次！金幣會保留喔。' : '沒關係，再試一次！';
  showOnly('over');
}

function stageClear() {
  S.mode = 'clear'; player.state = 'finish'; beep('clear');
  const lv = level, stage = S.stage;
  const coinGoal = Math.ceil(lv.totalCoins * 0.7);
  const stars = 1 + (S.coins >= coinGoal ? 1 : 0) + (S.egg ? 1 : 0);
  const prev = save.best[stage.id];
  save.best[stage.id] = {
    stars: Math.max(stars, prev?.stars ?? 0), coins: Math.max(S.coins, prev?.coins ?? 0),
    egg: !!(S.egg || prev?.egg), time: Math.min(S.runTime, prev?.time ?? Infinity),
  };
  if (S.stageIdx + 1 < STAGES.length) save.unlocked = Math.max(save.unlocked, S.stageIdx + 2);
  const nextStage = STAGES[S.stageIdx + 1];
  if (nextStage && nextStage.zone !== stage.zone) setTimeout(() => banner(`${zoneOf(nextStage).icon} 解鎖新區域：${zoneOf(nextStage).name}！`, 'info', 2.4), 900);
  persist();
  const reported = reportStars(stars, stage);

  const finalStage = S.stageIdx === STAGES.length - 1;
  document.getElementById('clear-title').textContent = finalStage ? `🎉 恭喜破關！${STAGES.length} 關全部完成` : `${stage.id}「${stage.name}」過關！`;
  const starEls = [...document.querySelectorAll('#clear-stars span')];
  starEls.forEach((el) => el.classList.remove('on'));
  starEls.forEach((el, i) => setTimeout(() => { if (i < stars) { el.classList.add('on'); beep('coin'); } }, 300 + i * 350));
  document.getElementById('clear-checks').innerHTML = [
    ['🏁 抵達終點', true, ''],
    [`<i class="coin-ico" style="vertical-align:-3px"></i> 金幣 ${S.coins}/${lv.totalCoins}`, S.coins >= coinGoal, `需要 ${coinGoal}`],
    ['🥚 隱藏的怪獸蛋', S.egg, S.egg ? '找到了' : '還沒找到'],
  ].map(([label, ok, note]) => `<div class="${ok ? 'ok' : ''}"><span>${ok ? '★' : '☆'} ${label}</span><small>${note}</small></div>`).join('')
    + `<div><span>⏱️ 用時</span><small>${S.runTime.toFixed(1)} 秒</small></div>`;
  document.getElementById('clear-reward').innerHTML = reported ? `<span class="reward">⭐ 獲得 ${stars} 星幣</span>` : '';
  const next = document.getElementById('next-btn');
  next.classList.toggle('hidden', S.stageIdx + 1 >= STAGES.length);
  setTimeout(() => { if (S.mode === 'clear') showOnly('clear'); }, 700);
}

// 回報星幣給學習挑戰群島 / 儀表板的遊戲視窗（GameModal 會負責入帳）
function reportStars(stars, stage) {
  if (S.settled || stars <= 0) return false;
  S.settled = true;
  if (window.parent === window) return false;
  try {
    window.parent.postMessage({
      type: 'QUESTMON_EARN_STARS',
      txId: `parkour-${stage.id}-${Date.now()}-${Math.floor(Math.random() * 1e6)}`,
      amount: stars,
      gameId: 'parkour',
      description: `方塊衝刺 ${stage.id}「${stage.name}」過關（${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}）`,
    }, window.location.origin);
    return true;
  } catch { return false; }
}

/* ---------- 介面 ---------- */
function showOnly(id) {
  ['menu', 'pause', 'over', 'clear'].forEach((k) => document.getElementById(k).classList.toggle('hidden', k !== id));
  if (id === 'menu') document.getElementById('hud').classList.add('hidden');
}

function buildProgressBar() {
  const el = document.getElementById('prog');
  const span = level.finishCol - level.start.c;
  el.innerHTML = '<div class="fill" id="prog-fill"></div>'
    + level.checkpoints.map((c) => `<span class="mk" style="left:${((c.c - level.start.c) / span) * 100}%">🚩</span>`).join('')
    + '<span class="mk" style="left:100%">🏁</span><span class="me" id="prog-me">🙂</span>';
}

let lastHud = '';
function updateHUD() {
  if (!level) return;
  const span = level.finishCol - level.start.c;
  const pct = Math.max(0, Math.min(100, ((player.x - level.start.c) / span) * 100));
  const fill = document.getElementById('prog-fill'), me = document.getElementById('prog-me');
  if (fill) fill.style.width = `${pct}%`;
  if (me) me.style.left = `${pct}%`;
  const key = `${S.hearts}|${S.coins}|${S.egg}`;
  if (key !== lastHud) {
    lastHud = key;
    document.getElementById('hud-hearts').textContent = '❤️'.repeat(Math.max(0, S.hearts)) + '🤍'.repeat(Math.max(0, 3 - S.hearts));
    document.getElementById('hud-coins').textContent = `${S.coins}/${level.totalCoins}`;
    document.getElementById('hud-egg').textContent = `${S.egg ? 1 : 0}/1`;
  }
  updateSkillUI(false);
}

let skillCanvas = null;
function updateSkillUI(rebuild) {
  const pal = PALS[S.palId];
  const btn = document.getElementById('skill-btn');
  if (rebuild) {
    const ico = document.getElementById('skill-ico');
    ico.innerHTML = '<i id="skill-cd"></i>';
    skillCanvas = document.createElement('canvas'); skillCanvas.width = skillCanvas.height = 92;
    skillCanvas.style.cssText = 'position:static;width:100%;height:100%';
    ico.prepend(skillCanvas);
    document.getElementById('skill-name').textContent = `${pal.name} · ${pal.role}`;
  }
  if (skillCanvas) { const c = skillCanvas.getContext('2d'); c.clearRect(0, 0, 92, 92); drawPal(c, S.palId, 46, 74, 64, S.time); }
  let state = '';
  if (S.palId === 'slime') state = S.shieldReady ? '🛡️ 護盾準備好' : `🛡️ 恢復中 ${Math.ceil(S.skillCd)} 秒`;
  else if (S.palId === 'drop') state = '🧲 自動吸金幣';
  else if (S.skillCd > 0) state = `冷卻 ${Math.ceil(S.skillCd)} 秒`;
  else state = S.palId === 'bird' ? '🔥 點我衝刺（E）' : '⚡ 點我放慢（E）';
  const cooling = (S.palId === 'slime' && !S.shieldReady) || (pal.kind === 'active' && S.skillCd > 0);
  btn.classList.toggle('cooling', cooling);
  const cd = document.getElementById('skill-cd');
  if (cd) cd.style.height = cooling ? `${Math.min(100, (S.skillCd / (pal.cd || 18)) * 100)}%` : '0';
  document.getElementById('skill-state').textContent = state;
}

let menuZone = 'grass';
function buildMenu() {
  // 區域在第一關解鎖後才能點
  const zoneOpen = (z) => STAGES.findIndex((st) => st.zone === z.id) < save.unlocked;
  document.getElementById('zones').innerHTML = ZONES.map((z) => {
    const open = zoneOpen(z), on = z.id === menuZone;
    return `<button class="zone ${on ? 'on' : ''}" ${open ? '' : 'disabled'} data-zone="${z.id}" style="${on ? `background:${z.tag}` : ''}">${z.icon} ${z.name}${open ? '' : ' 🔒'}</button>`;
  }).join('');
  document.getElementById('stages').innerHTML = STAGES.filter((s) => s.zone === menuZone).map((s) => {
    const idx = STAGES.indexOf(s), locked = idx + 1 > save.unlocked, best = save.best[s.id];
    const stars = best ? '★'.repeat(best.stars) + '☆'.repeat(3 - best.stars) : '☆☆☆';
    const z = zoneOf(s), sel = idx === S.stageIdx;
    return `<button class="stage ${sel ? 'sel' : ''}" data-stage="${idx}" ${locked ? 'disabled' : ''} style="${sel ? `border-color:${z.tag};background:${z.soft}` : ''}">
      ${locked ? '<span class="lock">🔒</span>' : ''}
      <span class="no" style="color:${z.tag}">${s.id}${s.chase ? ' · 追逐' : ''}</span><b>${s.name}</b><small>${s.desc}</small>
      <div class="stars">${stars}</div></button>`;
  }).join('');
  const pals = document.getElementById('pals');
  pals.innerHTML = Object.entries(PALS).map(([id, p]) => `<button class="pal ${id === S.palId ? 'sel' : ''}" data-pal="${id}"><canvas width="108" height="108"></canvas><b>${p.name}</b><small>${p.role}｜${p.desc}</small></button>`).join('');
  pals.querySelectorAll('.pal').forEach((el) => { const c = el.querySelector('canvas').getContext('2d'); drawPal(c, el.dataset.pal, 54, 92, 80, 0); });
  document.getElementById('sound-btn').textContent = soundOn ? '🔊 音效開' : '🔇 音效關';
  if (IS_TOUCH) document.getElementById('menu-hint').textContent = '👆 點一下跳，點兩下跳更高，👇 手指往下滑趴下';
}

function toMenu() {
  S.mode = 'menu';
  if (S.stageIdx + 1 > save.unlocked) S.stageIdx = 0;
  S.stage = STAGES[S.stageIdx];
  menuZone = S.stage.zone;
  level = buildLevel(S.stage);
  cam.x = 0; cam.top = ROWS + 0.6 - H / T;
  buildMenu(); showOnly('menu');
}

/* =========================================================
 * 輸入
 * ========================================================= */
// 用計數記住幾根手指／按鍵還按著：第二根手指點下去也要能二段跳
const held = { jump: 0, slide: 0 };
function press(kind) {
  if (S.mode !== 'play') return;
  held[kind]++;
  if (kind === 'jump') { input.jumpPressed = true; input.jumpHeld = true; }
  if (kind === 'slide') { input.slidePressed = true; input.slideHeld = true; }
}
function release(kind) {
  held[kind] = Math.max(0, held[kind] - 1);
  if (kind === 'jump') input.jumpHeld = held.jump > 0;
  if (kind === 'slide') input.slideHeld = held.slide > 0;
}
function togglePause() {
  if (S.mode === 'play') { S.mode = 'paused'; showOnly('pause'); }
  else if (S.mode === 'paused') { showOnly(null); S.mode = 'play'; }
}
addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'w'].includes(k)) { e.preventDefault(); press('jump'); }
  else if (['arrowdown', 's'].includes(k)) { e.preventDefault(); press('slide'); }
  else if (['e', 'shift'].includes(k)) input.skillPressed = S.mode === 'play';
  else if (['p', 'escape'].includes(k)) togglePause();
  else if (k === 'enter' && S.mode === 'menu') startStage(S.stageIdx);
});
addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'w'].includes(k)) release('jump');
  if (['arrowdown', 's'].includes(k)) release('slide');
});
// 觸控／滑鼠（整個畫面都可以）：
//   點一下 → 跳；再點一下（空中）→ 二段跳，等於「點兩下跳更高」
//   手指往下滑 → 趴下滑行（空中往下滑則直接落地）
//   點下去先等最多 90 毫秒：這段時間內往下滑夠遠就是滑行，否則（或手指已抬起）就是跳。
//   一般點一下本來就不到 0.1 秒，所以感覺不到延遲。
const DECIDE_MS = 90;
const swipeDist = () => Math.max(22, T * 0.45);
const gestures = new Map();
function decide(id, kind) {
  const g = gestures.get(id);
  if (!g || g.kind) return;
  clearTimeout(g.timer);
  g.kind = kind;
  press(kind);
}
cv.addEventListener('pointerdown', (e) => {
  if (S.mode !== 'play') return;
  cv.setPointerCapture(e.pointerId);
  const g = { x0: e.clientX, y0: e.clientY, kind: null, timer: 0 };
  gestures.set(e.pointerId, g);
  g.timer = setTimeout(() => decide(e.pointerId, 'jump'), DECIDE_MS);
});
cv.addEventListener('pointermove', (e) => {
  const g = gestures.get(e.pointerId);
  if (!g) return;
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  if (dy < swipeDist() || dy < Math.abs(dx)) return;
  if (!g.kind) decide(e.pointerId, 'slide');
  else if (g.kind === 'jump') { release('jump'); g.kind = 'slide'; press('slide'); } // 跳起來後往下滑：快速落地
});
const endPointer = (e) => {
  const g = gestures.get(e.pointerId);
  if (!g) return;
  if (!g.kind) decide(e.pointerId, 'jump'); // 很快的點一下
  release(g.kind);
  gestures.delete(e.pointerId);
};
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
document.getElementById('skill-btn').addEventListener('pointerdown', (e) => { e.stopPropagation(); if (S.mode === 'play') input.skillPressed = true; });
document.getElementById('pause-btn').addEventListener('click', togglePause);
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'play') togglePause(); });

document.getElementById('menu').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.stage) { S.stageIdx = +t.dataset.stage; S.stage = STAGES[S.stageIdx]; level = buildLevel(S.stage); buildMenu(); }
  else if (t.dataset.pal) { S.palId = t.dataset.pal; save.companion = S.palId; persist(); buildMenu(); }
  else if (t.dataset.zone) {
    menuZone = t.dataset.zone;
    // 換區域時選該區最後一個已解鎖的關卡
    const idxs = STAGES.map((st, i) => (st.zone === menuZone && i < save.unlocked ? i : -1)).filter((i) => i >= 0);
    if (idxs.length) { S.stageIdx = idxs[idxs.length - 1]; S.stage = STAGES[S.stageIdx]; level = buildLevel(S.stage); }
    buildMenu();
  }
  else if (t.id === 'sound-btn') { soundOn = !soundOn; store.set('parkour_v4_sound', soundOn); buildMenu(); beep('coin'); }
  else if (t.id === 'start-btn') startStage(S.stageIdx);
});
document.body.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'resume') togglePause();
  else if (act === 'restart') startStage(S.stageIdx);
  else if (act === 'menu') toMenu();
  else if (act === 'next') startStage(Math.min(STAGES.length - 1, S.stageIdx + 1));
  else if (act === 'checkpoint') startStage(S.stageIdx, true);
});

/* =========================================================
 * 主迴圈（固定步長物理）
 * ========================================================= */
let last = 0, acc = 0;
const STEP = 1 / 120;
function loop(now) {
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  // 測試用：?ts=2 讓遊戲以兩倍速跑（物理仍用固定小步長）
  acc += dt * TIME_SCALE;
  while (acc >= STEP) { step(STEP); acc -= STEP; }
  if (bannerTimer > 0) { bannerTimer -= dt; if (bannerTimer <= 0) document.getElementById('banner').classList.add('off'); }
  if (S.mode === 'menu') { cam.x = (cam.x + dt * 1.2) % Math.max(1, level.width - W / T); }
  else updateCamera(dt);
  render();
  if (S.mode !== 'menu') updateHUD();
  requestAnimationFrame(loop);
}

// 測試用掛鉤（不影響遊戲）
window.__parkour = {
  get state() { return { mode: S.mode, stage: S.stage.id, hearts: S.hearts, coins: S.coins, egg: S.egg, x: player.x, y: player.y, w: player.w, h: player.h, vy: player.vy, grounded: player.grounded, sliding: player.sliding, jumps: player.jumps, onMover: !!player.onMover, playerState: player.state, unlocked: save.unlocked, runTime: S.runTime, time: S.time } },
  start: (id) => startStage(Math.max(0, STAGES.findIndex((s) => s.id === id))),
  finish: () => { player.x = level.finishCol + 1; },
  teleport: (x, y = GROUND_ROW) => { player.x = x; player.y = y - player.h; player.vy = 0; player.state = 'run'; },
  level: () => level,
  STAGES, CHUNKS, buildLevel,
};

S.stageIdx = Math.min(save.unlocked, STAGES.length) - 1;
S.stage = STAGES[S.stageIdx];
toMenu();
requestAnimationFrame(loop);
</script>
